# New/changed Talent.dbc + TalentTab.dbc rows for the Mage class.
#
# Empty until a real ticket (Frost Mage rework) needs it — see
# docs/dbc-build-pipeline.md, which only needs this pipeline proven end to
# end, not real talent-tree content authored. Structured UI-agnostically per
# docs/talent-ui-decision.md: this is talent rows as data (row/column/rank
# chain/display text), not a thin wrapper over DBC column layout, so a
# future custom talent UI (Freepick) can consume the same source without
# changes.
#
# One file per class purely so no single file grows huge — see
# apps/dbc-tools/README.md. This file (mage.yaml) carries the full schema
# comment; the other class files just point back here.
#
# Shape, for when it's used:
#
# tabs:
#   - id: 60800                # from source/ids.yaml's talenttab block
#     name: "Example Tab"
#     class_mask: 8            # bit (class - 1), e.g. Mage = bit 2 = 4... see
#                               # docs/dbc-build-pipeline.md's ClassMask note
#     order_index: 0
#     spell_icon_id: 0
#
# talents:
#   - id: 60000                # from source/ids.yaml's talent block
#     tab_id: 60800
#     tier: 0                  # row, 0-indexed
#     column: 0
#     rank_spell_ids: [200001] # one real Spell.dbc ID per rank, low to high
#     depends_on: {talent_id: 0, rank: 0}   # 0 = no prerequisite
#     flags: 0


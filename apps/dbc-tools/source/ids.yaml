# Reserved ID blocks for everything this pipeline mints.
#
# Every future ticket (single-rank spells, Frost Mage, ...) draws new IDs from
# these ranges instead of picking numbers ad hoc, so nothing ever collides
# with stock client data or with another ticket's IDs. See
# docs/dbc-build-pipeline.md, work item 3.
#
# How the bounds were picked (checked at the time this file was written):
#   - spell:      highest ID anywhere in spell_dbc (base + pending) was
#                 100102, so 200000+ leaves a large, clearly-separate gap.
#   - talent / talenttab: talent_dbc/talenttab_dbc are currently completely
#                 empty (nothing overlaid yet), but the client's own
#                 Talent.dbc ships real IDs up in the low 20000s, so this
#                 block stays clear of those too.
#   - spellcasttimes / spellduration / spellrange / spellradius: also
#                 currently empty overlay tables; stock client data for these
#                 is small (a few dozen to ~100 rows), so 30000+ is a wide
#                 margin without needing to inspect the client files directly.
#   - skilllineability: also a currently-empty overlay table; the live base
#                 file's own IDs top out at 21980 (verified this session —
#                 see docs/skilllineability-handoff.md), so 30400+ stays clear.
#   - item:       the real client Item.dbc (var/extractors/dbc/Item.dbc, pulled
#                 from patch-enUS-3.MPQ) tops out at 56806 (asserted in
#                 DBCStores.cpp as "last client known item added in 3.3.5a") -
#                 70000+ was picked to start at the one pre-existing custom entry (70001,
#                 the Mythic Plus Keystone, removed 2026-11-05 with mod-mythic-plus).
#   - spell_group: a DB-defined spell_group id must be above SPELL_GROUP_DB_RANGE_MIN (1000,
#                 SpellMgr.h). The highest id anywhere in spell_group (base dump + every
#                 migration, checked this session) is 1126, so this block starts at 1200 for a
#                 clear gap. See apps/dbc-tools/lib/dsl/registry.py's spell_group()/
#                 spell_group_rule() - adding a *member* to a stock group (e.g. 1054, 1016) is
#                 legitimate and doesn't need an id from this block at all.
#   - spellcategory: spellcategory_dbc is a pure server-side overlay (empty base table); stock
#                 SpellCategory ids top out at 1253 (the DBC's own highest ID row, which is what
#                 DBCStructure.h's SpellCategoryEntry / sSpellCategoryStore read), and 1300-1309
#                 appeared nowhere in spell_dbc.Category, spellcategory_dbc or any migration when
#                 this block was cut, so it keeps a clear gap above stock. Widened from 1309 to
#                 1319 by Warrior T1 (1310-1312 stay unreserved, the warrior takes 1313-1319).
#                 See apps/dbc-tools/lib/dsl/registry.py's spell_category() (Paladin T1).
#
# `reuse.py` only mints a new ID from these blocks when nothing existing
# (base DBC or current overlay) already matches what's being asked for.

spell:
  start: 200000
  end: 209999
  # 202900-202909: healing sim (source/npcs/healsim_spells.py): 202900 Sim Damage Pulse, 202901 Sim Pin Hit,
  # 202902-202909 spare. A non-class owner reserves under its project name in `reservations:` at the bottom
  # (`healsim`), so lib/test_id_blocks.py's overlap test protects it from the class slices (the T0 collision
  # with Death Knight's first spell block, 2026-10-23).
  # 203700-204399: Rogue (`reservations: rogue`, rogue-rework.PLAN.md s4): shared 203700-203799, Assassination
  # 203800-203949, Combat 203950-204129, Subtlety 204130-204279, spare 204280-204399 (the P0 spike held 204370-204399).
  # 204400-204899: Warrior (`reservations: warrior`, warrior-rework.PLAN.md s4): shared 204400-204489, Arms
  # 204490-204629, Fury 204630-204769, Protection 204770-204799, spare 204800-204868, 204869-204899 = the P0 spike.
  # The September Protection build's 37 spells 200028-200066 (all but the mage's 200037 / 200044) stay below the slice.
  # 205100-205199: Mage (`reservations: mage`): 205100 Lasting Flame rank 2 (moved off 200100, see `foreign`).
  #
  # `foreign`: ids inside this block that another owner's SQL holds, never ours (lib/source.py `foreign_ids`). The
  # generated block DELETE skips them (split into ranges around each one), the stale-overlay and unchanged-block
  # checks ignore them, next_free_id never suggests them, and declaring one is a generate.py ERROR naming the owner.
  # 200100: mod-transmog's Ethereal Warpweaver pet summon (its conf's `Transmogrification.PetSpellId = 200100`),
  # inserted by the stock module's data/sql/db-world/2016_11_17_transmog_npc.sql; Lasting Flame rank 2 sat on it
  # until 2026-11-06 (.agents/plans/dbc-replay-fix/spell-200100.REPORT.md).
  foreign:
    200100: "mod-transmog (its Ethereal Warpweaver pet summon, Transmogrification.PetSpellId)"


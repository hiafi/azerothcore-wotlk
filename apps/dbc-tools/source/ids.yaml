    spell_group: {start: 1251, end: 1270}
    spelldescriptionvariables: {start: 1190, end: 1229}  # by tens
    # creature: Water 300260, Storm 300261, Spirits 300262-300265, new totems 300270-300279
    # (300298/300299 held the removed P0 spike: don't reuse).
    creature: {start: 300260, end: 300299}
    spellicon: {start: 90270, end: 90309}  # by tens
    soundentries: {start: 90081, end: 90100}
    spellvisual: {start: 90130, end: 90179}  # SpellVisual, Kit and EffectName
    creaturedisplayinfo: {start: 90440, end: 90469}
    creaturemodeldata: {start: 90440, end: 90469}
    gameobjectdisplayinfo: {start: 90010, end: 90014}
    summonproperties: {start: 3000, end: 3009}  # only if needed

  # Death Knight: .agents/plans/death-knight-rework/death-knight-rework.PLAN.md s4 (TalentTab: none, the rework
  # reuses 398 / 399 / 400).

    spell: {start: 202200, end: 202799}
    # Talent: Ele 60280-60294, Enh 60295-60309, Resto 60310-60324, spare 60325-60329.
    talent: {start: 60280, end: 60329}
    # SkillLineAbility: shared 30640-30679, Enh 30680-30689, Ele 30690-30699, Resto 30700-30709.
    skilllineability: {start: 30640, end: 30719}

# Reserved ID blocks for everything this pipeline mints.
#
# Every future ticket (single-rank spells, Frost Mage, ...) draws new IDs from
# these ranges instead of picking numbers ad hoc, so nothing ever collides
# with stock client data or with another ticket's IDs. See
# docs/dbc-build-pipeline.md, work item 3.
#
# How the bounds were picked (checked at the time this file was written):
#   - spell:      highest ID anywhere in spell_dbc (base + pending) was
#                 100102, so 200000+ leaves a large, clearly-separate gap.
#   - talent / talenttab: talent_dbc/talenttab_dbc are currently completely
#                 empty (nothing overlaid yet), but the client's own
#                 Talent.dbc ships real IDs up in the low 20000s, so this
#                 block stays clear of those too.
#   - spellcasttimes / spellduration / spellrange / spellradius: also
#                 currently empty overlay tables; stock client data for these
#                 is small (a few dozen to ~100 rows), so 30000+ is a wide
#                 margin without needing to inspect the client files directly.
#   - skilllineability: also a currently-empty overlay table; the live base
#                 file's own IDs top out at 21980 (verified this session —
#                 see docs/skilllineability-handoff.md), so 30400+ stays clear.
#   - item:       the real client Item.dbc (var/extractors/dbc/Item.dbc, pulled
#                 from patch-enUS-3.MPQ) tops out at 56806 (asserted in
#                 DBCStores.cpp as "last client known item added in 3.3.5a") -
#                 70000+ starts at the one pre-existing custom entry (70001)
#                 rather than a fresh gap, since moving it wasn't worth it.
#   - spell_group: a DB-defined spell_group id must be above SPELL_GROUP_DB_RANGE_MIN (1000,
#                 SpellMgr.h). The highest id anywhere in spell_group (base dump + every
#                 migration, checked this session) is 1126, so this block starts at 1200 for a
#                 clear gap. See apps/dbc-tools/lib/dsl/registry.py's spell_group()/
#                 spell_group_rule() - adding a *member* to a stock group (e.g. 1054, 1016) is
#                 legitimate and doesn't need an id from this block at all.
#   - spellcategory: spellcategory_dbc is a pure server-side overlay (empty base table); stock
#                 SpellCategory ids top out at 1253 (the DBC's own highest ID row, which is what
#                 DBCStructure.h's SpellCategoryEntry / sSpellCategoryStore read), and 1300-1309
#                 appeared nowhere in spell_dbc.Category, spellcategory_dbc or any migration when
#                 this block was cut, so it keeps a clear gap above stock. See apps/dbc-tools/lib/
#                 dsl/registry.py's spell_category() (Paladin T1).
#
# `reuse.py` only mints a new ID from these blocks when nothing existing
# (base DBC or current overlay) already matches what's being asked for.

spell:
  start: 200000
  end: 209999
  # 202900-202909: healing sim (source/npcs/healsim_spells.py): 202900 Sim Damage Pulse, 202901 Sim Pin Hit,
  # 202902-202909 spare. A non-class owner reserves under its project name in `reservations:` at the bottom
  # (`healsim`), so lib/test_id_blocks.py's overlap test protects it from the class slices (the T0 collision
  # with Death Knight's first spell block, 2026-10-23).

talent:
  start: 60000
  end: 60799

talenttab:
  start: 60800
  end: 60999

spellcasttimes:
  start: 30000
  end: 30099

spellduration:
  start: 30100
  end: 30199

spellrange:
  start: 30200
  end: 30299

spellradius:
  start: 30300
  end: 30399

skilllineability:
  start: 30400
  end: 30999  # extended by the warlock-rework Affliction pass (A6, PLAN §5/§9.6) - warlock
  # took 30456-30499, leaving nothing spare; the stock base file tops out at 21980 and no custom
  # SLA id existed above 30449 at the time, so 30500-30999 was free.

# item_dbc rows for custom item_template entries above 56806 (the last real
# client item - see DBCStores.cpp's own assert). Unlike every block above,
# this one wasn't picked in a vacuum: entry 70001 (Mythic Plus Keystone)
# already existed at this ID before this pipeline touched Item.dbc, so the
# range starts there instead of at a fresh gap, to avoid moving it.
item:
  start: 70000
  end: 79999

# spell_group ids for a brand-new DB-defined group (SpellMgr::LoadSpellGroups requires every
# group id to be above SPELL_GROUP_DB_RANGE_MIN, 1000). See the "How the bounds were picked"
# note above - this one wasn't picked in a vacuum either: 1200 leaves a clear gap above every
# group id already in use (base dump + migrations top out at 1126, checked this session).
spell_group:
  start: 1200
  end: 1299

# creature_template/creature_template_model entries for a rework's own NPC (e.g. a talent's
# summoned add) - lib/dsl/registry.py's creature_template(), T1 (.agents/plans/warlock-rework/
# warlock-rework.T1-HANDOFF.md). Not picked in a vacuum: four live custom creature_template
# entries already sit in this block - 300001 (Frozen Orb), 300002 (Meteor Missile), 300100
# (Divine Star) and 300102 (Tentacle of Madness, data/sql/updates/db_world/2026_09_23_12.sql) -
# checked against creature_template specifically, not just "this number appears somewhere in a
# file that also mentions creature_template" (300101 in this same range is a real entry, but it's
# gameobject_template - Angelic Feather's trap GameObject, data/sql/updates/db_world/
# 2026_09_23_00.sql - caught and corrected via code review, 2026-09-28). The warlock-rework PLAN
# (§4.5) has already pre-reserved 300140-300179 within it for the Affliction/Demonology/
# Destruction passes (Phantom Singularity, Wild Imp/Imp Gang Boss/Dreadstalker/Doomguard/
# Infernal, Chaos Rift). The stock
# client's own creature_template entries top out in the low 30000s (a 5-digit range - e.g. 30000
# "Blizzard (1)", 30011 "Sigdis the Trader"), so a 6-digit 300000+ block stays clearly separate
# from anything Blizzard ships while still covering every custom entry that predates this block.
# 300999 leaves headroom well past the warlock reservation for future reworks. The test/tool NPCs
# (training dummies, healing dummy) live in the separate npc_tools block below.
creature:
  start: 300000
  end: 300999

# Test and tool NPCs that belong to no class rework - declared with the same creature_template()
# helper as the block above, from source/npcs/training_dummies.py (dpssim stage MT0,
# .agents/plans/dpssim-multi-target/). Live entries already in it: 900001-900003 (player-facing
# Training Dummy, levels 60/70/80), 900004-900006 (the dpssim sim dummies, modules/mod-dpssim's
# SimTarget), 900007-900009 (the elite "pack" variants of those, for multi-target sim runs) and
# 900011/900013/900014 (Healing Training Dummy, its combat variant and its combat anchor).
# 900010 (Quinn Testbury) and 900012 (Ursana) are NPC tools too but stay hand-written. A creature
# entry in either this block or the creature block above passes creature_template()'s check.
npc_tools:
  start: 900000
  end: 900099

# SpellDescriptionVariables.dbc entries for tooltip_vars() (potency-system.PLAN.md P9, D9: explicit
# ids, like spell_group). Client-only table with no SQL overlay, so there is no live state to
# auto-allocate against. The stock file (var/extractors/dbc/SpellDescriptionVariables.dbc, from
# patch-enUS-3.MPQ) has 30 rows with ids 1-181, so 1000+ leaves a clear gap. The P9.0 spike used
# 1990/1991 as throwaway scratch ids; they were never committed.
spelldescriptionvariables:
  start: 1000
  end: 1999

# spellcategory_dbc ids for spell_category() (Paladin T1, .agents/plans/paladin-rework/
# paladin-rework.T1-HANDOFF.md) - a shared category cooldown across several spells (the paladin
# auras' 15 s one, 1300). Stock ids top out at 1253 and 1300-1309 are unused anywhere (checked
# against spell_dbc.Category, spellcategory_dbc base + updates, and every migration), so this is a
# ten-id block clear of stock. Server-only: no client SpellCategory.dbc row is generated.
spellcategory:
  start: 1300
  end: 1309

# --- Client-patch id blocks (shaman-rework T1, .agents/plans/shaman-rework/shaman-rework.T0a-REPORT.md s1) ---
#
# The blocks below name the id ranges of DBC tables that generate.py does NOT build: SpellIcon (patch-I),
# SoundEntries, SpellVisual/SpellVisualKit/SpellVisualEffectName, CreatureDisplayInfo/CreatureModelData and
# GameObjectDisplayInfo (patch-M, the patch_*_vfx_models.py / build_patch_*.py scripts) and SummonProperties
# (server-side). Until now those ids lived only as constants in the per-class patch scripts, so the PLAN's id
# table was the only guard against two classes minting the same number. Nothing mints from these blocks
# (no reader outside lib/test_id_blocks.py looks at them); they exist so a test can check every class's
# reservation (the `reservations:` key at the bottom) sits inside the tool-wide range and overlaps no other
# class. Each range contains every id already used, checked against the constants in build_patch_*.py and
# patch_*_vfx_models.py and the maxima in the shaman T0a report (2026-10-18):
#   - spellicon:  used 90100-90239 (build_patch_i.py ICON_ID_*). 90100 is the first id: the Ascension icon
#                 mining started above CreatureDisplayInfo's 90001+ rows (a different table, same numbers).
#   - soundentries: used 90001-90033 (druid 1-4, priest 5-10, warlock 11, paladin 31-33). Widened from 90100 to
#                 90199 by Death Knight T1 (shaman's slice filled 90081-90100); Death Knight reserves 90101-90120.
#   - spellvisual: SpellVisual, SpellVisualKit and SpellVisualEffectName share these numbers. Used 90001-90091
#                 (mage from 90001, hunter glaive toss 90090/90091 are the highest). Widened from 90199 to 90299
#                 by Death Knight T1 (shaman's slice filled 90130-90179); Death Knight reserves 90180-90249.
#   - creaturedisplayinfo / creaturemodeldata: used 90001-90321 / 90001-90310 (mage 90001-90003, the shapeshift
#                 appearances 90100-90399 of build_patch_f.py).
#   - gameobjectdisplayinfo: used 90001 (client patch-M).
#   - summonproperties: stock DBC tops out at 2935 (SummonProperties.dbc, 200 rows); the overlay table is empty.
spellicon:
  start: 90100
  end: 90399

soundentries:
  start: 90001
  end: 90199

spellvisual:
  start: 90001
  end: 90299

creaturedisplayinfo:
  start: 90001
  end: 90499

creaturemodeldata:
  start: 90001
  end: 90499

gameobjectdisplayinfo:
  start: 90001
  end: 90099

summonproperties:
  start: 3000
  end: 3099

# spellrunecost_dbc ids for spell_rune_cost() (Death Knight T1, .agents/plans/death-knight-rework/
# death-knight-rework.T1-HANDOFF.md). The stock SpellRuneCost.dbc has 475 rows with a maximum id of 2513, the
# spellrunecost_dbc overlay is empty, and spell_dbc.RuneCostID tops out at 2467 (T0 report s1.1), so 2600-2629 is
# clear of all three. Read by registry.spell_rune_cost() (an id outside the block raises) and by generate.py's
# undeclared-cost ERROR; the client SpellRuneCost.dbc rows ship in patch-Z.
spellrunecost:
  start: 2600
  end: 2629

# Per-class reservations (and non-class owners, see `healsim` below), one entry per table the owner draws ids from,
# each inside the tool-wide block of the same name above (or the spell/talent/... blocks earlier in this file).
# Kept under ONE key because every
# reader of this file indexes it by table name (source.load_ids, ids.next_free_id, reuse.ReuseContext,
# webui/app.py, registry.py's ids_cfg.get(...), apps/item-tools' item_range()) and none iterates it, so a
# new top-level mapping is invisible to them. lib/test_id_blocks.py checks that reservations stay inside their
# block, overlap no other owner, and contain every id a class's source/classes/<class>/ declares.
# Shaman: .agents/plans/shaman-rework/shaman-rework.PLAN.md s4 (TalentTab: none, the rework reuses 261/262/263).
reservations:

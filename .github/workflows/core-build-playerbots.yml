# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: ubuntu-build

on:
  push:
    branches: [ "Playerbot", "test-staging" ]
  pull_request:
    branches: [ "Playerbot", "test-staging" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
          - os: ubuntu-22.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}

    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v3

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Checkout Playerbot Module
        uses: actions/checkout@v3
        with:
          # Fork carrying patches for this repo's custom core changes (see docs/bugs-and-fixes.md)
          repository: hiafi/mod-playerbots
          # Fork only tracks master (no test-staging split like upstream); also, github.ref_name
          # is the PR merge ref (e.g. "42/merge") on pull_request events, never the branch name,
          # so a ref_name == 'Playerbot' check here would never match on PR builds anyway.
          ref: master
          path: modules/mod-playerbots

      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make gcc g++ clang \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev mysql-server libboost-all-dev

      - name: Configure CMake
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}
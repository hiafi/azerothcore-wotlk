#
# DpsSim profile: UnholyDkPlagueSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the Death Knight rework S3b-1
# (.agents/plans/death-knight-rework/death-knight-rework.S3b-HANDOFF.md, part F, U38; the shape of FrostDk2hSim.conf and
# its balance-pass flat block, like the Ret, Enhancement and Frost profiles).
#
# Runs the reworked Unholy Death Knight's DPS rotation, the 6.4 "unholy plague" build (Festering Wounds from Plague
# Strike, Scourge Strike bursts them, Pestilence on packs).
# mod-playerbots branch feat/dk-unholy-bot-strategy: the "unholy" and "unholy aoe" strategies,
# data/strategies/dk/unholy.yaml and unholy-pack.yaml, DeathKnightReworkUnholyStrategy; the rows of dk/nc-unholy put the
# Rune of Boiling Blight 203042, Horn of Winter 57330 and the permanent ghoul (Raise Dead 46584, Master of Ghouls 52143)
# up in the pre-pull buff phase. Guide: docs/reworks/bot-strategy/death-knight-unholy-bot-guide.md.
#
# RACE: pass 1 (Human) on the command line, level 60.
#   modules/mod-dpssim/tools/run-sim.sh UnholyDkPlagueSim 60 60 1 5 # 60 s x 5, single target
#   modules/mod-dpssim/tools/run-sim.sh UnholyDkPlagueSim 300 60 1 5 # the 300 s x 5 gate (U36)
#   modules/mod-dpssim/tools/run-sim.sh UnholyDkPlagueSim 60 60 1 5 100 3 # 3 targets (the pack list; 5, 10)
# Smoke run with the log kept: DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh UnholyDkPlagueSim 60 60 1 1
# Expected log lines: "SimActor created" (the two-hander below, no "could not equip"), "strategies resolved" (combat
# [unholy, unholy aoe, ...], non-combat [... nc ...]), "actor after the first second" (the Rune of Boiling Blight
# 203042 and Horn of Winter 57330 up; the Strength of the sheet; the Mastery, Proc Chance and haste percentages the log
# prints are the ones expected procs are judged by, not the ratings below), then the iteration summaries.
# The plague build's setup: the ghoul raised before the pull, Boiling Blight and Horn up at the pull (auraEvents at
# t <= 0, minionSamples at t <= 0), Festering Wound 203456 stacking on the dummy (mostly 2 to 7), no Necromantic
# Energy 203461 and no Lesser Ghoul (it has no Necromancy).
# The report's powerSamples[] (runic power and ready runes every 500 ms) is the check for runic power at the cap and for
# idle runes; minionSamples[] (the alive minions per creature entry, every 500 ms), the hits and spells rows'
# sourceEntry (the permanent ghoul 26125, Lesser Ghoul 300320, Abomination 300321, Gargoyle 27829, Army of the Dead
# ghoul 24207) and the auraEvents rows with unit "pet" (Shadow Infusion 203464, Dark Transformation 203448) are the
# minion checks.
#
# The DPS gate (U36) counts the Death Knight and every minion EXCEPT the Army of the Dead's ghouls (entry 24207): Army's
# 6 to 10 minute cooldown overweights a 300 s window, so its burst is reported on its own (a 60 s x 3 run with the boss
# rank, DPSSIM_TARGET_RANK). Band 900 to 1,150 at 300 s x 5; the two builds within +/-10%.
#
# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_DEATH_KNIGHT (SharedDefines.h)
Class = 6

# Talents: the bot guide's 6.4 "unholy plague" 60 link (Playerbots.PremadeSpecLink.6.4.60 of
# modules/mod-playerbots/conf/playerbots.conf.dist), decoded against the BUILT Talent.dbc (tab 400, 35 talents): 51
# points, every rank and row gate legal, nested in the .15 .. .50 links (.15 .20 .25 .30 .40 .45 .50).
# Unholy is the third tab (two dashes for the empty Blood and Frost tabs).
PlayerbotTalents = --23021303130212013003000230033331021

# Unglyphed actor: all glyphs are retired server-wide.
PlayerbotGlyphs = false

# The pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs; default 15000): the Rune of Boiling Blight, Horn of
# Winter and Raise Dead (the ghoul) are three global cooldowns out of combat, with room to spare
PrePullBuffMs = 20000

# Gear/stats: the balance pass's flat block (the user's in-game Ret paladin of 2026-10-05, as RetPaladinSim.conf and
# FrostDk2hSim.conf: 800 attack power, 134 crit, 32 haste, 15 mastery, 8 cooldown haste, 25 versatility, 19 proc
# chance), so the Death Knight is measured on the same footing as the other reworked melee profiles. Hit and expertise
# stay 0: this server gives 100% PvE hit and expertise. Only the weapon is worn; its own stats come on top. Checked
# against the live item_template and item_itemization on 2026-10-25 (class 2, subclass 8 two-handed sword, quality 4,
# RequiredLevel 60, ilvl 66, FlagsExtra 0, AllowableRace -1, AllowableClass 32767 which has the Death Knight bit,
# maxcount 0, no proc or spell, +20 Str +9 Agi +20 Sta, itemization row budget_mult 0.791):
#   Two-hand   21492 Manslayer of the Qiraji     (two-hand sword, 3.6 speed, 157.5-292.5; the speed the Unholy doc's
#              numbers are written for). Alternatives: 22348 Doomulus Prime (3.8), 18538 Treant's Bane (3.4)
Gear = 21492

# AttackPower is a flat top-up on top of level / Strength / gear (RetPaladinSim.conf: 368)
SpellPower = 0
AttackPower = 368

CritRating = 134
HasteRating = 32
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 15
VersatilityRating = 25
CooldownHasteRating = 8
ProcChanceRating = 19

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# The Unholy rotation is measured by the 300 s x 5 runs, not by stat weights
StatWeightsEnabled = false

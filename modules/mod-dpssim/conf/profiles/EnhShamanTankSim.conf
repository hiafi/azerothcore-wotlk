#
# DpsSim profile: EnhShamanTankSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the SIMALL stage
# (.agents/plans/tank-sim/tank-sim.STAGE-SIMALL-HANDOFF.md); the tank-sim profile of the Enhancement "enh tank" build.
#
# Tank-sim profile (plan .agents/plans/tank-sim/tank-sim.PLAN.md): "Mode = Tank" sends the batch down the tank path
# (SimDaemon::RunTankBatch): the DPS sim with every dummy auto-attacking the actor. See ProtWarriorTankSim.conf for the
# scenarios (TankScenario dps / survive, TANKSIM_SCENARIO per run), the boss (1 target) and pack (2-10) numbers, and the
# run commands. Bot strategy exercised: the reworked Enhancement tank rotation (ShamanReworkEnhTankStrategy, data/
# strategies/shaman/enh-tank.yaml, selected when the bot knows Living Earth: ai::shaman_rework::IsTankBuild). The "enh"
# combat strategy is the same one EnhShamanSim runs; the log's "strategies resolved" line shows the tank rows by name.
#
# GEAR: the "Shaman Tank Dungeon Gear" mail list of docs/.items.md (user ruling 2026-11-01: a shaman wears mail), with
# the profile's own two one-handers and no shield (the tank rotation is built on two one-handers; its shield is the
# elemental Earth/Lightning Shield). Real items only; see the Gear/stats block above the Gear line.
#
# RACE: pass 2 (Orc), as EnhShamanSim. Run at level 60:
#   modules/mod-dpssim/tools/run-sim.sh EnhShamanTankSim 60 60 2 5                             # dps, boss
#   TANKSIM_SCENARIO=survive modules/mod-dpssim/tools/run-sim.sh EnhShamanTankSim 60 60 2 5    # survive, boss
#
Mode = Tank

# dps: health refilled after every step, never dies. survive: no refill, the run ends at the death (TTD).
TankScenario = dps
# The boss (1 target), before armor and the victim's damage-taken modifiers; each pack dummy (2+ targets).
TankHitDamage = 2250-2750
TankPackHitDamage = 500-600
TankSwingMs = 2000
TankDummyCrit = true

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_SHAMAN (SharedDefines.h)
Class = 7

# Talents: the guide's 7.6 "enh tank" 60 link (docs/reworks/bot-strategy/shaman-enhancement-bot-guide.md, and
# Playerbots.PremadeSpecLink.7.6.60 of modules/mod-playerbots/conf/playerbots.conf.dist). The live env/dist/etc/modules/
# playerbots.conf has no 7.6 entry at all (it predates the shaman rework), so the .dist string is the only one. The
# build holds Living Earth (the castable of the tank talent), which makes IsTankBuild true; Enhancement is the second
# tab (51 points).
PlayerbotTalents = -3202103033333301310000011033201231

# Unglyphed actor: all shaman glyphs are retired server-wide.
PlayerbotGlyphs = false

# Gear/stats (user 2026-11-01, normalized like the DPS profiles): real item level 55-65 blue mail dungeon gear and no
# flat primary stats. Gear: the "Shaman Tank Dungeon Gear" list of docs/.items.md (mail armor and jewelry, no trinkets,
# no item-set bonus, no random-property item). Weapons: Dark Iron Destroyer 17016 (main hand) and Bone Slicing Hatchet
# 18737 (off hand), a legal Dual Wield pair, are part of the list. This replaces the leather Feral Tank list used
# earlier the same day (armor 1382 at creation) and the old mail Bloodsoul set. The gear's itemization shapes also add
# the five custom secondaries, unevenly; the flat ratings below top them up (or trim them, when negative) so the sheet
# reads the plate set's 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance, as in every
# normalized DPS profile (user 2026-10-31). Gear-only values the top-ups correct: haste 25, mastery 9, versatility 0,
# cooldown haste 17, proc chance 10. Crit is whatever the gear gives. The "SimActor sheet" log line
# (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
# Items, in order: 18421 Backwood Helm, 21792 Necklace of the Diamond Tower, 18686 Bone Golem Shoulders, 18495 Redoubt
# Cloak, 18530 Ogre Forged Hauberk, 18394 Demon Howl Wristguards, 22410 Gauntlets of Deftness, 18393 Warpwood Binding,
# 12964 Tristam Legguards, 18047 Flame Walkers, 2246 Myrmidon's Signet, 17713 Blackstone Ring, 17016 Dark Iron
# Destroyer, 18737 Bone Slicing Hatchet.
# Sheet at creation (level 60, race 2, before talents, stance and buffs): Strength 100, Agility 229, Stamina 250,
# Intellect 118, armor 2776, crit 40, max health 3743, max mana 3010.
Gear = 18421,21792,18686,18495,18530,18394,22410,18393,12964,18047,2246,17713,17016,18737

SpellPower = 0
AttackPower = 0

CritRating = 0
HasteRating = 7
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 6
VersatilityRating = 25
CooldownHasteRating = -9
ProcChanceRating = 9

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Tank stat weights are stage TS4 (against TTD and net DTPS), not this DPS tool
StatWeightsEnabled = false

#
# DpsSim profile: ProtPaladinTankSim
#
# Tank-sim profile (plan .agents/plans/tank-sim/tank-sim.PLAN.md, T6): a level-60 Human Protection Paladin that the
# dummies swing at. "Mode = Tank" sends the batch down the tank path (SimDaemon::RunTankBatch): the DPS sim with every
# dummy auto-attacking the actor. Format: "Key = Value" lines, "#" comments, blank lines ignored. The scenarios, the
# dummies and the report are the ones ProtWarriorTankSim.conf's header describes (dps: health refilled, tank DPS / TPS /
# DTPS; survive: no refill, time to death).
#
# Bot strategy exercised: the reworked Protection rotation, PaladinReworkProtStrategy (C++,
# src/Ai/Class/Paladin/Rework in mod-playerbots): Righteous Fury, Holy Shield kept up ("prot holy shield missing"),
# Avenger's Shield / Judgement / Shield of Righteousness / Hammer of the Righteous / Crusader Strike / Consecration, the
# pack rows, the emergencies (Lay on Hands, Divine Shield, Guardian of Ancient Kings, Divine Protection, self Holy
# Light under Radiant Bulwark), and the Bulwark multiplier. Bulwark is the Paladin's resource, an aura (201360) the
# tank samples record as its stack count. The strategy turns the bot to its target with "set facing" ("not facing
# target", normal + 7): watch the swings' front-arc flag and the "ended the iteration N yd away" warning (plan R3).
#
# Race: Human (run-sim.sh's [race] argument 1), as HolyPaladinHealSim and the warrior tank.
#
# Run it from the repo root (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs]
# [targets]):
#   modules/mod-dpssim/tools/run-sim.sh ProtPaladinTankSim 120 60 1 10                              # dps, boss
#   TANKSIM_SCENARIO=survive modules/mod-dpssim/tools/run-sim.sh ProtPaladinTankSim 120 60 1 10     # survive, boss
#   modules/mod-dpssim/tools/run-sim.sh ProtPaladinTankSim 120 60 1 10 100 5                        # dps, 5-pack
#

Mode = Tank

TankScenario = dps
TankHitDamage = 2250-2750
TankPackHitDamage = 500-600
TankSwingMs = 2000
TankDummyCrit = true

# Pre-pull buff phase: the default 15000 sim ms (aura, seal, blessing, Righteous Fury).

# Dummy armor: the same 4,350 as every tank profile.
TargetArmor = 4350

# CLASS_PALADIN (SharedDefines.h)
Class = 2

# Talents: AiPlayerbot.PremadeSpecLink.2.1.60 ("prot pve") of the live env/dist/etc/modules/playerbots.conf (the
# rework's level-60 build). Decoded against the live talent_dbc (tabs in tab-page order: Holy 382, Protection 383,
# Retribution 381; talents in (row, column) order): 51 points, all in Protection, every rank and row gate legal:
#   Improved Consecration 3/3, Combat Expertise 3/3, Sanctified Resolve 3/3, Improved Seal of Command 2/2, Hammer of the
#   Righteous 1/1, Improved Righteous Fury 3/3, Tenacity 3/3, Improved Hammer of the Righteous 2/2, Light's Reservoir
#   2/2, Improved Devotion Aura 3/3, Blessing of Sanctuary 1/1, Holy Shield 1/1, Touched by the Light 3/3, Redoubt 3/3,
#   Shield Discipline 2/2, Divinity 3/3, Avenger's Shield 1/1, Vengeful Bulwark 2/2, Radiant Bulwark 3/3, Divine
#   Sacrifice 1/1, Shield of the Templar 2/3, Avenging Light 3/3, Guardian of Ancient Kings 1/1
# (the Holy tab's "0" spends nothing). PlayerbotAI::IsTank(bySpec) reads the Protection tab, so the bot is a tank.
PlayerbotTalents = 0-030332001332231100330231002310020301

# Unglyphed, as every tank profile (the live AiPlayerbot.BotGlyphs = 0 would win anyway).
PlayerbotGlyphs = false

# Gear: docs/.items.md "Protection Paladin/Warrior Tank Dungeon Gear", the same 13 items as ProtWarriorTankSim (the
# warrior's header lists them). Real items, no synthetic top-up. Gear totals: armor 5,940, block 40, Strength 141,
# Agility 57, Stamina 147, Spirit 31, defense rating 88, hit 15 (no effect), crit 21; no Intellect, so the mana pool is
# the base one (Divine Plea and the Bulwark heals carry it).
# Expected sheet (level-60 Human paladin: player_class_stats 1,381 health, 1,512 mana, 105 Strength, 65 Agility, 100
# Stamina, 70 Intellect; before auras, blessings and Righteous Fury - compare the "actor after the first second" line):
#   Strength 246, Agility 122, Stamina 247 -> health 1,381 + (247 - 20) x 10 + 20 = 3,671 before Kings / talents;
#   armor 5,940 + 2 x 122 = 6,184, about 6,384 with the Valor 2-piece bonus, plus Devotion Aura (Improved 3/3) on top;
#   defense 358 (+2.32% dodge, parry and block), parry about 7.3%, block about 7.3% base (+ Holy Shield and Redoubt
#   while up), dodge from Agility about 5-6%;
#   block value (40 + 246 / 2 - 10) = 153 before the talents' multipliers.
# Crit chance: 5.6% from a +3 boss minus 2.32% from the 58 extra defense = about 3.3% unless a talent or aura takes the
# rest. Whether this build reaches crit immunity is a TS3b finding (the expected crit chance after the first second);
# a crit taken while that chance is above 0 is not a bug.
Gear = 12640,21792,16733,18495,16730,16735,16737,16736,16732,16734,22680,19104,12602

SpellPower = 0
AttackPower = 0

StatWeightsEnabled = false

#
# DpsSim profile: FuryWarriorPackSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this file.
# Format: "Key = Value" lines, "#" comments, blank lines ignored. Shape of ArmsWarriorSim.conf and
# WarriorRage2HStartSim.conf. Warrior rework stage S3 (Fury), D43 / D46 in .agents/plans/warrior-rework/warrior-
# rework.S3-HANDOFF.md.
#
# PURPOSE: the reworked Fury rotation on the PACK build (bot slot 1.4 "fury packs"): the raid build (slot 1.3) plus
# Improved Cleave 3/3 (Cleave hits 3 targets, +15%) and Improved Whirlwind 2/2 (+6%, cooldown 10 -> 8 s), paid for by
# Commanding Presence 2, Improved Execute 2 and Armored to the Teeth 2 -> 1 (AoE round 3, 2026-11-16, user ruling:
# every DPS spec about 2,500-2,800 at 5 targets; the earlier pack build with Dance of Death, Blood Craze, Fresh Meat,
# Piercing Howl and Deathmaker, no Blood Rush / Merciless / Unbridled Wrath / Flurry, ran no better than the raid
# build at 5 targets); mod-playerbots data/strategies/warrior/fury-pack.yaml. Same gear and stats as
# FuryWarriorSim.conf, so the two compare. TARGET COUNT is the 7th run-sim.sh argument (this file has no target key):
# run it at 3 and 5 targets (2+ targets use the elite pack dummies 900007-9 within 3 yd, all engaged at the pull). 1
# target works as a smoke test but the pack rows then never open.
#
# RUN (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets]; the user default is
# 60 s x 5 iterations at a 100 ms step, level 60, race 2 = Orc: a Human start has an attackable Wild Turkey 17.5 yd
# away that changes "enemies within 8 yd" counts, so every Fury run uses Orc and the baselines compare):
#
#  DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh FuryWarriorPackSim 60 60 2 5 100 3
#  DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh FuryWarriorPackSim 60 60 2 5 100 5
# Add DPSSIM_TARGET_RANK=boss to test a boss-gated row at a pack size.
# Check the realm flag after the sims (sims set realmlist.flag=1; builds older than the Main.cpp gate need `flag &
# ~1`). The sim reads the live world DB and runs the live image: generate + db-import and the image rebuild must be
# live before any Fury sim. The first smoke run keeps ONE iteration only (read the log before the numbers):
#
#  DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh FuryWarriorPackSim 60 60 2 1 100 3
#
# WHAT TO READ: Whirlwind 7-10 a minute with one hit per target per cast (cooldown 8 s, minus 1.5 s per Cleave);
# Cleave presses and that EACH Cleave hits 3 targets at the same ms (Improved Cleave capstone, damage x1.15);
# Bloodthirst >= 9, Rampage >= 4 (Blood Rush 2/2 makes some of them free: 204637); Enrage uptime and meter fills;
# Deathmaker and Fresh Meat are not on this build (rows known()-gated, never fire); Bloodsurge (204652)
# consumed by Cleave on 2+ targets. Idle GCDs (the D46 pack budget: Whirlwind 8.5, Rampage 4.9 / 5.4, Cleave ~5.6
# Bloodsurge-free, ~11-12 idle GCDs a minute: a design gap, report it, do not fix it); rage gained and spent per
# minute against rage_sweep.py's FURY_SPEND_14. Off-hand white swings are the pseudo spell id 0xFFFF0001.
# Target 0 only for auras on the target: whether every Cleave / Whirlwind copy applies something to its own target is
# not observed.
#
# Aura samples (AuraSampleIds, sampled every step for the actor, plus this actor's aura on target 0; they fill the
# report's auraSamples[] {ts, spellId, onTarget, stacks, remainingMs}: stack counts and refreshes over time, which
# auraEvents (first apply / removal only) cannot give):
#  204635 Enrage meter (19 stacks, one per 10 rage paid; the stack count resetting is a meter fill)
#  204636 Enrage (the buff; a refresh while up shows as remainingMs jumping up)
#  12292 Death Wish, 1719 Recklessness (stacks = charges, one per Rampage), 2458 Berserker Stance
#  204637 Blood Rush free Rampage, 204652 Bloodsurge (free Slam / Cleave), 204638 Deathmaker (Execute usable)
#  12966 / 12967 / 12968 Flurry buff ranks 1 / 2 / 3, 204651 Titan's Grip penalty (D31; 49152 is forced to 0)
#  204642 Cadence (Quick Execution), 204643 Will of the Berserker crit, 204644 / 204645 / 204646 Shredding Blows buff
#  ranks 1 / 2 / 3, 204641 Improved Execute crit stack, 23885 Bloodthirst heal buff.
# A buff the build does not own (its talent is not bought) simply never shows.
#
# TALENTS: the 1.4 .60 link (warrior-fury-bot-guide.md "Talent strings"; Playerbots.PremadeSpecLink.1.4.60), 51 points
# on the 31-talent Fury grid. Proved legal (rank <= max, 5 points in the rows above per row; row sums r0:7 r1:7 r2:1
# r3:10 r4:1 r5:5 r6:5 r7:5 r8:4 r9:5 r10:1). Was -0330320130505012210032205013031 (before AoE round 3).
# Decoded:
#  Armored to the Teeth 1, Cruelty 3, Merciless 3, Improved Cleave 3, Frenzied Blows 2, Unbridled Wrath 2,
#    Bloodthirst 1, Dual Wield Specialization 5, Enrage 5, Death Wish 1, Improved Bloodthirst 2, Flurry 3, Unshackled
#    Fury 3, Improved Whirlwind 2, Improved Berserker Stance 5, Rampage 1, Bloodsurge 3, Blood Rush 2, Unending Fury
#    3, Titan's Grip 1.
# Not bought:
#  Dance of Death, Blood Craze, Fresh Meat, Piercing Howl, Deathmaker, Commanding Presence, Improved Execute, Quick
#    Execution, Intensify Rage, Shredding Blows, Will of the Berserker (Armored to the Teeth 1 of 3).
#
# Gear (D43, re-geared 2026-10-31): TWO copies of 12784 Arcanite Reaper, Titan's Grip; identical to FuryWarriorSim.conf.
#
# BLIND SPOTS (the sim cannot show these; report "not observed", do not file them as bugs):
#  - the dummy never attacks: no rage from damage taken, no Enraged Regeneration, no Berserker Rage trigger, no
#    Victory Rush (it needs a kill);
#  - the dummy never casts: Pummel and interrupt rows stay dead (Intensify Rage's capstone is blind);
#  - the dummy stands within 3 yd of the pull: Charge and Heroic Leap have an 8 yd minimum range, so those rows are
#    dead (no in-combat Charge rage);
#  - one passive dummy: no tank-engaged timing, "few rallied" is true so Skull Banner always fires on a boss;
#    boss(target) is true only on 1-target runs, elite(target) on 2+;
#  - Execute and the Execute phase rows need the dummy under 35% / 20% health: use the health-drain variant
#    (FuryWarriorCoverDrainSim.conf);
#  - the damage numbers are an estimate gear set (below), not a captured sheet; this is a ROTATION-SANITY sim, no DPS
#    target (balance belongs to stage M).
#
# SCRATCH COPIES made by the harness by path (copy this file, change the lines named, run the copy; nothing else
# differs):
#  (the scratch level 45 / 30 copies belong to FuryWarriorSim.conf)


#
# DpsSim profile: RetPaladinSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for
# the full field list.
#
# Runs the reworked Retribution rotation (mod-playerbots branch rework-bot-strategies,
# PaladinReworkRetStrategy behind the "dps" strategy) - see
# .agents/plans/rework-bot-strategies/rework-bot-strategies.PLAN.md, Stage S. Run at level 60 (run-sim.sh's
# default), Human (race 1, also the default).
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. Exercises Divine Storm, Consecration, Holy Wrath and Wake of Ashes from 2
#   targets; Execution Sentence and Judgement of Command from 3. Dwarf (3) has a clean start.
#   modules/mod-dpssim/tools/run-sim.sh RetPaladinSim 180 60 3 5 100 3

# Pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs) - absent here, so the default of 15000 sim ms applies:
# before every iteration the Ret paladin spends 15 s out of combat on its buff strategies (Retribution Aura,
# Blessing of Might), unrecorded, then pulls. Seals come from the combat strategies, after the pull.
# `PrePullBuffMs = 0` turns the phase off (the bot starts every iteration in combat, unbuffed, as before).

# Optional dummy health drain (SimProfile.h, Profile::DummyHealthDrain/DummyMaxHealth) - both off/absent here:
#   DummyHealthDrain = true   the dummy takes real damage but never drops below 1 health, and is refilled at the
#                             start of every iteration, so "target below 20%"-style execute rows can fire.
#   DummyMaxHealth = <n>      the dummy's max health (what those percentages are measured against); absent or 0 =
#                             SimTarget's default of 100,000,000. Set it to something a fight can drain.
# With neither key present the dummy zeroes all damage, exactly as before.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_PALADIN (SharedDefines.h)
Class = 2

# Ret build from docs/reworks/bot-strategy/paladin-ret-strategy.md, the same string as
# Playerbots.PremadeSpecLink.2.2.60. Decoded against the rework's talent grid: 35 Ret talents, 51 points.
PlayerbotTalents = 0-0-33300202310030031033300213310130301

# The class's premade glyphs (Playerbots.PremadeSpecGlyph for the spec tab), applied as a live random bot
# gets them. true is the default; set false for an unglyphed actor (every run before 2026-10-06).
PlayerbotGlyphs = true

# Gear/stats (user 2026-10-31, normalized across every DPS profile): real item level 55-65 blue dungeon gear and no
# flat primary stats. Gear: the "Ret Paladin/DPS Warrior Dungeon Gear" list of docs/.items.md (armor and jewelry; no
# trinkets). Weapons: Arcanite Reaper 12784. The gear's itemization shapes also add the five custom secondaries,
# unevenly by armor type; the flat ratings below top them up (or trim them, when negative) so every DPS profile's
# sheet reads the plate set's 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance (user
# 2026-10-31). Crit is whatever the gear gives. A Devilsaur pair's 2-piece bonus is hit rating, which does nothing on
# this server. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
Gear = 12587,15411,12927,13340,11726,13400,15063,13959,15062,12555,13098,17713,12784


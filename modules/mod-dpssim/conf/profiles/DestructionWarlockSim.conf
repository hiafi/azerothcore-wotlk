#
# DpsSim profile: DestructionWarlockSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for the
# full field list and what each means.
#
# Runs the reworked Destruction Warlock rotation (mod-playerbots branch rework-bot-strategies, the "destro" strategy,
# data/strategies/warlock/destruction.yaml) - see
# .agents/plans/rework-bot-strategies/rework-bot-strategies.WARLOCK.YAML-PASS.md, Stage WS. Guide:
# docs/reworks/bot-strategy/warlock-destr-strat.md.
#
# RACE: pass 2 (Orc). run-sim.sh defaults to race 1 (Human), and the sim runs at the race's start position: Human and
# Undead starts have an attackable Wild Turkey 17.5 yd away, which closes the AoE safety gates ("unsafe aoe units"),
# and a Blood Elf start has a Mana Wyrm at 44 yd. Orc's Valley of Trials has only friendly NPCs nearby. Run at level 60:
#   modules/mod-dpssim/tools/run-sim.sh DestructionWarlockSim 300 60 2 10
#
# What a run checks (the pass's Stage WS Destruction list, from the cast log and aura events on actor and target):
#   - Curse of the Elements -> Immolate -> Chaos Rift -> Chaos Bolt -> Conflagrate, with Conflagrate only inside
#     Chaotic Burn or with Chaos Bolt cooldown > 4 s;
#   - never two Immolates up on the target;
#   - Shadowfury cast (no unsafe units at the Orc start).
# The drain-on run (below) adds: Shadowburn below 35% (the dummy spawns 8 yd away, inside its 20 yd range), and
# Immolate still cast below 25% (the dummy is elite, so the long gate holds).
#
# Cannot be simmed (one passive dummy that never dies and never threatens the actor): Soul Shards (the dummy never
# dies and gives no XP, so Soulburn and Destruction's Soul Fire never fire), moving rows, defensives (Death Coil,
# Unending Resolve, healthstone below 30/35%, Hellfire stop), Felguard death and re-summon, Spell Lock, pet taunts (no
# group). Pet and guardian damage is counted (Felguard, Felhunter, Imp, Wild Imps, Dreadstalkers, Doomguard; Rift
# Bolts carry the warlock as caster).
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. Exercises Shadowfury and Rift Bolt from 2 targets; Rain of Fire, Seed of
#   Corruption and Shadowflame from 3.
#   modules/mod-dpssim/tools/run-sim.sh DestructionWarlockSim 180 60 2 5 100 3

# Dummy health drain (SimProfile.h, Profile::DummyHealthDrain/DummyMaxHealth) - deliberately OFF/absent here for
# the baseline run. The sim dummies 900004/5/6 are rank 3 (world boss), so the elite() and boss() conditions are
# true and the lifetime gates pass; the dummy never dies. For the drain-on run
# (the execute rows: Shadowburn below 35%, Immolate still cast below 25%) add
#   DummyHealthDrain = true
#   DummyMaxHealth = <n>      (something a 300 s fight can drain)
# A Life Tap death of the actor ends the iteration: the Life Tap rows keep only their guide health floor (WQ1), so
# report any such death rather than treating it as a sim fault.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_WARLOCK (SharedDefines.h)
Class = 9

# The Destruction guide build (docs/reworks/bot-strategy/warlock-destr-strat.md;
# Warlock plan Stage WC2). Decoded against the live talent_dbc: 51 points, every rank and row gate legal.
# The same string as AiPlayerbot.PremadeSpecLink.9.2.60 (the bots' premade build).
PlayerbotTalents = --3333200210220133030113023310231

# Pre-pull buff phase: 30 s instead of the default 15 s, so the 10 s pet summon, armor, healthstone, stone and Soul
# Link land before the pull (the buff phase keeps the nc, pet and stone strategies).
PrePullBuffMs = 30000

# The class's premade glyphs (AiPlayerbot.PremadeSpecGlyph for the spec tab), applied as a live random bot gets
# them. The live config's AiPlayerbot.BotGlyphs = 0 wins anyway, so the actor runs unglyphed.
PlayerbotGlyphs = true

# Gear/stats: the shared level-60 caster baseline every caster profile uses (user, 2026-10-07; taken from real
# gear, like RetPaladinSim.conf's ratings). Character-sheet totals before talents and buffs: 255 Intellect, 144
# Spirit, 398 spell power. Intellect and Spirit below are the gear part only: the target minus the level-60 base
# of a Orc warlock (player_class_stats + player_race_stats: 107 Intellect, 117 Spirit). Spell power from stats
# is floor(Int / 2) + floor(Spirit / 2) (Unit::SpellBaseDamageBonusDone) = 127 + 72, so the flat SpellPower is 199.
# Run as race 2 (Orc); another race changes the base stats.

SpellPower = 199
AttackPower = 0

CritRating = 35
HasteRating = 12
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 17
VersatilityRating = 0
CooldownHasteRating = 13
ProcChanceRating = 13

Strength = 0
Agility = 0
Stamina = 200
Intellect = 148
Spirit = 27

# Master switch - see ArcaneMageSim.conf's own comment on this key.
StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py) - see
# ArcaneMageSim.conf's own comment on this block for the reasoning behind these defaults.
TestStrength = false
TestAgility = false

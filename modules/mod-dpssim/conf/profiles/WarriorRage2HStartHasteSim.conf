#
# DpsSim profile: WarriorRage2HStartHasteSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for
# the full field list.
#
# RAGE SWEEP profile, SPELL-HASTE check (warrior rework W0b, D21-D23:
# .agents/plans/warrior-rework/warrior-rework.W0b-HANDOFF.md). The fifth sweep profile: IDENTICAL to
# WarriorRage2HStartSim (same weapon, same 22-rating gear block, same stats, Battle Stance, no talents) except for
# a HasteRating top-up. Run both, then compare the rage income:
#   modules/mod-dpssim/tools/run-sim.sh WarriorRage2HStartSim      60 60 1 5
#   modules/mod-dpssim/tools/run-sim.sh WarriorRage2HStartHasteSim 60 60 1 5
#   python3 -I modules/mod-dpssim/tools/rage_sweep.py --measured
#   (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets])
# Rage now scales 1:1 with SPELL haste (Warrior::RageSpeedFactor multiplies the hasted swing by max(1,
# 1 / UNIT_MOD_CAST_SPEED)). Haste rating is both attack speed and spell haste (the HasteRating key fans out to
# CR_HASTE_MELEE, CR_HASTE_RANGED and CR_HASTE_SPELL, SimProfile.cpp RATING_KEYS), so the hasted run swings faster
# AND keeps the unhasted rage per swing: rage per second should grow with the haste, hasted over unhasted. rage_sweep.py
# --measured prints the rage income per second from the report's powerSamples beside its reference (the white-swing
# formula with the profile's HasteRating as spell haste) and checks the measured ratio against the reference ratio
# within 5%. Rage that is spent inside a 500 ms sample window nets against the swing's gain, so the tool says when the
# bot's rotation hides the income and then prints the reference only; a clean comparison needs a run where the bot
# does not spend rage (a ROTATION-AGNOSTIC measurement, not a DPS target and not a balance reference).
# Check the realm flag after the sims (memory "DPS sims hide the live realm": older builds need `flag & ~1`).
#
# HASTE (the one difference): HasteRating = 172 = the Start profile's 22 + a top-up of 150.
#   Rating per 1% haste at level 60 = 10 (0.1% per point): Player::GetRatingMultiplier(cr) = class scalar /
#   gtCombatRatings = gtoctclasscombatratingscalar_dbc ratio (warrior, CR_HASTE_MELEE/CR_HASTE_SPELL: ids 18 and 20,
#   both 1) / gtcombatratings_dbc ratio at id cr * 100 + level - 1 (src/server/game/Entities/Player/Player.cpp
#   GetRatingMultiplier): CR_HASTE_MELEE = 17 -> id 1759 = 10, CR_HASTE_SPELL = 19 -> id 1959 = 10 (read from the live
#   gtcombatratings_dbc and gtoctclasscombatratingscalar_dbc tables, 2026-10-29).
#   So +15% haste = 150 rating, on top of the Start profile's 22 (2.2%): 172 total = 17.2% spell and attack speed
#   haste, i.e. hasted / unhasted = 1.172 / 1.022 = x1.147 (about +15%) over WarriorRage2HStartSim. (A profile's
#   HasteRating is its whole haste: the weapon carries none, so there is no separate "gear" haste to subtract.)
#
# BRACKET: START of the level-60 gear band, TWO-HANDER (Arms-style, untalented), with the haste top-up above.
# Battle Stance (see Talents).
#
# Gear (D17): one real level-60 pre-raid dungeon blue two-hander, ~3.6 s reference speed.
#   Seeping Willow (12969): two-handed mace, 155-233 (avg 194), 3.6 speed, required level 58, item level 63, no stats,
#   drops from The Beast (Upper Blackrock Spire). Two-Handed Maces: SimActor::Create() grants the weapon skill at the
#   level cap before equipping, so no trainer or race restriction matters.
#
# ESTIMATES (nothing here is a captured character sheet; the "SimActor created" log line gives the real melee attack
# power - compare it with the AP total below and rerun rage_sweep.py with it in mind). Level-60 Human warrior base
# Strength is about 120 (player_class_stats + player_race_stats; the same figure ProtWarriorSim.conf uses), so base
# attack power = 3 * 60 + 2 * 120 - 20 = 400.
#   Strength 110      : a pre-raid dungeon blue set (ilvl 58-63, Stratholme / UBRS / Scholomance / DM level): about ten
#                       armor and jewelry slots carrying roughly +11 Strength each (head, shoulders, chest, legs, hands,
#                       waist, wrists, feet, back, one ring); neck, other ring and trinket carry no Strength.
#   AttackPower 40    : flat top-up for the few +attack power equip effects and enchants of that set.
#   Total attack power 400 + 2 * 110 + 40 = 660 before talents and buffs.
#   Ratings (crit 105, haste 22 + 150, mastery 15, versatility 31, cooldown haste 5, proc chance 13): the user's
#   captured level-60 dungeon-gear block (FeralCatSim.conf, 2026-10-22), re-used as is for the same item-level band,
#   plus the haste top-up above; hit and expertise stay 0 (100% PvE hit and expertise on this server).
#
# Expected white hit (sanity check against the sim's "SimActor created" line): weapon avg 194 + 660 / 14 * 3.6 s =
# 194 + 169.7 = 363.7 pre-armor, x 0.575 = about 209 per non-crit hit (haste changes no damage per swing), one hit per
# 3.6 / 1.172 = 3.07 s (the sim steps swings in 100 ms: about 3.1 s).

# Pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs) - absent here, so the default of 15000 sim ms applies
# (the bot settles into its stance and buffs unrecorded, then pulls).

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08. Level-60 attacker vs
# 4,350 armor: reduction = 4350 / (4350 + 467.5 * 60 - 22167.5) = 4350 / 10232.5 = 42.5%, so every pre-armor figure
# below is multiplied by 0.575.
TargetArmor = 4350

# CLASS_WARRIOR (SharedDefines.h)
Class = 1

# Talents: NONE. SimProfile::Load() leaves PlayerbotTalents empty ("Empty = no talents spent", SimProfile.h) and
# SimBot::Create() then spends nothing (`if (!playerbotTalents.empty())`, SimBot.cpp). With zero points
# AiFactory::GetPlayerSpecTab() returns tab 0 (Arms) for a warrior, so the bot runs the "arms" strategy
# (AiFactory.cpp: `tab == WARRIOR_TAB_ARMS || !HasSpell(SPELL_WHIRLWIND)`), whose ArmsWarriorStrategy has the trigger
# "battle stance" at ACTION_HIGH + 10: the bot HOLDS BATTLE STANCE (the +10% auto-attack rage stance). SimActor does not
# pick a stance itself; the strategy does. rage_sweep.py therefore applies the Battle Stance x1.10 to this profile.
PlayerbotTalents =

# Unglyphed actor: all warrior glyphs are retired server-wide.
PlayerbotGlyphs = false

# Gear: the weapon only (rating and Strength top-up below stand in for the rest of the set, as ProtWarriorSim does).
Gear = 12969

SpellPower = 0
AttackPower = 40

CritRating = 105
HasteRating = 172
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 15
VersatilityRating = 31
CooldownHasteRating = 5

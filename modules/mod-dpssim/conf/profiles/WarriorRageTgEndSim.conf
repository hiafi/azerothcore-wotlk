# RAGE SWEEP profile (warrior rework S3, D43/D46). The Titan's Grip counterpart of WarriorRageDwEndSim.conf: it
# measures the white-swing rage of a Titan's Grip warrior at the END of the level-60 gear bracket (two two-handers,
# 1.3 link, Berserker Stance, -10% penalty) so rage_sweep.py's `tg-end` profile can replace the estimate (D46: 261 /
# 305 white rage a minute, the same as the one-handed pair; the TG off-hand damage factor and the 10% penalty's effect
# on rage are only settled by a measurement). White damage per swing does not depend on k and m, so run it ONCE on the
# deployed build. Only the white swings (spell id 0, and the off hand under 0xFFFF0001) are read, and no DPS target is
# implied. The bot plays the full 1.3 build (Enrage 5, Flurry 3, Death Wish, Recklessness), so the measured white
# rage ALREADY includes what those add (swing haste, crits, the Enrage damage): rotation and uptimes matter, and
# rage_sweep.py's Fury budget reads these measured rows with white factor 1.0 (the 1.06 is for the doc rows only).
# The talents are the 1.3 link so Dual Wield Specialization 5 and Cruelty 3 count.
#
# RUN (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets]):
#  modules/mod-dpssim/tools/run-sim.sh WarriorRageTgEndSim 60 60 1 5
# Then: python3 -I modules/mod-dpssim/tools/rage_sweep.py   (it finds the newest report of every profile in reports/,
# prints the FURY BUDGET from the TG reports when present). Check the realm flag after the sims.
# Gear: 21492 Manslayer of the Qiraji x2 (2H sword 157-292, 3.6 speed, required level 60, AQ tier).
# Stats: the END-bracket block of WarriorRage2HEndSim.conf, but NOT the same sheet: gear stats come on top of the
# block, and two 21492s carry 2 x (35 Strength, 15 Agility, 20 Stamina) (base item_template) where
# WarriorRage2HEndSim's single 21635 carries 32 Agility / 31 Stamina, so this actor has about 70 Strength more. Compare
# its white damage with WarriorRage2HEndSim's only after that difference (the "SimActor created" log line has the
# real attack power).
# TALENTS: -2033022102525010203030005013231, the 1.3 .60 link (51 points, Titan's Grip 1, Dual Wield Specialization 5,
# Cruelty 3); proved legal.


#
# DpsSim profile: HolyPaladinHealSim
#
# Healing-sim profile (stage HS3; plan .agents/plans/healing-sim/healing-sim.PLAN.md): a level-60 Human Paladin that
# heals a group of headless allies while the Sim Raid Boss damages them with real hits. "Mode = Heal" makes
# SimProfile::Load() send the batch down the heal path (SimDaemon::RunHealBatch). Format: "Key = Value" lines, "#"
# comments, blank lines ignored.
#
# The heal keys (SimHeal.h has the full syntax): HealGroup is party (5), raid10 or raid20, and the healer is always
# one of the members. HealTargets lists one "<count>*<role>:<mode>" entry per member in index order, role tank | dps |
# self (exactly one self, the healer) and mode drain:<damage per pulse> | drain:<pct>% | pin:<pct>. pin:50 keeps the
# member at 50% health with real damage hits (the pure-HPS measurement: no overheal, no deaths); drain:150 hits it for
# 150 every pulse and it can die (the survival measurement). Target 0 is the main tank. DpsSim.HealGroup /
# DpsSim.HealTargets in the conf override both keys.
#
# Bot strategy exercised: the reworked Holy rotation: PaladinReworkHolyStrategy (C++, src/Ai/Class/Paladin/Rework)
# with "healer dps". The sim ticks the real PlayerbotAI; nothing here steers it.
#
# Race: Human (run-sim.sh's [race] argument 1). The group stands in front of the healer at the race's start position.
#
# Talents: Playerbots.PremadeSpecLink.2.0.60 of the live env/dist/etc/modules/playerbots.conf (the bots' premade
# build), decoded against the live talent_dbc/talenttab_dbc: 51 points, every rank and row gate legal. Tabs are in
# tab-page order and talents in (row, column) order, the same as PlayerbotAIConfig::ParseTempTalentsOrder(). The
# build, by tree:
#   Holy (51 points): Spiritual Focus 3/3, Enduring Light 3/3, Healing Light 3/3, Divine Intellect 3/3, Unyielding
#       Faith 3/3, Illumination 3/3, Light's Hammer 1/1, Improved Concentration Aura 1/3, Improved Blessing of Wisdom
#       2/2, Holy Shock 1/1, Sanctified Light 3/3, Light's Fervor 2/2, Holy Power 3/3, Light's Grace 3/3, Divine
#       Illumination 1/1, Dawn before Dusk 3/3, Glimmer of Light 3/3, Holy Guidance 3/3, Overflowing Light 3/3, Beacon
#       of Light 1/1, Infusion of Light 2/2, Divine Toll 1/1
#
# Glyphs: the class's premade glyphs for the spec (Playerbots.PremadeSpecGlyph.2.0 =
# 41106,43367,45741,43368,43365,41109: Holy Light, Lay on Hands, Beacon of Light, Sense Undead, Blessing of Kings,
# Seal of Wisdom), applied as a live random bot gets them. The live config's Playerbots.BotGlyphs = 0 wins anyway, so
# the actor runs unglyphed.
#
# The scenario keys above are the party default; run-sim.sh overrides them per run with HEALSIM_GROUP /
# HEALSIM_TARGETS / HEALSIM_INFINITE_MANA. The sweep of the HS3 stage (D10, D11), from the repo root: 120 s, level 60,
# race 1, 10 iterations:
#
#   S="modules/mod-dpssim/tools/run-sim.sh HolyPaladinHealSim 120 60 1 10"
#   for G in party raid10 raid20; do
#     HEALSIM_GROUP=$G HEALSIM_TARGETS=pin50 HEALSIM_INFINITE_MANA=1 $S    # max output
#     HEALSIM_GROUP=$G HEALSIM_TARGETS=pin50 HEALSIM_INFINITE_MANA=0 $S    # sustain
#     HEALSIM_GROUP=$G HEALSIM_TARGETS=pin20 HEALSIM_INFINITE_MANA=1 $S    # low-health throughput
#   done
#   HEALSIM_GROUP=party  HEALSIM_TARGETS=drain:150 HEALSIM_INFINITE_MANA=0 $S    # triage
#   HEALSIM_GROUP=raid10 HEALSIM_TARGETS=drain:75  HEALSIM_INFINITE_MANA=0 $S
#   HEALSIM_GROUP=raid20 HEALSIM_TARGETS=drain:40  HEALSIM_INFINITE_MANA=0 $S
#
# The three drain levels put about 1,000 damage a second into the group (tanks take 3x a DPS member's share). Max
# output = HPS of the pin50 run with infinite mana; sustain = the mean time before the healer runs out of mana
# (oomAtMs) in the pin50 run with normal mana; HPS before OOM and whole-fight HPS stay in the reports as detail.
#

# CLASS_PALADIN (SharedDefines.h)
Class = 2

Mode = Heal
HealGroup = party
HealTargets = tank:pin:50, 3*dps:pin:50, self:pin:50

# Allies: the tank is a Protection Warrior (AllyTankTalents; the default string is ProtWarriorSim.conf's), the DPS are
# untalented Rogues. Max health is pinned through the BASE part of the health modifier, so Fortitude / Kings / Mark of
# the Wild still add. A pinned target (the healer's slot included) gets PinMaxHealth instead, so a heal never fills
# it; the AllyMaxHealth values apply to drain targets only. All three are at least 1,000.
AllyMaxHealth.Tank = 9000
AllyMaxHealth.Dps = 5000
PinMaxHealth = 30000
AllySpreadYards = 10
DrainPulseMs = 1000
# true keeps the healer's mana full during the fight (a pure-throughput run); run-sim.sh's HEALSIM_INFINITE_MANA sets it
# per run without editing this file
InfiniteMana = false

PlayerbotTalents = 0330333031001020013023031300330310201
PlayerbotGlyphs = true

# Gear/stats (user 2026-11-01, normalized like the DPS profiles): real item level 55-65 blue dungeon gear and no flat
# primary stats. Gear: the "Holy Paladin Dungeon Gear" list of docs/.items.md (Hammer of Grace 11923 and the off-hand
# Thaurissan's Royal Scepter 11928 included; no trinkets). The gear's itemization shapes also add the five custom
# secondaries, unevenly by armor type; the flat ratings below top them up (or trim them, when negative) so the sheet
# reads the plate set's 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance, as in every
# normalized DPS profile (user 2026-10-31). Gear-only values the top-ups correct: haste 22, mastery 11, versatility 24,
# cooldown haste 6, proc chance 0. Crit is whatever the gear gives. No item in the list belongs to an item set. The
# "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
# Items, in order: 12633 Whitesoul Helm, 18723 Animated Chain Necklace, 18720 Shroud of the Nathrezim, 11623
# Spritecaster Cape, 13346 Robes of the Exalted, 13969 Loomguard Armbraces, 12554 Hands of the Exalted Herald, 18702
# Belt of the Ordained, 11841 Senior Designer's Pantaloons, 13954 Verdant Footpads, 16058 Fordring's Seal, 13178
# Rosewine Circle, 11923 The Hammer of Grace, 11928 Thaurissan's Royal Scepter.
# Sheet at creation (level 60, race 1, before talents and buffs): Intellect 148, Spirit 149, Stamina 248, flat spell
# power 196 (healing power 344), crit 26, armor 1703, max health 3681, max mana 3452.
Gear = 12633,18723,18720,11623,13346,13969,12554,18702,11841,13954,16058,13178,11923,11928

SpellPower = 0
AttackPower = 0

CritRating = 0
HasteRating = 10
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 4
VersatilityRating = 1
CooldownHasteRating = 2
ProcChanceRating = 19

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# No stat-weight passes for a healing profile (stat_weights.py is DPS-only)
StatWeightsEnabled = false

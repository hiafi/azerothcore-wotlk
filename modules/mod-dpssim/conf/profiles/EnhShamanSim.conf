#
# DpsSim profile: EnhShamanSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the SIMALL stage
# (.agents/plans/tank-sim/tank-sim.STAGE-SIMALL-HANDOFF.md); the first Enhancement profile.
#
# Runs the reworked Enhancement shaman's DPS rotation (mod-playerbots branch feat/shaman-enh-bot-strategy: the "enh"
# strategy, data/strategies/shaman/enh.yaml, ShamanReworkEnhStrategy). Guide:
# docs/reworks/bot-strategy/shaman-enhancement-bot-guide.md. Two one-handers (Dual Wield), no shield.
#
# RACE: pass 2 (Orc), as ShamanEleSim (Orc's Valley of Trials has only friendly NPCs nearby; Human cannot be a shaman).
# Run at level 60:
#   modules/mod-dpssim/tools/run-sim.sh EnhShamanSim 60 60 2 5
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); 2+ targets use the elite pack dummies. The pack rows
# (Chain Lightning, Magma Totem, Fire Nova) need 3+ enemies near the target.
#   modules/mod-dpssim/tools/run-sim.sh EnhShamanSim 60 60 2 5 100 3
#
# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_SHAMAN (SharedDefines.h)
Class = 7

# Talents: the guide's 7.1 "enh pve" 60 link (docs/reworks/bot-strategy/shaman-enhancement-bot-guide.md, and
# AiPlayerbot.PremadeSpecLink.7.1.60 of modules/mod-playerbots/conf/playerbots.conf.dist). The live env/dist/etc/modules/
# playerbots.conf still carries the pre-rework string for 7.1.60 (-3030500310502133303131131051, the stock tree's digits;
# it also lacks 7.6 altogether), written before the shaman rework's talent grid; the bots will pick up the .dist string
# when the module's conf is redeployed, so the .dist string (the guide's) is the one used. Enhancement is the second tab
# (51 points, dashes for the empty tabs).
PlayerbotTalents = -3021103333033021300320311000231031

# Unglyphed actor: all shaman glyphs are retired server-wide.
PlayerbotGlyphs = false

# Gear/stats (user 2026-10-22): the same flat stat block as FeralCatSim.conf (the user's level-60 dungeon-gear feral
# set: 290 attack power, 121 Agility, 105 crit, 22 haste, 15 mastery, 31 versatility, 5 cooldown haste, 13 proc chance),
# so Enhancement is measured on the same footing as the other reworked melee profiles. Only the two weapons are worn;
# their own stats come on top, as Ursol's Claw's do for the cat.
#   Main hand  17016 Dark Iron Destroyer          (one-hand axe, 71-134, 2.4 speed)
#   Off hand   18737 Bone Slicing Hatchet         (one-hand axe, 48-89, 1.7 speed; equipped as the off hand once Dual
#              Wield is known; the "SimActor created" log line names both)
# The earlier hand-picked mail set (11729,15411,19691,13340,19690,18296,19692,12634,12964,18047,13098,17713) is dropped:
# it had about half the crit and no versatility or proc chance against the other melee profiles.
# Check the "SimActor created" and "actor after the first second" log lines for the sheet.
Gear = 17016,18737

SpellPower = 0
AttackPower = 290
CritRating = 105
HasteRating = 22
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 15
VersatilityRating = 31
CooldownHasteRating = 5
ProcChanceRating = 13
Strength = 0
Agility = 121
Stamina = 0
Intellect = 0
Spirit = 0

# Master switch - see ArcaneMageSim.conf's own comment on this key. Off: stat weights for this profile are not set up.
StatWeightsEnabled = false

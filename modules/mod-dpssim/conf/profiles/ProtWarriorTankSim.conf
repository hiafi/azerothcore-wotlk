#
# DpsSim profile: ProtWarriorTankSim
#
# Tank-sim profile (plan .agents/plans/tank-sim/tank-sim.PLAN.md): a level-60 Human Protection Warrior that the dummies
# swing at. "Mode = Tank" sends the batch down the tank path (SimDaemon::RunTankBatch): the DPS sim with every dummy
# auto-attacking the actor, so Shield Block, Revenge, damage-taken rage, Storm's Bulwark shields and the defensive
# cooldowns fire as in game. Format: "Key = Value" lines, "#" comments, blank lines ignored.
#
# What it measures. Two scenarios (TankScenario, or TANKSIM_SCENARIO per run):
#   dps      real hits, the actor's health refilled after every step (it never dies): tank DPS and TPS with every
#            avoidance proc live, plus DTPS, the outcome split and the mitigation split.
#   survive  real hits, no refill, no healer: the run ends at the death and time to death (TTD) is the headline; a run
#            that lives the whole duration counts as TTD = the duration, marked survived.
# One target is the boss dummy (level 63 to the actor, stun immune, 2,250-2,750 before armor every 2.0 s, crits on);
# 2-10 targets are the elite pack, every dummy swinging for 500-600. The JSON is the DPS report plus a "tank" section;
# the page is reports/TankProfileReport.html.
#
# Bot strategy exercised: the reworked Protection rotation (WarriorReworkProtStrategy, data/strategies/warrior/prot.yaml
# and prot-aoe.yaml in mod-playerbots). The sim ticks the real PlayerbotAI; nothing here steers it.
#
# Race: Human (run-sim.sh's [race] argument 1), the same as ProtWarriorSim.conf.
#
# Run it from the repo root (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs]
# [targets]):
#   modules/mod-dpssim/tools/run-sim.sh ProtWarriorTankSim 120 60 1 10                              # dps, boss
#   TANKSIM_SCENARIO=survive modules/mod-dpssim/tools/run-sim.sh ProtWarriorTankSim 120 60 1 10     # survive, boss
#   modules/mod-dpssim/tools/run-sim.sh ProtWarriorTankSim 120 60 1 10 100 5                        # dps, 5-pack
#   TANKSIM_SCENARIO=survive modules/mod-dpssim/tools/run-sim.sh ProtWarriorTankSim 120 60 1 10 100 3
# TANKSIM_HIT / TANKSIM_PACK_HIT / TANKSIM_SWING_MS override the hits per run (the file names then carry a tag).
# The known-value tests (SimTests.cpp, keys "tank.*") load this file for the Prot Warrior they test:
#   DPSSIM_KEEP_LOG=1 DPSSIM_EXTRA_CONF='DpsSim.RunTests = 1\nDpsSim.TestFilter = tank.' \
#       modules/mod-dpssim/tools/run-sim.sh ProtWarriorTankSim 10 60 1 1
# (no report is written, so run-sim.sh ends with "produced no report"; the [PASS] / [FAIL] lines are in the kept log)
#

Mode = Tank

# dps: health refilled after every step, never dies. survive: no refill, the run ends at the death (TTD).
TankScenario = dps
# The boss (1 target), before armor and the victim's damage-taken modifiers; each pack dummy (2+ targets).
TankHitDamage = 2250-2750
TankPackHitDamage = 500-600
TankSwingMs = 2000
TankDummyCrit = true

# Pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs) - absent here, so the default of 15000 sim ms applies.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08. The same in every tank
# profile.
TargetArmor = 4350

# CLASS_WARRIOR (SharedDefines.h)
Class = 1

# Talents: Playerbots.PremadeSpecLink.1.2.60 ("prot pve") of the live env/dist/etc/modules/playerbots.conf, the same
# string as ProtWarriorSim.conf. Decoded against the live talent_dbc (tabs in tab-page order, talents in (row, column)
# order): 51 points, all in Protection (tab 163), every rank and row gate legal:
#   Improved Bloodrage 2/2, Shield Specialization 3/3, Improved Thunder Clap 3/3, Devastate 1/1, Incite 3/3,
#   Unbridled Wrath 3/3, Last Stand 1/1, Improved Revenge 2/2, Shield Mastery 2/2, Reprisal 2/2, Puncture 3/3,
#   Shield Cover 3/3, Improved Disciplines 2/2, Concussion Blow 1/1, Iron Temper 2/2, Storm's Bulwark 3/3, Critical
#   Block 3/3, Resolve 3/3, Unrelenting 1/1, Shield Discipline 2/2, Sword and Board 3/3, Thunderstruck 3/3
PlayerbotTalents = --2331303122023321020330030123030

# Unglyphed, as every tank profile (the live Playerbots.BotGlyphs = 0 would win anyway).
PlayerbotGlyphs = false

# Gear: docs/.items.md "Protection Paladin/Warrior Tank Dungeon Gear", the same 13 items as ProtPaladinTankSim (one
# set for both plate tanks, so they compare like for like). Real items and no synthetic top-up: armor, block value and
# defense rating only come from items (the profile format has no keys for them). SimActor::Create() grants each item's
# skill first (Maces, Shield, Plate) and equips in this order:
#   12640 Lionheart Helm, 21792 Necklace of the Diamond Tower, 16733 Spaulders of Valor, 18495 Redoubt Cloak,
#   16730 Breastplate of Valor, 16735 Bracers of Valor, 16737 Gauntlets of Valor, 16736 Belt of Valor,
#   16732 Legplates of Valor, 16734 Boots of Valor, 22680 Band of Resolution, 19104 Stormstrike Hammer (one-hand mace,
#   80-149, 2.7 speed), 12602 Draconian Deflector (shield, 2,153 armor, 40 block).
# The set has one ring, no trinket and no equip spells; its seven Battlegear of Valor pieces (itemset 189) give the set
# bonuses.
# Gear totals from the live item_template: armor 5,940, block 40, Strength 141, Agility 57, Stamina 147, Spirit 31,
# defense rating 88, hit rating 15 (no effect: 100% PvE hit), crit rating 21.
# Expected sheet (level-60 Human warrior: player_class_stats 1,689 health, 120 Strength, 80 Agility, 110 Stamina; the
# "actor after the first second" log line, with the stance up, is the one to compare):
#   Strength 261, Agility 137, Stamina 257 -> health 1,689 + (257 - 20) x 10 + 20 = 4,079 (the same arithmetic gives
#   TS1's 4,019 for the old two-item gear);
#   armor 5,940 + 2 x 137 = 6,214, plus the Valor 2-piece bonus (stock +200) = about 6,414;
#   defense 300 + 88 / 1.5 rating per point = 358 (58 over the cap: +2.32% dodge, parry and block);
#   dodge about 11-12% (TS1: 6.64% at 80 Agility, plus 57 Agility and the defense), parry 5.00 + 2.32 = 7.3%,
#   block 15.0 + 2.32 = 17.3% (TS1's 17.60% held 2.6% from the old shield's block rating), 117% with Shield Block up;
#   block value (40 + 261 / 2 - 10) x the talents' multiplier (TS1: 444 from 140, x3.17) = about 510.
# Crit immune in Defensive Stance (TS1: 0.00% after the first second with no defense rating at all).
Gear = 12640,21792,16733,18495,16730,16735,16737,16736,16732,16734,22680,19104,12602

SpellPower = 0
AttackPower = 0

# Tank stat weights are stage TS4 (against TTD and net DTPS), not this DPS tool
StatWeightsEnabled = false

#
# DpsSim profile: ProtWarriorTankSim  -- DRAFT (tank sim stage TS1; TS3 finalises it)
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Same character as ProtWarriorSim.conf (class, talents, gear, stats, armor), but `Mode = Tank`: the dummies swing
# at the actor, so Shield Block, Revenge, damage-taken rage and the defensive cooldowns can fire. Plan:
# .agents/plans/tank-sim/tank-sim.PLAN.md. The tank keys below are the defaults, written out; DpsSim.Tank* in the conf
# override them (TS2's run-sim.sh maps TANKSIM_* env vars onto those).
#   modules/mod-dpssim/tools/run-sim.sh ProtWarriorTankSim 120 60 1 5
#   (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets])
#
# This is a draft: the gear and stats are ProtWarriorSim's ESTIMATES (see that file), not a captured sheet.
#

Mode = Tank

# dps: health refilled after every step, never dies. survive: no refill, the run ends at the death (TTD).
TankScenario = dps
# The boss (1 target), before armor and the victim's damage-taken modifiers; each pack dummy (2+ targets).
TankHitDamage = 2250-2750
TankPackHitDamage = 500-600
TankSwingMs = 2000
TankDummyCrit = true

# Pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs) - absent here, so the default of 15000 sim ms applies.
# `PrePullBuffMs = 0` turns the phase off.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_WARRIOR (SharedDefines.h)
Class = 1

# Prot build, 51 points on the rework's talent grid, Protection (third tab) deep: --2331303122023321020330030123030.
# The first two tabs are empty ("-" "-").
PlayerbotTalents = --2331303122023321020330030123030

# Unglyphed actor: keeps the rotation check free of glyph effects.
PlayerbotGlyphs = false

# Gear: one real one-hand weapon plus a shield (Devastate, Shield Slam and Shield Block all require a shield).
# Both are level-60 items from the live item_template, no class restriction, picked as Molten Core / ZG-tier
# (item level 65-67) rather than raid-tier BWL/Naxx gear, so the tank is not overgeared for a pre-raid test.
#   Dark Iron Reaver (17015): one-hand sword, 71-134, 2.4 speed, +10 Stamina, required level 60, item level 65.
#   Drillborer Disk (17066): shield, 2,918 armor, 60 block, +13 block rating, +11 Stamina, level 60, ilvl 67.
# SimActor::Create() clears the starter outfit, grants the weapon skill (Swords) at the level cap and the shield
# skill, then equips each item through CanEquipNewItem(NULL_SLOT): the one-hander takes the free main hand and the
# shield (InventoryType 14) can only go to the off-hand, so listing the sword first is enough. Check the
# "SimActor created" log line for the main-hand item and total melee attack power.
Gear = 17015,17066

# ESTIMATES: there is no in-game character sheet for this profile. The values below are a plausible level-60
# tank top-up over the two items (roughly a Human warrior in a partial dungeon set), not captured numbers.
# Level-60 Human warrior base Strength is about 120 (player_class_stats + player_race_stats), so Strength 60 on
# top is ~180, with Stamina for a tank-sized health pool. Re-derive from the "SimActor created" log line if a real
# sheet ever exists.
SpellPower = 0
AttackPower = 120

CritRating = 60
HasteRating = 10
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 20
VersatilityRating = 20
CooldownHasteRating = 0
ProcChanceRating = 10

Strength = 60
Agility = 0
Stamina = 120
Intellect = 0
Spirit = 0

StatWeightsEnabled = false

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py): off - this is a rotation-sanity profile
# with no DPS target, so stat weights are meaningless here (StatWeightsEnabled = false is the kill switch).
TestStrength = true
TestAgility = false
TestStamina = false
TestIntellect = false
TestSpirit = false
TestSpellPower = false
TestAttackPower = true
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = true

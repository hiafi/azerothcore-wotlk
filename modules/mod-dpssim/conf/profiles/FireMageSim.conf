#
# DpsSim profile: FireMageSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when
# DpsSim.Profile points at this file. Format: "Key = Value" lines, "#" comments, blank lines
# ignored. See SimProfile.h's Profile struct for the full field list and what each means.
#

# CLASS_MAGE (SharedDefines.h). Same class as FrostMageSim/ArcaneMageSim - only the talents
# differ (mage specs are talent trees, not separate classes).
Class = 8

# Full Fire tree (docs/reworks/fire-mage-rework.md), every talent maxed as far as it'll go - the
# tree itself is 72 points across 30 talents (verified live 2026-09-16 after the tree-review pass
# that moved Pyromaniac to (3,1) and added Scorched Earth (1,1)/Stoking the Fire (9,1): base client
# Talent.dbc + this deployment's promoted/pending overlay for TabID 41, tier-then-column order,
# summed to exactly 72). That's 1 point over what level 80 (the WotLK cap) can ever spend -
# Player::CalculateTalentsPoints() is level-9, so 71 is the hard ceiling, and the design doc itself
# (sec 5's Point Distribution note) accepts this as a permanent 1-point shortfall by design, not a
# bug. This profile spends all 71: every talent at max rank **except Molten Fury (6, 2), left at
# rank 1 of 2** - the one point has to come from somewhere, and Molten Fury's second rank is
# already untested by this sim regardless (needs the target under 35% health; SimTarget never gets
# there against a training dummy), so dropping it costs nothing this profile could otherwise verify.
#
# Run at **level 80**, not run-sim.sh's own default of 60 (Frost/Arcane's builds fit inside level
# 60's ~51 points; Fire's doesn't).
#
# Hand-authored rather than pulled from a live "talents link" export (unlike the caution in
# dpssim.conf.dist's own PlayerbotTalents doc comment, which assumes the author *doesn't* know the
# live tree) - this exact tier/column layout is this same rework's own shipped source, so the
# string is built directly from a stock-DBC + SQL-overlay merge, not guessed. Still worth a live
# "talents apply -333332322133333121331133321331" + "talents link" round-trip on a real bot before
# fully trusting sim numbers from it, same as any hand-authored string.
PlayerbotTalents = 0-203330300133313001331203300331

# Gear/stats - synthetic level-80 caster budget (not sourced from any specific item list, not
# claimed balanced/optimal), same "reasonable testable starting point" status as ArcaneMageSim.conf/
# FrostMageSim.conf's own baselines - those are level ~60 numbers; scaled up here for level 80.
# Replace freely once there's a real gear target to test against.

SpellPower = 1200
AttackPower = 0

CritRating = 150
HasteRating = 150
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 100
VersatilityRating = 50
CooldownHasteRating = 50
ProcChanceRating = 0

Strength = 0
Agility = 0
Stamina = 300
Intellect = 900
Spirit = 200

# Master switch - see ArcaneMageSim.conf's own comment on this key.
StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py). Same DPS-relevant-stat
# selection as Frost/Arcane, with one deliberate departure:
#
# TestProcChanceRating = false. Frost/Arcane both have real %-chance procs that scale with this
# stat (Fingers of Frost, Missile Barrage, ...); Fire's only two %-chance mechanics - Tinderbox
# (5,0) and Fanned Flames (7,1) - roll their talent rank's raw percentage with NO Proc Chance
# scaling, a deliberate call (2026-09-16, reverting an earlier pass that *did* wire it in) rather
# than an oversight. Fire Blast's guaranteed crit, Burnout's capstone, Playing with Fire's cooldown
# reduction, and Blazing Speed's capstone are all deterministic-on-hit, not chance rolls, so none of
# them touch this stat either - there is currently nothing in the Fire tree for a Proc Chance point
# to buy. Leave this false unless that changes; a nonzero ProcChanceRating above will sim as a
# perfectly wasted stat, which is the expected result, not a bug to chase.
TestStrength = false
TestAgility = false
TestStamina = false
TestIntellect = true
TestSpirit = true
TestSpellPower = true
TestAttackPower = false
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = false

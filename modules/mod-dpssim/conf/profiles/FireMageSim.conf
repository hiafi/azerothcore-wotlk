# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_MAGE (SharedDefines.h). Same class as FrostMageSim/ArcaneMageSim - only the talents
# differ (mage specs are talent trees, not separate classes).
Class = 8

# The Fire guide build (docs/reworks/bot-strategy/mage-fire-strat.md, Mage plan MG8).
# Built against this deployment's reworked trees. The decode against the live talent_dbc was
# checked in the Mage bot plan's Stage C review (2026-10-06): 51 points, every rank and row gate
# legal. This is the same string as AiPlayerbot.PremadeSpecLink.8.1.60 (the bots' premade build).
# Run at level 60, run-sim.sh's default.
PlayerbotTalents = -303330300133303001331103301331

# The class's premade glyphs (AiPlayerbot.PremadeSpecGlyph for the spec tab), applied as a live random bot
# gets them. true is the default; set false for an unglyphed actor (every run before 2026-10-06).
PlayerbotGlyphs = true

# Gear/stats: the shared level-60 caster baseline every caster profile uses (user, 2026-10-07; taken from real
# gear, like RetPaladinSim.conf's ratings). Character-sheet totals before talents and buffs: 255 Intellect, 144
# Spirit, 398 spell power. Intellect and Spirit below are the gear part only: the target minus the level-60 base
# of a Human mage (player_class_stats + player_race_stats: 125 Intellect, 120 Spirit). Spell power from stats
# is floor(Int / 2) + floor(Spirit / 2) (Unit::SpellBaseDamageBonusDone) = 127 + 72, so the flat SpellPower is 199.
# Run as race 1 (Human); another race changes the base stats.

SpellPower = 199
AttackPower = 0

CritRating = 35
HasteRating = 12
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 17
VersatilityRating = 0
CooldownHasteRating = 13
ProcChanceRating = 13

Strength = 0
Agility = 0
Stamina = 300
Intellect = 130
Spirit = 24

# Master switch - see ArcaneMageSim.conf's own comment on this key.
StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py). Same DPS-relevant-stat
# selection as Frost/Arcane, with one deliberate departure:
#
# TestProcChanceRating = false. Frost/Arcane both have real %-chance procs that scale with this
# stat (Fingers of Frost, Missile Barrage, ...); Fire's only two %-chance mechanics - Tinderbox
# (5,0) and Fanned Flames (7,1) - roll their talent rank's raw percentage with NO Proc Chance
# scaling, a deliberate call (2026-09-16, reverting an earlier pass that *did* wire it in) rather
# than an oversight. Fire Blast's guaranteed crit, Burnout's capstone, Playing with Fire's cooldown
# reduction, and Blazing Speed's capstone are all deterministic-on-hit, not chance rolls, so none of
# them touch this stat either - there is currently nothing in the Fire tree for a Proc Chance point
# to buy. Leave this false unless that changes; a nonzero ProcChanceRating above will sim as a
# perfectly wasted stat, which is the expected result, not a bug to chase.
TestStrength = false
TestAgility = false
TestStamina = false
TestIntellect = true
TestSpirit = true
TestSpellPower = true
TestAttackPower = false
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = false

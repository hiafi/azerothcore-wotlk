#
# DpsSim profile: DemonologyWarlockSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for the
# full field list and what each means.
#
# Runs the reworked Demonology Warlock rotation (mod-playerbots branch rework-bot-strategies, the "demo" strategy,
# data/strategies/warlock/demonology.yaml) - see
# .agents/plans/rework-bot-strategies/rework-bot-strategies.WARLOCK.YAML-PASS.md, Stage WS. Guide:
# docs/reworks/bot-strategy/warlock-demo-strat.md.
#
# RACE: pass 2 (Orc). run-sim.sh defaults to race 1 (Human), and the sim runs at the race's start position: Human and
# Undead starts have an attackable Wild Turkey 17.5 yd away, which closes the AoE safety gates ("unsafe aoe units"),
# and a Blood Elf start has a Mana Wyrm at 44 yd. Orc's Valley of Trials has only friendly NPCs nearby. Run at level 60:
#   modules/mod-dpssim/tools/run-sim.sh DemonologyWarlockSim 300 60 2 10
#
# What a run checks (the pass's Stage WS Demonology list, from the cast log and aura events on actor and target):
#   - Felguard summoned during the pre-pull buff phase;
#   - Hand of Gul'dan never cast above 12 Wild Imps, and the Decimation hold respected;
#   - Soul Fire only with Molten Core stacks;
#   - Metamorphosis at >= 6 imps or 15 s of combat; Doomguard held while Metamorphosis cooldown <= 25 s;
#   - healthstone burst in Metamorphosis (the dummy is a boss);
#   - Immolation Aura only in Metamorphosis; Demonic Empowerment with >= 2 imps;
#   - no Life Tap in Metamorphosis.
#
# Cannot be simmed (one passive dummy that never dies and never threatens the actor): packs and two-target rules,
# Soul Shards (the dummy never dies and gives no XP, so Soulburn and Destruction's Soul Fire never fire), moving rows,
# defensives (Death Coil, Unending Resolve, healthstone below 30/35%, Hellfire stop), Felguard death and re-summon,
# Spell Lock, pet taunts (no group). Pet and guardian damage is counted (Felguard, Felhunter, Imp, Wild Imps,
# Dreadstalkers, Doomguard; Rift Bolts carry the warlock as caster).
#
# Dummy health drain (SimProfile.h, Profile::DummyHealthDrain/DummyMaxHealth) - deliberately OFF/absent here for
# the baseline run. The sim dummies 900004/5/6 are rank 3 (world boss), so the elite() and boss() conditions are
# true and the lifetime gates pass; the dummy never dies. Demonology has no execute row of its own, so a
# drain-on run is optional. To make one, add
#   DummyHealthDrain = true
#   DummyMaxHealth = <n>      (something a 300 s fight can drain)
# A Life Tap death of the actor ends the iteration: the Life Tap rows keep only their guide health floor (WQ1), so
# report any such death rather than treating it as a sim fault.

# CLASS_WARLOCK (SharedDefines.h)
Class = 9

# The Demonology guide build (docs/reworks/bot-strategy/warlock-demo-strat.md;
# Warlock plan Stage WC2). Decoded against the live talent_dbc: 51 points, every rank and row gate legal.
# The same string as AiPlayerbot.PremadeSpecLink.9.1.60 (the bots' premade build).
PlayerbotTalents = -302023202120330011003030013030300130231

# Pre-pull buff phase: 30 s instead of the default 15 s, so the 10 s pet summon, armor, healthstone, stone and Soul
# Link land before the pull (the buff phase keeps the nc, pet and stone strategies).
PrePullBuffMs = 30000

# The class's premade glyphs (AiPlayerbot.PremadeSpecGlyph for the spec tab), applied as a live random bot gets
# them. The live config's AiPlayerbot.BotGlyphs = 0 wins anyway, so the actor runs unglyphed.
PlayerbotGlyphs = true

# Gear/stats:

SpellPower = 500
AttackPower = 0

CritRating = 91
HasteRating = 60
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 0
VersatilityRating = 0
CooldownHasteRating = 0
ProcChanceRating = 0

Strength = 0
Agility = 0
Stamina = 200
Intellect = 350

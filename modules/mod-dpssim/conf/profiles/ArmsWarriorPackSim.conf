#
# DpsSim profile: ArmsWarriorPackSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Shape of CombatRogueSim.conf and
# ProtWarriorSim.conf. Warrior rework stage S2 (Arms), D33 in .agents/plans/warrior-rework/warrior-rework.S2-HANDOFF.md.
#
# PURPOSE: the reworked Arms rotation on the PACK build (bot slot 1.1 "arms packs"): Improved Sweeping Strikes,
# Weight of the Earth, Seismic Reverberation, Endless Rage; mod-playerbots data/strategies/warrior/arms-pack.yaml.
# Same gear and stats as ArmsWarriorSim.conf, so the two compare. TARGET COUNT is the 7th run-sim.sh argument (this
# file has no target key): run it at 3 and 5 targets (2+ targets use the elite pack dummies 900007-9 within 3 yd, all
# engaged at the pull). 1 target works as a smoke test but the pack rows then never open.
#
# RUN (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets]; the user default is
# 60 s x 5 iterations at a 100 ms step, level 60, race 2 = Orc: a Human start has an attackable Wild Turkey 17.5 yd
# away that changes "enemies within 8 yd" counts, so every Arms run uses Orc and the baselines compare):
#   DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh ArmsWarriorPackSim 60 60 2 5 100 3
#   DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh ArmsWarriorPackSim 60 60 2 5 100 5
# Add DPSSIM_TARGET_RANK=boss to test a boss-gated row at a pack size.
# Check the realm flag after the sims (sims set realmlist.flag=1; builds older than the Main.cpp gate need
# `flag & ~1`). The sim reads the live world DB and runs the live image: generate + db-import and the image rebuild
# must be live before any Arms sim.
#
# WHAT TO READ: GCD presses per minute and gaps (casts[]); Mortal Strike / Colossus Smash / Overpower / Slam / Rend
# counts; Colossus Smash debuff uptime (204491 on target 0); Overpower charges over time (204403 auraSamples);
# Momentum's free Slams (204498 up, Slam casts with powerCost 0); Deep Wounds tick sizes rising at crit timestamps;
# Sudden Death resets (Mortal Strike closer than its 6 s cooldown); rage gained and spent per minute (powerSamples +
# casts[].powerCost) and starvation seconds (Mortal Strike ready with rage < 25); Sweeping Strikes copies per cast
# (same ms, other target index, about 50% (Improved Sweeping Strikes 2/2) damage).
# With DPSSIM_BOT_LOG=1 count the `A:arms <action> - FAILED` lines
# (real) against `IMPOSSIBLE` (rage or cooldown, normal). Compare the rage numbers with rage_sweep.py's ARMS BUDGET
# (D36).
# Pack criteria to read: Sweeping Strikes first, then Rend and Colossus Smash on 4+ targets, Whirlwind (Seismic
# Reverberation echo), Bladestorm after Sweeping Strikes, Overpower charges at 5 most of the fight, Endless Rage
# overflow buff (204503) after capped rage, Avatar on the 5-target pack, Wrecking Crew (204505-7) uptime.
# Aura samples (AuraSampleIds: sampled every step for the actor, plus this actor's aura on target 0):
#   204403 Overpower charge (Taste for Blood), 204491 Colossus Smash debuff (shows on the target), 204503 Endless Rage
#   overflow buff, 204501 / 204502 Strength of Arms buffs (rank 1 / 2), 204498 Momentum, 204493 Sweeping Strikes,
#   204492 Avatar, 204505 / 204506 / 204507 Wrecking Crew (rank 1 / 2 / 3), 204504 Exploiter debuff (shows on the
#   target), 204496 Deep Wounds holder, 772 Rend (on target 0: a refresh while Rend is up shows as remainingMs rising
#   before it ran out, since a refresh writes no aura event). They fill the report's auraSamples[] ({ts, spellId,
#   onTarget, stacks, remainingMs}): stack counts and charges over time, which auraEvents (first apply / removal
#   only) cannot give.
# Target 0 only: whether EVERY copy of a Colossus Smash hit puts 204491 on its own target (Sweeping copies, the 5-target
# spread) is not observed by this sim; report that criterion as "target 0 only / not observed".
#
# TALENTS: the 1.1 .60 link (warrior-arms-bot-guide.md "Talent strings"; Playerbots.PremadeSpecLink.1.1.60),
# 51 points on the 33-talent Arms grid (docs/reworks/warrior-arms-rework.md section 4). Digits run in (row, column)
# order, empty cells skipped. Proved legal (rank <= max, 5 points in the rows above per row) with row sums
# r0:5 r1:5 r2:9 r3:6 r4:6 r5:0 r6:5 r7:5 r8:6 r9:3 r10:1.
# Decoded:
#   Martial Prowess 2, Improved Rend 3, Two-Handed Weapon Mastery 2, Lingering Wounds 3, Anger Management 3, Mortal
#   Strike 1, Impale 2, Deep Wounds 3, Two-Handed Weapon Specialization 3, Taste for Blood 3, Sweeping Strikes 1,
#   Improved Sweeping Strikes 2, Weapon Specialization 3, Colossus Smash 1, Strength of Arms 2, Momentum 2, Improved
#   Mortal Strike 2, Weight of the Earth 1, Seismic Reverberation 2, Sudden Death 3, Bladestorm 1, Endless Rage 2,
#   Wrecking Crew 3, Avatar 1.
# Not bought:
#   Heavy Blows, Martial Prowess (2/3), Improved Charge, Improved Overpower, Exploiter, Battlelord, Trauma, Second
#   Wind, Juggernaut, Blood Frenzy.
#
# Gear (D33): ONE two-hander, 19200 "3600 Test 2h Axe 63 blue" (2H axe 155-233, 3.6 speed, required level 58, item level
# 63, no proc; a test item in item_template). An axe makes Weapon Specialization its crit variant (no sword extra
# attack, no weapon proc noise in the damage line), so this is the DPS baseline weapon. Keep the weapon identical
# across ArmsWarriorSim and ArmsWarriorPackSim.
#
# BLIND SPOTS (the sim cannot show these; report "not observed", do not file them as bugs):
#   - the dummy never attacks: no parry or dodge (no parry-granted Overpower charge), no rage from damage taken, no
#     Second Wind trigger, no Intervene, no defensive row;
#   - the dummy never casts: Pummel and interrupt rows stay dead;
#   - the dummy stands within 3 yd of the pull: Charge and Heroic Leap have an 8 yd minimum range, so those rows are
#     dead and Juggernaut never procs (Weight of the Earth and Improved Charge are not exercised either);
#   - one passive dummy that never dies: no "tank has it" opener timing, no Skull Banner "fewer than half Rallied" row;
#   - Execute and Exploiter need the dummy under 20% health: use the health-drain variant,
#     ArmsWarriorCoverDrainSim.conf.


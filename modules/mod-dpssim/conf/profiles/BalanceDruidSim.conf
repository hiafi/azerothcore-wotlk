# Spirit, 437 spell power. Intellect and Spirit below are the gear part only: the target minus a level-60 Tauren
# druid's base (player_class_stats + player_race_stats: 96 Intellect, 112 Spirit). Spell power from stats is
# floor(Int / 2) + floor(Spirit / 2) (Unit::SpellBaseDamageBonusDone) = 95 + 106, so the flat SpellPower is 236.

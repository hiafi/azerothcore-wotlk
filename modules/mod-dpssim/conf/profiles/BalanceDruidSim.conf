#
# DpsSim profile: BalanceDruidSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for the
# full field list and what each means.
#
# Runs the reworked Balance rotation (mod-playerbots branch rework-bot-strategies, DruidReworkBalanceStrategy
# behind the "balance" strategy, data/strategies/druid/balance.yaml) - see
# .agents/plans/rework-bot-strategies/rework-bot-strategies.DRUID.YAML-PASS.md, Stage DS. Resto and Bear are
# tested in game only.
#
# RACE: pass 6 (Tauren). run-sim.sh defaults to race 1 (Human), which cannot be a druid, and the sim runs at the
# race's start position: a Night Elf (4) stands in Shadowglen with wildlife within 30 yd, which the Starfall rows
# and stock Starfall treat as unengaged mobs (DQ3), so Starfall never fires there. Run at level 60:
#   modules/mod-dpssim/tools/run-sim.sh BalanceDruidSim 300 60 6 10
#
# What a run checks (the pass's Stage DS Balance list, from the cast log and aura events on actor and target):
#   - Moonkin Form kept up;
#   - the Eclipse aura log alternates Solar / Lunar with no ~15 s gap (DR17);
#   - Moonfire / Insect Swarm cast only when missing or inside the Eclipse windows;
#   - Fury of Elune -> Starfall inside Celestial Alignment;
#   - Starsurge on cooldown;
#   - no Hurricane (at 1 target);
#   - self-Innervate below 50% mana (the actor is solo).
# Tune thresholds in balance.yaml and re-run: the YAML hot-reloads, no rebuild.
# A second run with DummyHealthDrain = true (below) checks that Force of Nature (>= 30 s) and Fury of Elune (>= 8 s)
# stop being cast near the end of the dummy's life.
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. Exercises Moonfire and Starfall from 2 targets; Insect Swarm, Starfire and
#   Fury of Elune from 3; Hurricane from 5.
#   modules/mod-dpssim/tools/run-sim.sh BalanceDruidSim 180 60 6 5 100 3

# Dummy health drain (SimProfile.h, Profile::DummyHealthDrain/DummyMaxHealth) - deliberately OFF/absent here for
# the baseline run. The sim dummies 900004/5/6 are rank 3 (world boss), so the elite() and boss() conditions are
# true and the lifetime gates pass; the dummy never dies. For the drain-on check, add
#   DummyHealthDrain = true
#   DummyMaxHealth = <n>      (something a 300 s fight can drain)

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_DRUID (SharedDefines.h)

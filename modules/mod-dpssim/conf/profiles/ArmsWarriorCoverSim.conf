#
# DpsSim profile: ArmsWarriorCoverSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Shape of CombatRogueSim.conf and
# ProtWarriorSim.conf. Warrior rework stage S2 (Arms), D33 in .agents/plans/warrior-rework/warrior-rework.S2-HANDOFF.md.
#
# PURPOSE: COVER profile. One Arms build that spends 51 points on the talents the two guide builds skip (Exploiter 2,
# Trauma 2, Second Wind 2, Heavy Blows 3, Juggernaut 2, Improved Charge 2), so one run puts their server data on a
# sheet: Heavy Blows (Heroic Strike), Trauma (Mortal Strike's bleed), Exploiter (needs the health drain variant),
# Weapon Specialization's SWORD strike (weapon 21492), Deep Wounds, Sudden Death and Wrecking Crew. A coverage
# profile, not a DPS baseline: no Sweeping Strikes, so no pack criteria. Run it at 1 target.
#
# RUN (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets]; the user default is
# 60 s x 5 iterations at a 100 ms step, level 60, race 2 = Orc: a Human start has an attackable Wild Turkey 17.5 yd
# away that changes "enemies within 8 yd" counts, so every Arms run uses Orc and the baselines compare):
#   DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh ArmsWarriorCoverSim 60 60 2 5 100 1
# Execute and Exploiter (Execute below 20% health): the health-drain scratch variant, ArmsWarriorCoverDrainSim.conf.
# Check the realm flag after the sims (sims set realmlist.flag=1; builds older than the Main.cpp gate need
# `flag & ~1`). The sim reads the live world DB and runs the live image: generate + db-import and the image rebuild
# must be live before any Arms sim.
#
# WHAT TO READ: GCD presses per minute and gaps (casts[]); Mortal Strike / Colossus Smash / Overpower / Slam / Rend
# counts; Colossus Smash debuff uptime (204491 on target 0); Overpower charges over time (204403 auraSamples);
# Deep Wounds tick sizes rising at crit timestamps;
# Sudden Death resets (Mortal Strike closer than its 6 s cooldown); rage gained and spent per minute (powerSamples +
# casts[].powerCost) and starvation seconds (Mortal Strike ready with rage < 25); this build owns neither Sweeping
# Strikes nor Momentum: no copies and no free Slams to read.
# With DPSSIM_BOT_LOG=1 count the `A:arms <action> - FAILED` lines
# (real) against `IMPOSSIBLE` (rage or cooldown, normal). Compare the rage numbers with rage_sweep.py's ARMS BUDGET
# (D36).
# Aura samples (AuraSampleIds: sampled every step for the actor, plus this actor's aura on target 0):
#   204403 Overpower charge (Taste for Blood), 204491 Colossus Smash debuff (shows on the target), 204503 Endless Rage
#   overflow buff, 204501 / 204502 Strength of Arms buffs (rank 1 / 2), 204498 Momentum, 204493 Sweeping Strikes,
#   204492 Avatar, 204505 / 204506 / 204507 Wrecking Crew (rank 1 / 2 / 3), 204504 Exploiter debuff (shows on the
#   target), 204496 Deep Wounds holder. They fill the report's auraSamples[] ({ts, spellId, onTarget, stacks,
#   remainingMs}): stack counts and charges over time, which auraEvents (first apply / removal only) cannot give.
#
# TALENTS: a custom 51-point link (not in the guide, no premade slot),
# 51 points on the 33-talent Arms grid (docs/reworks/warrior-arms-rework.md section 4). Digits run in (row, column)
# order, empty cells skipped. Proved legal (rank <= max, 5 points in the rows above per row) with row sums
# r0:9 r1:7 r2:9 r3:6 r4:3 r5:4 r6:3 r7:2 r8:4 r9:3 r10:1.
# Decoded:
#   Heavy Blows 3, Martial Prowess 3, Improved Rend 3, Improved Charge 2, Two-Handed Weapon Mastery 2, Lingering
#   Wounds 3, Anger Management 3, Mortal Strike 1, Impale 2, Deep Wounds 3, Two-Handed Weapon Specialization 3, Taste
#   for Blood 3, Weapon Specialization 3, Exploiter 2, Trauma 2, Second Wind 2, Colossus Smash 1, Juggernaut 2,
#   Sudden Death 3, Bladestorm 1, Wrecking Crew 3, Avatar 1.
# Not bought:
#   Improved Overpower, Sweeping Strikes, Improved Sweeping Strikes, Battlelord, Strength of Arms, Momentum, Improved
#   Mortal Strike, Weight of the Earth, Seismic Reverberation, Blood Frenzy, Endless Rage.
# Cover link (not a guide build): the guide builds skip Exploiter, Trauma, Second Wind, Heavy Blows, Juggernaut and
# Improved Charge, so this link buys all six to put their data, hooks and procs on a sheet once. It keeps the spine
# (Mortal Strike, Colossus Smash, Deep Wounds 3, Taste for Blood 3, Sudden Death 3, Bladestorm, Wrecking Crew 3,
# Avatar) and drops Sweeping Strikes and the pack talents; Avatar needs 50 points above row 10, so rows 0-9 are
# exactly 50 points. Built with the grid emulator: rank <= max, row gate 5 x row, 51 points, one two-hander.
#
# Gear (D33): ONE two-hander, 21492 Manslayer of the Qiraji (2H SWORD 157.5-292.5, 3.6 speed, +20 Strength, +9 Agility,
# +20 Stamina, required level 60, item level 66; the DK profiles use it; item_template read 2026-10-30).
# The sword is the variation: Weapon Specialization 3/3 on a sword fires its
# extra-strike (spells 204514 / 204517 / 204520 -> 204511), which an axe (crit) or a mace (armor penetration) does not.
# Count the sword strikes as extra hits at the same ms as a white swing, or triggered casts of 204511. For an axe run
# swap to 19200 on a scratch copy (give run-sim.sh the path).
#
# BLIND SPOTS (the sim cannot show these; report "not observed", do not file them as bugs):
#   - the dummy never attacks: no parry or dodge (no parry-granted Overpower charge), no rage from damage taken, no
#     Second Wind trigger, no Intervene, no defensive row;
#   - the dummy never casts: Pummel and interrupt rows stay dead;
#   - the dummy stands within 3 yd of the pull: Charge and Heroic Leap have an 8 yd minimum range, so those rows are
#     dead and Juggernaut never procs (Weight of the Earth and Improved Charge are not exercised either);
#   - one passive dummy that never dies: no "tank has it" opener timing, no Skull Banner "fewer than half Rallied" row;
#   - Execute and Exploiter need the dummy under 20% health: use the health-drain variant,
#     ArmsWarriorCoverDrainSim.conf.
#   - Second Wind, Juggernaut and Improved Charge never trigger (no stun or damage taken, no Charge or leap): only their
#     data and tooltips are covered. Heavy Blows (Heroic Strike and Slam damage) and Trauma (bleed damage taken) do show
#     in the damage line.

# Pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs) - absent, so the default of 15000 sim ms applies (Battle
# Stance and Battle Shout settle unrecorded, then the pull).


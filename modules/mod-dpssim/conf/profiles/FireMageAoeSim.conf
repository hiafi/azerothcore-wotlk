# The Fire AoE build (docs/reworks/bot-strategy/mage-fire-strat.md): the raid build -303330300133303001331103301331
# (slot 8.1) with Improved Scorch 3/3 at (3,0) out, Blast Wave 1/1 at (4,2) and Firestarter 2/2 at (8,0) in. 51
# points; every rank and row gate checked against the talent source (apps/dbc-tools/source/classes/mage/
# mage_talents.py), Firestarter's Dragon's Breath prerequisite met. Same string as Playerbots.PremadeSpecLink.8.7.60.
# Run at level 60, run-sim.sh's default.
PlayerbotTalents = -303330300103303101331103321331

# The class's premade glyphs (Playerbots.PremadeSpecGlyph for the spec tab), applied as a live random bot
# gets them. true is the default; set false for an unglyphed actor (every run before 2026-10-06).
PlayerbotGlyphs = true

# Gear (user 2026-11-15): the "Fire Mage" kit of .agents/plans/blackrock-gear/blackrock-gear.SIM-KITS.md - the

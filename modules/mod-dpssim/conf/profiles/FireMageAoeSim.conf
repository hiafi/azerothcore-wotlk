# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py). Same DPS-relevant-stat
# selection as Frost/Arcane.
#
# TestProcChanceRating = true. Fire's two %-chance mechanics - Tinderbox (5,0) and Fanned Flames
# (7,1) - multiply their talent rank's percentage by Proc Chance since S22 (2026-11-22,
# fire-mage-rework.md: both scale with it). The 2026-09-16 pass that left them unscaled was a bug,
# not a design call. Fire Blast's guaranteed crit, Burnout's capstone, Playing with Fire's cooldown
# reduction, and Blazing Speed's capstone are deterministic-on-hit, not chance rolls.

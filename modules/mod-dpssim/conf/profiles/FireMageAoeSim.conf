#
# DpsSim profile: FireMageAoeSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when
# DpsSim.Profile points at this file. Format: "Key = Value" lines, "#" comments, blank lines
# ignored. See SimProfile.h's Profile struct for the full field list and what each means.
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. Exercises Ignite, Meteor and Living Bomb from 2 targets; Dragon's Breath
#   from 3; Flamestrike and Blizzard from 5.
#   modules/mod-dpssim/tools/run-sim.sh FireMageSim 180 60 8 5 100 3
# The Human start's Wild Turkey keeps the AoE safety gates closed, so run multi-target at race 8 (Troll); the sim's
#   one-time "stray unit" warning flags this.
#
# Created for the AoE round 3 stage (.agents/plans/blackrock-gear/blackrock-gear.STAGE-AOE3-HANDOFF.md, Agent M item 1;
# user ruling 2026-11-16: AoE is judged on a pack / AoE profile). The Fire AoE build: the same rotation and gear as
# FireMageSim.conf (the main, single target / raid build, live slot 8.1) with three talent changes - Improved Scorch 3/3
# out, Blast Wave 1/1 (4,2) and Firestarter 2/2 (8,0) in (51 points either way). The bot rows are in the module's
# data/strategies/mage/fire.yaml: Blast Wave on a pack (3+ near the target, under Dragon's Breath) and Flamestrike
# at once on the Firestarter buff (54741) on a pack of 4+. Neither row can fire without the talent, so the raid build
# is unaffected. Judge it on 5 targets only; its 1T is about -40 under FireMageSim (no Improved Scorch) and it is not
# the single target profile. Matches the live premade slot 8.7 "fire aoe" (Playerbots.PremadeSpecLink.8.7.60, applied by
# the coordinator from the stage report).
#   modules/mod-dpssim/tools/run-sim.sh FireMageAoeSim 60 60 8 5 100 5

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_MAGE (SharedDefines.h). Same class as FrostMageSim/ArcaneMageSim - only the talents
# differ (mage specs are talent trees, not separate classes).

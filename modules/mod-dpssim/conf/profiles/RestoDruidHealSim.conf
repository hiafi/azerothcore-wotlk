#
# DpsSim profile: RestoDruidHealSim
#
# Healing-sim profile (stage HS3; plan .agents/plans/healing-sim/healing-sim.PLAN.md): a level-60 Tauren Druid that
# heals a group of headless allies while the Sim Raid Boss damages them with real hits. "Mode = Heal" makes
# SimProfile::Load() send the batch down the heal path (SimDaemon::RunHealBatch). Format: "Key = Value" lines, "#"
# comments, blank lines ignored.
#
# The heal keys (SimHeal.h has the full syntax): HealGroup is party (5), raid10 or raid20, and the healer is always
# one of the members. HealTargets lists one "<count>*<role>:<mode>" entry per member in index order, role tank | dps |
# self (exactly one self, the healer) and mode drain:<damage per pulse> | drain:<pct>% | pin:<pct>. pin:50 keeps the
# member at 50% health with real damage hits (the pure-HPS measurement: no overheal, no deaths); drain:150 hits it for
# 150 every pulse and it can die (the survival measurement). Target 0 is the main tank. DpsSim.HealGroup /
# DpsSim.HealTargets in the conf override both keys.
#
# Bot strategy exercised: the reworked Restoration rotation: DruidReworkRestoStrategy ("druid/resto",
# data/strategies/druid/resto.yaml) with the "healer dps" strategy. The sim ticks the real PlayerbotAI; nothing here
# steers it.
#
# Race: Tauren (run-sim.sh's [race] argument 6). The group stands in front of the healer at the race's start position.
#
# Talents: Playerbots.PremadeSpecLink.11.2.60 of the live env/dist/etc/modules/playerbots.conf (the bots' premade
# build), decoded against the live talent_dbc/talenttab_dbc: 51 points, every rank and row gate legal. Tabs are in
# tab-page order and talents in (row, column) order, the same as PlayerbotAIConfig::ParseTempTalentsOrder(). The
# build, by tree:
#   Restoration (51 points): Improved Mark of the Wild 2/2, Nature's Resilience 3/3, Nature's Mending 3/3, Ysera's
#       Gift 3/3, Perennial 3/3, Intensity 3/3, Swiftmend 1/1, Improved Rejuvenation 3/3, Gift of Nature 3/3, Wild
#       Growth 1/1, Improved Tranquility 2/2, Empowered Touch 2/2, Empowered Rejuvenation 3/3, Nature's Bounty 3/3,
#       Living Spirit 3/3, Bloom 1/1, Proliferation 3/3, Revitalize 1/3, Tree of Life 1/1, Photosynthesis 3/3, Gift of
#       the Earthmother 3/3, Flourish 1/1
#
# Glyphs: the class's premade glyphs for the spec (Playerbots.PremadeSpecGlyph.11.2 =
# 40906,43331,45602,43335,43674,45603: Swiftmend, Unburdened Rebirth, Wild Growth, the Wild, Dash, Nourish), applied
# as a live random bot gets them. The live config's Playerbots.BotGlyphs = 0 wins anyway, so the actor runs
# unglyphed.
#
# Gear/stats: docs/.items.md "Balance/Resto Druid Dungeon Gear" (item ids 22267, 18681, 18389, 13141, 18385, 18497,
# 13253, 11662, 11823, 18322, 13178, 18534). The flat values below are measured, not typed: the same profile with and
# without Gear = <those ids> (talents, glyphs and buffs off, level 60 Tauren) logs the actor's character sheet at
# creation ("SimActor sheet", SimActor.cpp), and the profile holds the difference, so a flat value is exactly what the
# gear adds, applied the way an item applies it (HandleStatFlatModifier on the base value).
#
#   target sheet (gear) - race/class base = flat value in this profile
#   Intellect   217 -   96 =  121
#   Spirit      135 -  112 =   23
#   Stamina     210 -   71 =  139
#   Spell power (the flat part, m_baseSpellPower)  191 - 0 = 191
# Ratings (the base has none): crit 15, haste 6, mastery 21, versatility 33, cooldown haste 0. Healing power on top of
# the flat spell power is floor(Intellect / 2) + floor(Spirit / 2) = 108 + 67 (Unit::SpellBaseHealingBonusDone), so
# the sheet shows 366 for healing. Max health 3477 and mana 4219 on that sheet (naked: 2087 / 2404). Armor and
# strength are not set: the sim's damage is magic. Item procs (a ring's or a cloak's equip spell, set bonuses) are not
# reproduced, as in every DPS profile.
#
# The Shadow Priest / Balance Druid DPS profiles carry an older sheet (2026-10-07: priest 191 Int / 213 Spirit / 437
# spell power, druid assumed the same). The set's current stats differ from those; this profile uses the current ones.
# See the HS3 findings.
#
# The scenario keys above are the party default; run-sim.sh overrides them per run with HEALSIM_GROUP /
# HEALSIM_TARGETS / HEALSIM_INFINITE_MANA. The sweep of the HS3 stage (D10, D11), from the repo root: 120 s, level 60,
# race 6, 10 iterations:
#
#   S="modules/mod-dpssim/tools/run-sim.sh RestoDruidHealSim 120 60 6 10"
#   for G in party raid10 raid20; do
#     HEALSIM_GROUP=$G HEALSIM_TARGETS=pin50 HEALSIM_INFINITE_MANA=1 $S    # max output
#     HEALSIM_GROUP=$G HEALSIM_TARGETS=pin50 HEALSIM_INFINITE_MANA=0 $S    # sustain
#     HEALSIM_GROUP=$G HEALSIM_TARGETS=pin20 HEALSIM_INFINITE_MANA=1 $S    # low-health throughput
#   done
#   HEALSIM_GROUP=party  HEALSIM_TARGETS=drain:150 HEALSIM_INFINITE_MANA=0 $S    # triage
#   HEALSIM_GROUP=raid10 HEALSIM_TARGETS=drain:75  HEALSIM_INFINITE_MANA=0 $S
#   HEALSIM_GROUP=raid20 HEALSIM_TARGETS=drain:40  HEALSIM_INFINITE_MANA=0 $S
#
# The three drain levels put about 1,000 damage a second into the group (tanks take 3x a DPS member's share). Max
# output = HPS of the pin50 run with infinite mana; sustain = the mean time before the healer runs out of mana
# (oomAtMs) in the pin50 run with normal mana; HPS before OOM and whole-fight HPS stay in the reports as detail.
#

# CLASS_DRUID (SharedDefines.h)
Class = 11

Mode = Heal
HealGroup = party
HealTargets = tank:pin:50, 3*dps:pin:50, self:pin:50

# Allies: the tank is a Protection Warrior (AllyTankTalents; the default string is ProtWarriorSim.conf's), the DPS are
# untalented Rogues. Max health is pinned through the BASE part of the health modifier, so Fortitude / Kings / Mark of
# the Wild still add. A pinned target (the healer's slot included) gets PinMaxHealth instead, so a heal never fills
# it; the AllyMaxHealth values apply to drain targets only. All three are at least 1,000.
AllyMaxHealth.Tank = 9000
AllyMaxHealth.Dps = 5000
PinMaxHealth = 30000
AllySpreadYards = 10
DrainPulseMs = 1000
# true keeps the healer's mana full during the fight (a pure-throughput run); run-sim.sh's HEALSIM_INFINITE_MANA sets it
# per run without editing this file
InfiniteMana = false

PlayerbotTalents = --2003303330103031223331030113031
PlayerbotGlyphs = true

SpellPower = 191
AttackPower = 0

CritRating = 15
HasteRating = 6
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 21
VersatilityRating = 33
CooldownHasteRating = 0
ProcChanceRating = 0

Strength = 0
Agility = 0
Stamina = 139
Intellect = 121
Spirit = 23

# No stat-weight passes for a healing profile (stat_weights.py is DPS-only)
StatWeightsEnabled = false

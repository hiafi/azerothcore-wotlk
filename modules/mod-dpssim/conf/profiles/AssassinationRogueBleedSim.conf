#
# DpsSim profile: AssassinationRogueBleedSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Shape of EnhShamanSim.conf (dual-wield melee,
# the shared flat stat block). Created for the Rogue rework stage S1b (.agents/plans/rogue-rework/
# rogue-rework.S1b-HANDOFF.md, part 1 Part D; part 2 runs it).
#
# Runs the reworked Assassination rogue's rotation (mod-playerbots branch feat/rogue-assassination-bot-strategy: the
# "assassin" strategy, data/strategies/rogue/assassination.yaml and assassination-pack.yaml,
# RogueReworkAssassinationStrategy). Guide: docs/reworks/bot-strategy/rogue-assassination-bot-guide.md. The talents are
# the guide's slot 4.1 "assassination bleed" build: the dungeon / pack / bleed build (Remorseless Attacks, Blood
# Spatter, Shattering Vial, Venomous Fan, Cut Throat, Indiscriminate Carnage; poisons at 60: Deadly and Wound). It
# lacks Puncturing Wounds, Lethality, Cold Blood, Focused Attacks and Toxic Blade, which AssassinationRogueSim.conf
# (slot 4.0) exercises.
#
# RACE: pass 2 (Orc), as ShamanEleSim.conf. run-sim.sh defaults to race 1 (Human), and the sim runs at the race's start
# position: a Human start has an attackable Wild Turkey 17.5 yd away that closes the AoE gates ("enemies within 8 yd"
# counts it), Orc's Valley of Trials has only friendly NPCs nearby. Run at level 60 (60 s x 5 iterations, 100 ms step):
#   modules/mod-dpssim/tools/run-sim.sh AssassinationRogueBleedSim 60 60 2 5 100 1
# The first smoke run keeps the log (read it before the numbers):
#   DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh AssassinationRogueBleedSim 60 60 2 1
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); 2+ targets use the elite pack dummies stacked within
# 3 yd. The pack list (Poison Bomb, Fan of Knives, Rupture on the longest-lived enemy, Kingsbane on the longest-lived
# one) needs 3+ enemies within 8 yd of the bot:
#   modules/mod-dpssim/tools/run-sim.sh AssassinationRogueBleedSim 60 60 2 5 100 3
#
# Levels below 58 (the weapons below need level 58): copy this profile to a scratch path (give run-sim.sh the path),
# set `Gear = 2092,2092` (two Worn Daggers) and use the guide's `.45` link for a level 45 run or the `.30` link for a
# level 30 run (the .20 and .50 links are in modules/mod-playerbots/conf/playerbots.conf.dist for 20 and 50):
#   modules/mod-dpssim/tools/run-sim.sh <scratch path> 60 45 2 5 100 1
#
# Expected in the run log: "SimActor created" naming both daggers (Heartseeker and Scarlet Kris), "actor after the
# first second" with the sheet, "strategies resolved" listing "assassin" among the combat strategies, 51 talent points
# spent, and Stealth and the poison auras (Lethal x2 once Master Poisoner has three ranks, Crippling) up at the pull.
#
# Cannot be simmed (one passive dummy that never dies and never threatens the actor, no party): Zoldyck Recipe below
# 30% health (the dummy zeroes its damage unless DummyHealthDrain), Remorseless Attacks (it never dies), Tricks of the
# Trade, Vanish's "the tank held it for 5 s" and the Shroud discipline (no party, no tank), and the Poison Bomb's
# "engaged" checks (stacked dummies pass them trivially).

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_ROGUE (SharedDefines.h)
Class = 4

# Talents: the guide's slot 4.1 .60 link (docs/reworks/bot-strategy/rogue-assassination-bot-guide.md, and
# Playerbots.PremadeSpecLink.4.1.60 of modules/mod-playerbots/conf/playerbots.conf.dist), 51 points on the
# rework's Assassination grid (tab 182). Assassination is the first tab, so there are no dashes.
PlayerbotTalents = 3320320120223011033210300032301221

# Unglyphed actor: all rogue glyphs are retired server-wide.
PlayerbotGlyphs = false

# Pre-pull buff phase: 30 s instead of the default 15 s, so the three poison casts (Lethal x2, Crippling) and Stealth
# land before the pull (the buff phase keeps the nc strategy).
PrePullBuffMs = 30000

# Gear/stats: the same flat stat block as EnhShamanSim.conf and FeralCatSim.conf (290 attack power, 121 Agility, 105
# crit, 22 haste, 15 mastery, 31 versatility, 5 cooldown haste, 13 proc chance), so the rogue is measured on the same
# footing as the other reworked melee profiles. Only the two weapons are worn; their own stats come on top. Mutilate
# normalizes each hand to a 1.7 speed weapon, so daggers serve every row (Backstab, the one dagger-gated button, is a
# leveling one).
#   Main hand  12783 Heartseeker   (dagger, 49-92, 1.7 speed, requires level 58, no on-hit proc)
#   Off hand   5267  Scarlet Kris  (dagger, 43-81, 1.5 speed, requires level 58, no proc; a rogue starts with Dual
# Wield)
# Check the "SimActor created" and "actor after the first second" log lines for the sheet.
Gear = 12783,5267

SpellPower = 0
AttackPower = 290
CritRating = 105
HasteRating = 22
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 15
VersatilityRating = 31
CooldownHasteRating = 5
ProcChanceRating = 13
Strength = 0
Agility = 121
Stamina = 0
Intellect = 0
Spirit = 0

# Master switch - see ArcaneMageSim.conf's own comment on this key. Off: stat weights for this profile are not set up.
StatWeightsEnabled = false

#
# DpsSim profile: FeralCatSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for
# the full field list.
#
# Runs the reworked Cat rotation (mod-playerbots branch rework-bot-strategies, DruidReworkCatStrategy behind the
# "cat" strategy, data/strategies/druid/cat.yaml) - see
# .agents/plans/rework-bot-strategies/rework-bot-strategies.DRUID.YAML-PASS.md, Stage DS. Bear is tested in game
# only (the passive dummy never attacks, so no Ironfur / Barkskin / Berserk / AoE rows and no rage).
#
# RACE: pass 6 (Tauren) to match the Balance profile; any druid race works for the Cat rows. run-sim.sh defaults to
# race 1 (Human), which cannot be a druid. Run at level 60:
#   modules/mod-dpssim/tools/run-sim.sh FeralCatSim 300 60 6 10
#
# What a run checks (the pass's Stage DS Cat list, from the cast log and aura events on actor and target):
#   - Mangle (Cat) debuff, then Rake; Rip at 5 combo points;
#   - Ferocious Bite only with Rip >= 2 s left;
#   - Tiger's Fury below 40 energy and never while Berserk is up;
#   - Berserk only with Rip and Rake on the target;
#   - Shred vs Mangle chosen by the "behind" value;
#   - bleed ticks count in the damage totals (PLAN S0).
#
# THE OPENER CANNOT FIRE: Feral Charge (Cat) and the Ravage opener never run here. The dummy spawns 8 yd from
# the actor (SimDaemon.cpp:505,593,662), inside Feral Charge's minimum range (8-25 yd). Stage DV (the in-game
# playtest) covers the opener.

# Dummy health drain (SimProfile.h, Profile::DummyHealthDrain/DummyMaxHealth) - both off/absent here:
#   DummyHealthDrain = true   the dummy takes real damage but never drops below 1 health, and is refilled at the
#                             start of every iteration, so "target below 20%"-style execute rows can fire.
#   DummyMaxHealth = <n>      the dummy's max health (what those percentages are measured against); absent or 0 =
#                             SimTarget's default of 100,000,000. Set it to something a fight can drain.
# With neither key present the dummy zeroes all damage, exactly as before. The dummies 900004/5/6 are rank 3, so
# elite() and boss() are true.

# CLASS_DRUID (SharedDefines.h)
Class = 11

# The Cat guide build (docs/reworks/bot-strategy/druid-feral-dps-strat.md; Druid plan Stage DC2). Decoded against
# the live talent_dbc: 51 points, every rank and row gate legal, no Elder Hide (so the bot reads as a cat, not a
# bear). The same string as AiPlayerbot.PremadeSpecLink.11.3.60 (the bots' premade build).
PlayerbotTalents = -350023002032302300023003103303003101

# The class's premade glyphs (AiPlayerbot.PremadeSpecGlyph for the spec tab), applied as a live random bot
# gets them. The live config's AiPlayerbot.BotGlyphs = 0 wins anyway, so the actor runs unglyphed.
PlayerbotGlyphs = true

# Gear/stats - the Ret paladin's captured ratings reused as a melee stand-in (no druid character was captured).
# Hit/expertise are left at 0: this server's stat system gives 100% PvE hit and expertise.
#
# Ursol's Claw (24155): two-handed staff, 144-268, 3.0 speed, +14 Agility, +30 attack power; no class
# restriction (AllowableClass -1), required level 60. Druids train Staves; SimActor grants a gear weapon's skill
# at the level cap before equipping. Cat Form does use the weapon: StatSystem.cpp adds feral attack power from
# weapon DPS, about (68.8 DPS x 14) - 767 = 196 AP for this staff, on top of its +30 attack power and +14 Agility
# (and its Stamina). Its "SimActor created" log line names the main-hand item and the total melee attack power.
Gear = 24155

# AttackPower is a flat top-up on top of level/Strength/gear. 700 is a rough stand-in; retune it from the
# "SimActor created" log line against a real character sheet.
SpellPower = 0
AttackPower = 700

CritRating = 134
HasteRating = 32
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 15
VersatilityRating = 25
CooldownHasteRating = 8
ProcChanceRating = 19

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py): the stats a melee Cat druid's
# damage uses. Spell power and the caster stats are off.
TestStrength = true
TestAgility = true
TestStamina = false
TestIntellect = false
TestSpirit = false
TestSpellPower = false
TestAttackPower = true
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = true

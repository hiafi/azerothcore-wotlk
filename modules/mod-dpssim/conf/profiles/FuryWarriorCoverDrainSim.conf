#
# DpsSim profile: FuryWarriorCoverDrainSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this file.
# Format: "Key = Value" lines, "#" comments, blank lines ignored. Shape of ArmsWarriorSim.conf and
# WarriorRage2HStartSim.conf. Warrior rework stage S3 (Fury), D43 / D46 in .agents/plans/warrior-rework/warrior-
# rework.S3-HANDOFF.md.
#
# PURPOSE: SCRATCH health-drain variant of FuryWarriorCoverSim.conf (same link, gear and stats; only the two dummy
# health keys are added). The default dummy takes no real damage (its health never moves), so Execute, Improved
# Execute stacks, Deathmaker and the Execute-phase rows never open. With DummyHealthDrain = true the dummy takes real
# damage but never drops below 1 health, and resets to full at every iteration; DummyMaxHealth = 30000 makes the
# percentage move: a Fury hitting about 800-1,000 a second crosses 35% at about 20 s and 20% at about 25-28 s (same
# sizing as ArmsWarriorCoverDrainSim.conf, rogue S2b run 6), leaving 30+ s of Execute phase. Read the crossing times
# in the first run and resize DummyMaxHealth if either lands outside 15-35 s (damage up: raise it; down: lower it).
# Run at 1 target.
# To start INSIDE the Execute phase instead use DummyStartHealthPct (S3 Fury addition, modules/mod-dpssim/README.md):
# set `DummyStartHealthPct = 21` and `DummyMaxHealth = 600000`; each dummy starts every iteration at 21% of its max
# health (126,000), already below 35%, crosses 20% after about 6 s at ~1,000 DPS, and the 120,000 left at 20% keep a
# 60 s run off the 1-health floor. (36% with 600000 would need about 96 s to reach 20%.) It is left off here so the
# baseline matches the Arms drain profile.
#
# RUN (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets]; the user default is
# 60 s x 5 iterations at a 100 ms step, level 60, race 2 = Orc: a Human start has an attackable Wild Turkey 17.5 yd
# away that changes "enemies within 8 yd" counts, so every Fury run uses Orc and the baselines compare):
#
#  DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh FuryWarriorCoverDrainSim 60 60 2 5 100 1
# The non-drain twin is FuryWarriorCoverSim.conf.
# Check the realm flag after the sims (sims set realmlist.flag=1; builds older than the Main.cpp gate need `flag &
# ~1`). The sim reads the live world DB and runs the live image: generate + db-import and the image rebuild must be
# live before any Fury sim. The first smoke run keeps ONE iteration only (read the log before the numbers):
#
#  DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh FuryWarriorCoverDrainSim 60 60 2 1 100 1
#
# WHAT TO READ: the second the dummy goes under 35% and under 20% (damage cumulated against DummyMaxHealth); Execute
# casts after the 20% mark (>= 4 expected), no Execute above 20% except on a Deathmaker buff (204638 up); no Execute
# below 90 rage while the Reserve is on; Improved Execute crit stacks (204641, 3 max); Deathmaker applications;
# Merciless (Rampage free under Recklessness); the Execute phase's idle GCDs (D46: about 10 a minute at the start
# bracket, Execute 6.3 x 30 rage: a design gap, report it); Enrage uptime in the Execute phase (the guide's 63% at
# T0). Execute's extra rage comes out of powerSamples (casts[].powerCost is the 30 base only); the meter is credited
# rage before minus rage after.
#
# Aura samples (AuraSampleIds, sampled every step for the actor, plus this actor's aura on target 0; they fill the
# report's auraSamples[] {ts, spellId, onTarget, stacks, remainingMs}: stack counts and refreshes over time, which
# auraEvents (first apply / removal only) cannot give):
#  204635 Enrage meter (19 stacks, one per 10 rage paid; the stack count resetting is a meter fill)
#  204636 Enrage (the buff; a refresh while up shows as remainingMs jumping up)
#  12292 Death Wish, 1719 Recklessness (stacks = charges, one per Rampage), 2458 Berserker Stance
#  204637 Blood Rush free Rampage, 204652 Bloodsurge (free Slam / Cleave), 204638 Deathmaker (Execute usable)
#  12966 / 12967 / 12968 Flurry buff ranks 1 / 2 / 3, 204651 Titan's Grip penalty (D31; 49152 is forced to 0)
#  204642 Cadence (Quick Execution), 204643 Will of the Berserker crit, 204644 / 204645 / 204646 Shredding Blows buff
#  ranks 1 / 2 / 3, 204641 Improved Execute crit stack, 23885 Bloodthirst heal buff.
# A buff the build does not own (its talent is not bought) simply never shows.
#
# TALENTS: the COVER link (rows 0-9 = 50 points, so Titan's Grip is still reachable at 51 in total; proved legal: rank
# <= max, 5 points in the rows above per row). It buys the talents BOTH guide builds skip (Quick Execution, Intensify
# Rage, Will of the Berserker, Shredding Blows) plus Merciless, Improved Execute, Flurry, Blood Rush, Deathmaker and
# Improved Cleave, so every aura / cooldown mechanic of the tree appears at least once in the sims.
# Decoded:
#  Cruelty 3, Merciless 3, Improved Cleave 3, Frenzied Blows 2, Unbridled Wrath 2, Bloodthirst 1, Commanding Presence
#    2, Improved Execute 2, Enrage 5, Quick Execution 3, Death Wish 1, Improved Bloodthirst 2, Flurry 3, Intensify
#    Rage 3, Unshackled Fury 3, Deathmaker 2, Shredding Blows 3, Will of the Berserker 1, Rampage 1, Bloodsurge 3,
#    Blood Rush 2, Titan's Grip 1.
# Not bought:
#  Armored to the Teeth, Dance of Death, Blood Craze, Dual Wield Specialization, Fresh Meat, Piercing Howl, Improved
#    Whirlwind, Improved Berserker Stance, Unending Fury.
# Dual Wield Specialization is deliberately absent: report it, do NOT read DPS off the cover (M tunes). What the cover
# shows: Quick Execution (haste 1-3% + Cadence 204642, 3 stacks per Bloodthirst: spell haste = rage per second 1:1 and
# shorter GCD), Intensify Rage (Death Wish 2 min -> 80 s, Recklessness 5 min -> 200 s: more windows per run; Pummel
# capstone blind), Will of the Berserker (each Rampage -2 s Recklessness cooldown, crit buff 204643 after
# Recklessness), Shredding Blows (204644-6, armor ignore on swings).
#
# Gear (D43): TWO copies of 19200 (2H axe 155-233, 3.6, no proc), Titan's Grip; identical to FuryWarriorSim.conf.
#
# BLIND SPOTS (the sim cannot show these; report "not observed", do not file them as bugs):
#  - the dummy never attacks: no rage from damage taken, no Enraged Regeneration, no Berserker Rage trigger, no
#    Victory Rush (it needs a kill);
#  - the dummy never casts: Pummel and interrupt rows stay dead (Intensify Rage's capstone is blind);
#  - the dummy stands within 3 yd of the pull: Charge and Heroic Leap have an 8 yd minimum range, so those rows are
#    dead (no in-combat Charge rage);
#  - one passive dummy: no tank-engaged timing, "few rallied" is true so Skull Banner always fires on a boss;
#    boss(target) is true only on 1-target runs, elite(target) on 2+;
#  - Dance of Death needs a kill and the sim has no kill (the drain run never kills the dummy: it stays at 1 health);
#  - the damage numbers are an estimate gear set (below), not a captured sheet; this is a ROTATION-SANITY sim, no DPS
#    target (balance belongs to stage M).
#
# SCRATCH COPIES of FuryWarriorSim.conf made by the harness by path (copy this file, change the lines named, run the
# copy; nothing else differs):
#  1.3 .60 + drain (the guide's execute list on the raid build): add `DummyHealthDrain = true` and `DummyMaxHealth =
#    30000` at the end.

# Pre-pull buff phase: absent, so the default of 15000 sim ms applies.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_WARRIOR (SharedDefines.h)
Class = 1

# Arms is the first tab, so a Fury link starts with a dash (empty Arms tab, then the 31 Fury digits).
PlayerbotTalents = -0033322102025310203330230113201

# Unglyphed actor: all warrior glyphs are retired server-wide.
PlayerbotGlyphs = false

Gear = 19200,19200

# Split over two lines (SimProfile::Load accumulates repeated AuraSampleIds keys)
AuraSampleIds = 204635,204636,12292,1719,204637,204652,204638,12966,12967,12968
AuraSampleIds = 204651,2458,204642,204643,204644,204645,204646,204641,23885

# Gear/stats: the START-bracket block of WarriorRage2HStartSim.conf (a level-60 pre-raid dungeon set; estimates, there
# is no captured sheet, the "SimActor created" log line has the real attack power): Strength 110, AttackPower 40,
# Crit 105, Haste 22, Mastery 15, Versatility 31, Cooldown Haste 5, Proc Chance 13; hit and expertise 0 (100% PvE hit
# and expertise on this server). The same block in all Fury profiles, so their numbers compare.
SpellPower = 0
AttackPower = 40

CritRating = 105
HasteRating = 22
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 15
VersatilityRating = 31
CooldownHasteRating = 5
ProcChanceRating = 13

Strength = 110
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Rotation-sanity profile, not a stat-weight target.
StatWeightsEnabled = false

# Health drain: the dummy takes real damage (never below 1 health), resets every iteration; 30000 max health puts
# 35% at about 20 s and 20% at about 25-28 s of a 60 s run.
DummyHealthDrain = true
DummyMaxHealth = 30000

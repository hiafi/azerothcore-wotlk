#
# DpsSim profile: HolyPriestHealSim  --  DRAFT (stage HS1)
#
# The first healing-sim profile, written to test the heal-mode harness (mod-dpssim heal mode, plan
# .agents/plans/healing-sim/healing-sim.PLAN.md). Stage HS3 finalises all four healer profiles (Disc Priest, Holy
# Priest, Resto Druid, Holy Paladin): gear, stats and the scenario defaults below are placeholders until then, so do
# not read a number off this file as a balance result.
#
# Loaded by SimProfile::Load() when DpsSim.Profile points at this file. "Mode = Heal" switches the batch to the healing
# sim: the bot of this class heals a group of headless allies that the Sim Raid Boss damages with real hits. The healer
# is always one of the targets. Format: "Key = Value" lines, "#" comments, blank lines ignored.
#
# Run at level 60 (run-sim.sh's default). The heal keys:
#   HealGroup    party (5) | raid10 | raid20. DpsSim.HealGroup in the conf overrides it.
#   HealTargets  one "<count>*<role>:<mode>:<value>" entry per member, in index order; role tank | dps | self (exactly
#                one self, the healer), mode drain:<hp per pulse> | drain:<pct>% | pin:<pct>. Target 0 should be the
#                main tank. DpsSim.HealTargets in the conf overrides it.
#   pin:50       the member is kept at 50% by real damage hits: the pure-HPS measurement (no overheal, no deaths)
#   drain:450    the member takes 450 damage every pulse and can die: the survival measurement
# See SimHeal.h for the full syntax.

# CLASS_PRIEST (SharedDefines.h)
Class = 5

Mode = Heal
HealGroup = party
HealTargets = tank:pin:50, 3*dps:pin:50, self:pin:50

# Allies: the tank is a Protection Warrior (AllyTankTalents; the default string is ProtWarriorSim.conf's), the DPS are
# untalented Rogues. Max health is pinned through the BASE part of the health modifier, so Fortitude / Kings still add.
AllyMaxHealth.Tank = 9000
AllyMaxHealth.Dps = 5000
# Every PINNED target (the healer's slot included) gets this max health instead: a big pool cannot be filled by the
# heals that land between two pin hits, so a pinned target has no overheal. The AllyMaxHealth values above then apply to
# drain targets only. Heals and shields that scale with max health scale with it. All three are at least 1,000.
PinMaxHealth = 30000
AllySpreadYards = 10
DrainPulseMs = 1000
# true keeps the healer's mana full during the fight (a pure-throughput run); run-sim.sh's HEALSIM_INFINITE_MANA=1 sets
# it per run without editing this file
InfiniteMana = false

# The Holy build: AiPlayerbot.PremadeSpecLink.5.1.60 of the live playerbots.conf (the bots' premade Holy build)
PlayerbotTalents = -233230030301000331013131000330010331001

# The class's premade glyphs (AiPlayerbot.PremadeSpecGlyph for the spec tab). The live config's AiPlayerbot.BotGlyphs =
# 0
# wins anyway, so the actor runs unglyphed.
PlayerbotGlyphs = true

# Gear/stats: the Priest spirit dungeon set, as in ShadowPriestSim.conf (user, 2026-10-07; docs/.items.md "Priest
# Dungeon
# Gear"). Character-sheet totals before talents and buffs: 191 Intellect, 213 Spirit, 437 spell power. Intellect and
# Spirit below are the gear part only (the target minus a level-60 Human priest's base of 120 Intellect and 125 Spirit).
# Spell power from stats is floor(Int / 2) + floor(Spirit / 2) = 95 + 106, so the flat SpellPower is 236. Run as race 1
# (Human); another race changes the base stats. HS3 replaces this with a healer's own set.
SpellPower = 236
AttackPower = 0

CritRating = 12
HasteRating = 13
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 6
VersatilityRating = 24
CooldownHasteRating = 19
ProcChanceRating = 0

Strength = 0
Agility = 0
Stamina = 200
Intellect = 71
Spirit = 88

# No stat-weight passes for a healing profile (stat_weights.py is DPS-only)
StatWeightsEnabled = false

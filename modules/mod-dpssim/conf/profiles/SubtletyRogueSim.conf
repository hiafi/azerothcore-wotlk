#
# DpsSim profile: SubtletyRogueSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Shape of AssassinationRogueSim.conf (dual-wield
# melee, the shared flat stat block). Created for the Rogue rework stage S2b (.agents/plans/rogue-rework/
# rogue-rework.S2b-HANDOFF.md, part 1 Part D; part 2 runs it).
#
# Runs the reworked Subtlety rogue's rotation (mod-playerbots branch feat/rogue-subtlety-bot-strategy: the "subtlety"
# strategy, data/strategies/rogue/subtlety.yaml and subtlety-pack.yaml, RogueReworkSubtletyStrategy). Guide:
# docs/reworks/bot-strategy/rogue-subtlety-bot-guide.md. The talents are the guide's slot 4.5 "subtlety raid" build
# (the single target build: Shadow Resolve, Improved Ambush, Waylay, Honor Among Thieves).
# It lacks Second Volley, Throwing Specialization, Sinister Calling and Camouflage,
# which SubtletyRoguePackSim.conf (slot 4.6) exercises.
#
# RACE: pass 2 (Orc), as ShamanEleSim.conf. run-sim.sh defaults to race 1 (Human), and the sim runs at the race's start
# position: a Human start has an attackable Wild Turkey 17.5 yd away that closes the AoE gates ("enemies within 8 yd"
# counts it), Orc's Valley of Trials has only friendly NPCs nearby. Run at level 60 (60 s x 5 iterations, 100 ms step):
#   modules/mod-dpssim/tools/run-sim.sh SubtletyRogueSim 60 60 2 5 100 1
# The first smoke run keeps the log (read it before the numbers):
#   DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh SubtletyRogueSim 60 60 2 1
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); 2+ targets use the elite pack dummies stacked within
# 3 yd. The pack list (Shadow Dance, then Death from Above, Fan of Knives, Deadly Throw) needs 3+ enemies within 8 yd
# of the bot:
#   modules/mod-dpssim/tools/run-sim.sh SubtletyRogueSim 60 60 2 5 100 3
#
# Levels below 58 (the weapons below need level 58): copy this profile to a scratch path (give run-sim.sh the path),
# set `Gear = 2092,2092` (two Worn Daggers; for level 40 and up add a thrown weapon of required level at most the
# level) and use the guide's `.45` link for a level 45 run or the `.30` link for a level 30 run (the .20, .40 and .50
# links are in modules/mod-playerbots/conf/playerbots.conf.dist for 20, 40 and 50):
#   modules/mod-dpssim/tools/run-sim.sh <scratch path> 60 45 2 5 100 1
#
# Health-drain variant (Executioner below 35% health and its Shadow Dance refund): copy this profile to a scratch path
# with `DummyHealthDrain = true` and run it at level 60 on 1 target.
#
# Expected in the run log: "SimActor created" naming all three weapons (Heartseeker, Scarlet Kris and Flightblade
# Throwing Axe), "actor after the first second" with the sheet, "strategies resolved" listing "subtlety" among the
# combat strategies, 51 talent points spent, and Stealth and the poison auras (one Lethal, Crippling) up at the pull.
#
# Cannot be simmed (one passive dummy that never dies and never threatens the actor, no party): Honor Among Thieves'
# ally (no party), Vanish's "the tank held it for 5 s" and the opener waiting for the tank (no tank), Cheat Death,
# Enveloping Shadows and the Shroud discipline, the executes below 35% health (the dummy zeroes its damage unless
# DummyHealthDrain), and stacked dummies pass Death from Above's "engaged" filter and Throwing Specialization's radius
# trivially. Backstab is positional: if its share is 0 and Ghostly Strike fills in, the actor never stands behind the
# dummy (a sim finding; compare FeralCatSim's Shred share). The 4.5 build has no Throwing Specialization: Deadly
# Throw is one target.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_ROGUE (SharedDefines.h)
Class = 4

# Talents: the guide's slot 4.5 .60 link (docs/reworks/bot-strategy/rogue-subtlety-bot-guide.md, and
# Playerbots.PremadeSpecLink.4.5.60 of modules/mod-playerbots/conf/playerbots.conf.dist), 51 points on the
# rework's Subtlety grid (tab 183). Subtlety is the third tab, so the link starts with two dashes.
PlayerbotTalents = --2330302133230201212031302021321

# Unglyphed actor: all rogue glyphs are retired server-wide.
PlayerbotGlyphs = false

# Pre-pull buff phase: 30 s instead of the default 15 s, so the two poison casts (Lethal, Crippling) and Stealth
# land before the pull (the buff phase keeps the nc strategy).
PrePullBuffMs = 30000

# Gear/stats (user 2026-10-31, normalized across every DPS profile): real item level 55-65 blue dungeon gear and no
# flat primary stats. Gear: the "Feral DPS Druid/Rogue Dungeon Gear" list of docs/.items.md (armor and jewelry; no
# trinkets), with Felhide Cap 18325 in place of the druid-only Wolfshead Helm. Weapons: Heartseeker 12783, Scarlet
# Kris 5267, Flightblade Throwing Axe 28972. The gear's itemization shapes also add the five custom secondaries,
# unevenly by armor type; the flat ratings below top them up (or trim them, when negative) so every DPS profile's
# sheet reads the plate set's 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance (user
# 2026-10-31). Crit is whatever the gear gives. A Devilsaur pair's 2-piece bonus is hit rating, which does nothing on
# this server. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
Gear = 18325,15411,12927,13340,14637,12966,15063,13252,15062,12553,13098,17713,12783,5267,28972

SpellPower = 0
AttackPower = 0
CritRating = 0
HasteRating = 7
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = -2
VersatilityRating = 18
CooldownHasteRating = -7
ProcChanceRating = 6
Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Master switch - see ArcaneMageSim.conf's own comment on this key. Off: stat weights for this profile are not set up.
StatWeightsEnabled = false

#
# DpsSim profile: FrostDk2hSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the Death Knight rework S2b-1
# (.agents/plans/death-knight-rework/death-knight-rework.S2b-HANDOFF.md, part F, U35; shape of EnhShamanSim.conf with
# the Strength flat block of RetPaladinSim.conf).
#
# Runs the reworked Frost Death Knight's DPS rotation, the 6.3 "frost obliteration" build (mod-playerbots branch
# feat/dk-frost-bot-strategy: the "frost" and "frost aoe" strategies, data/strategies/dk/frost.yaml and frost-pack.yaml,
# DeathKnightReworkFrostStrategy; the nc rows of dk/nc-dps put the Rune of Razorice and Horn of Winter up in the
# pre-pull buff phase). Guide: docs/reworks/bot-strategy/death-knight-frost-bot-guide.md.
# A two-hander instead of two one-handers (optional comparison profile: "a two-hander works, but weaker").
#
# RACE: pass 1 (Human) on the command line, level 60. The 6.3 build with a two-handed weapon.
#   modules/mod-dpssim/tools/run-sim.sh FrostDk2hSim 60 60 1 5 # 60 s x 5, single target
#   modules/mod-dpssim/tools/run-sim.sh FrostDk2hSim 300 60 1 5 # the 300 s x 5 gate
#   modules/mod-dpssim/tools/run-sim.sh FrostDk2hSim 60 60 1 5 100 3 # 3 targets (the pack list; 5, 10)
# Smoke run with the log kept: DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh FrostDk2hSim 60 60 1 1
# Expected log lines: "SimActor created" (the weapon below), "strategies resolved" (combat [frost, frost aoe, ...],
# non-combat [... nc ...]), "actor after the first second" (the Rune of Razorice 53343 and Horn of Winter 57330 up; the
# Strength of the sheet), then the iteration summaries. The report's powerSamples[] (runic power and ready runes every
# 500 ms) is the check for runic power at the cap and for idle runes.
#
# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_DEATH_KNIGHT (SharedDefines.h)
Class = 6

# Talents: the guide's 6.3 "frost obliteration" 60 link (Playerbots.PremadeSpecLink.6.3.60 of
# modules/mod-playerbots/conf/playerbots.conf.dist), decoded against the S2a Frost grid (tab 399;
# apps/dbc-tools/lib/test_deathknight_s2.py GRID): 51 points, legal, nested in the .20 / .30 / .40 / .45 links.
# Frost is the second tab (dashes for the empty Blood and Unholy tabs).
PlayerbotTalents = -132032311332001032221023330010020101

# Unglyphed actor: all glyphs are retired server-wide.
PlayerbotGlyphs = false

# The pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs; default 15000): the Rune of Razorice and Horn of Winter
# are two global cooldowns out of combat, with room to spare
PrePullBuffMs = 20000

# Gear/stats: the balance pass's flat block (the user's in-game Ret paladin of 2026-10-05, as RetPaladinSim.conf: 800
# attack power, 134 crit, 32 haste, 15 mastery, 8 cooldown haste, 25 versatility, 19 proc chance), so the Death Knight
# is measured on the same footing as the other reworked melee profiles. Hit and expertise stay 0: this server gives
# 100% PvE hit and expertise. Only the weapon is worn; its own stats come on top. All ids were checked
# against the live item_template and item_itemization on 2026-10-25 (class 2, AllowableClass -1, ilvl 63-65)
#   Two-hand   12796 Hammer of the Titans         (two-hand mace, 3.8 speed, 143.2-265.9, +30 Str +16 Sta; it has an
#              item_itemization row). The two-hander doubles the auto attack proc chances (Killing Machine, Runic
#              Attenuation) and plays the same lists; the stat weights prefer two one-handers
Gear = 12796

# AttackPower is a flat top-up on top of level / Strength / gear (RetPaladinSim.conf: 368)
SpellPower = 0
AttackPower = 368

CritRating = 134
HasteRating = 32
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 15
VersatilityRating = 25
CooldownHasteRating = 8
ProcChanceRating = 19

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# The Frost rotation is measured by the 300 s x 5 runs, not by stat weights
StatWeightsEnabled = false

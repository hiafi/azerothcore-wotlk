#
# DpsSim profile: RestoShamanHealSim
#
# Healing-sim profile (stage S2b-2 of the Shaman rework; this file is HS5's deliverable, the Resto Shaman profile of the
# healing sim, plan .agents/plans/healing-sim/healing-sim.PLAN.md): a level-60 Orc Shaman that heals a group of headless
# allies while the Sim Raid Boss damages them with real hits. "Mode = Heal" makes SimProfile::Load() send the batch down
# the heal path (SimDaemon::RunHealBatch). Same shape as RestoDruidHealSim.conf / HolyPaladinHealSim.conf, whose headers
# explain the heal keys (HealGroup, HealTargets, pin / drain modes), run-sim.sh's HEALSIM_* overrides and the scoring.
#
# Bot strategy exercised: the reworked Restoration rotation: ShamanReworkRestoStrategy ("shaman/resto",
# data/strategies/shaman/resto.yaml) with "shaman totems" and the "healer dps" strategy. The sim ticks the real
# PlayerbotAI; nothing here steers it.
#
# Race: Orc (run-sim.sh's [race] argument 2).
#
# Talents: Playerbots.PremadeSpecLink.7.2.60 ("resto pve") of the live env/dist/etc/modules/playerbots.conf, 51 points
# in the Restoration tree (S2b-1 report: legal against the built talent grid, .30 in .45 in .60).
#
# Glyphs: PlayerbotGlyphs = true as in every healer profile; the live Playerbots.BotGlyphs = 0 wins, so the actor runs
# unglyphed.
#
# Scenario comparison against HS3 (120 s, level 60, 10 iterations): HEALSIM_GROUP=party|raid10 with
# HEALSIM_TARGETS=pin50 (HEALSIM_INFINITE_MANA=1 for max output, 0 for sustain) or drain:150 / drain:75 (triage), from
# the repo root:
#
#   modules/mod-dpssim/tools/run-sim.sh RestoShamanHealSim 120 60 2 10
#

# CLASS_SHAMAN (SharedDefines.h)
Class = 7

Mode = Heal
HealGroup = party
HealTargets = tank:pin:50, 3*dps:pin:50, self:pin:50

AllyMaxHealth.Tank = 9000
AllyMaxHealth.Dps = 5000
PinMaxHealth = 30000
AllySpreadYards = 10
DrainPulseMs = 1000
InfiniteMana = false

PlayerbotTalents = --3020323121331221321221021101321
PlayerbotGlyphs = true

# Gear/stats (user 2026-11-01, normalized like the DPS profiles): real item level 55-65 blue dungeon gear and no flat
# primary stats. Gear: the "Elemental/Resto Shaman Dungeon Gear" list of docs/.items.md (Hardened Steel Warhammer 20666
# and the Draconian Aegis of the Legion shield 22336 included; no trinkets). This replaces the earlier stand-in of the
# Druid set's flat values. The gear's itemization shapes also add the five custom secondaries, unevenly by armor type;
# the flat ratings below top them up (or trim them, when negative) so the sheet reads the plate set's 32 haste, 15
# mastery, 25 versatility, 8 cooldown haste and 19 proc chance, as in every normalized DPS profile (user 2026-10-31).
# Gear-only values the top-ups correct: haste 4, mastery 6, versatility 0, cooldown haste 26, proc chance 18. Crit is
# whatever the gear gives. No item in the list belongs to an item set. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1)
# prints the resulting character sheet.
# Items, in order: 18807 Helm of Latent Power, 18691 Dark Advisor's Pendant, 14548 Royal Cap Spaulders, 18389 Cloak of
# the Cosmos, 13123 Dreamwalker Armor, 13969 Loomguard Armbraces, 18527 Harmonious Gauntlets, 18676 Sash of the
# Windreaver, 18378 Silvermoon Leggings, 18318 Merciful Greaves, 13001 Maiden's Circle, 18395 Emerald Flame Ring, 20666
# Hardened Steel Warhammer, 22336 Draconian Aegis of the Legion.
# Sheet at creation (level 60, race 2, before talents and buffs): Intellect 244, Spirit 151, Stamina 249, flat spell
# power 204 (healing power 401), crit 30, armor 4453, max health 3733, max mana 4900.
Gear = 18807,18691,14548,18389,13123,13969,18527,18676,18378,18318,13001,18395,20666,22336

SpellPower = 0
AttackPower = 0

CritRating = 0
HasteRating = 28
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 9
VersatilityRating = 25
CooldownHasteRating = -18
ProcChanceRating = 1

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# No stat-weight passes for a healing profile (stat_weights.py is DPS-only)
StatWeightsEnabled = false

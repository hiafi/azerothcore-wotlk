#
# DpsSim profile: CombatRogueSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Shape of SubtletyRogueSim.conf (dual-wield
# melee, the shared flat stat block). Created for the Rogue rework stage S3b (.agents/plans/rogue-rework/
# rogue-rework.S3b-HANDOFF.md, part 1 Part E; part 2 runs it).
#
# Runs the reworked Combat rogue's DPS rotation (mod-playerbots branch feat/rogue-combat-bot-strategy: the "combat"
# strategy, data/strategies/rogue/combat.yaml and combat-pack.yaml, RogueReworkCombatStrategy). Guide:
# docs/reworks/bot-strategy/rogue-combat-bot-guide.md. The talents are the guide's slot 4.2 "combat raid" build (the
# single target build: Hack and Slash 3, Prey on the Weak 3).
#
# RACE: pass 2 (Orc), as ShamanEleSim.conf. run-sim.sh defaults to race 1 (Human), and the sim runs at the race's start
# position: a Human start has an attackable Wild Turkey 17.5 yd away that closes the AoE gates ("enemies within 8 yd"
# counts it), Orc's Valley of Trials has only friendly NPCs nearby. Run at level 60 (60 s x 5 iterations, 100 ms step):
#   modules/mod-dpssim/tools/run-sim.sh CombatRogueSim 60 60 2 5 100 1
# The first smoke run keeps the log (read it before the numbers):
#   DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh CombatRogueSim 60 60 2 1
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); 2+ targets use the elite pack dummies stacked within
# 3 yd. The pack list (Blade Flurry, Blade Rush, Killing Spree hops, Fan of Knives) needs 3+ enemies within 8 yd of the
# bot:
#   modules/mod-dpssim/tools/run-sim.sh CombatRogueSim 60 60 2 5 100 3
#
# Levels below 58 (the weapons below need level 58): copy this profile to a scratch path (give run-sim.sh the path),
# set `Gear = 2092,2092` (two Worn Daggers) and use the guide's `.45` link for a level 45 run or the `.30` link for a
# level 30 run (the .20, .40 and .50 links are in modules/mod-playerbots/conf/playerbots.conf.dist for 20, 40 and 50):
#   modules/mod-dpssim/tools/run-sim.sh <scratch path> 60 45 2 5 100 1
#
# Health-drain variant (Prey on the Weak below 35% health and its crit above 90%): copy this profile to a scratch path
# with `DummyHealthDrain = true` AND `DummyMaxHealth = 30000` (the default dummy never reaches 35% in 60 s: S2b run 6)
# and run it at level 60 on 1 target.
#
# Expected in the run log: "SimActor created" naming both weapons (Heartseeker and Scarlet Kris), "actor after the first
# second" with the sheet, "strategies resolved" listing "combat" among the combat strategies, 51 talent points spent,
# and the poison auras (Instant, Crippling) up at the pull (Stealth is a blind spot, below).
#
# Cannot be simmed (one passive dummy that never dies and never threatens the actor, no party, the dummy stands inside
# 5 yd): the Stealth opener and Ambush (the dummy is in reach at the pull), out-of-reach Pistol Shot / Between the Eyes
# rows, Grappling Hook and Sprint, the opener waiting for the tank, Honor Among Thieves' ally, the "finisher on a
# dying target" exception, Kick's capstone and Cloak of Shadows (the dummy never casts), and the executes (the dummy
# zeroes its damage unless DummyHealthDrain). Stacked dummies pass every "engaged" filter and Killing Spree's hop
# filter trivially.
# 4.2 has no Deft Maneuvers (its Blade Flurry gives no combo points) and no Savage Combat; CombatRoguePackSim.conf (slot
# 4.3) exercises those.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_ROGUE (SharedDefines.h)
Class = 4

# Talents: the guide's slot 4.2 .60 link (docs/reworks/bot-strategy/rogue-combat-bot-guide.md, and
# Playerbots.PremadeSpecLink.4.4.2.60 of modules/mod-playerbots/conf/playerbots.conf.dist), 51 points on the
# rework's Combat grid (tab 181). Combat is the second tab, so the link starts with one dash.
PlayerbotTalents = -323320030100103331311020310220010331

# Unglyphed actor: all rogue glyphs are retired server-wide.
PlayerbotGlyphs = false

# Pre-pull buff phase: 30 s instead of the default 15 s, so the two poison casts (Lethal, Crippling) and Stealth
# land before the pull (the buff phase keeps the nc strategy).
PrePullBuffMs = 30000

# Gear/stats (user 2026-10-31, normalized across every DPS profile): real item level 55-65 blue dungeon gear and no
# flat primary stats. Gear: the "Feral DPS Druid/Rogue Dungeon Gear" list of docs/.items.md (armor and jewelry; no
# trinkets), with Felhide Cap 18325 in place of the druid-only Wolfshead Helm. Weapons: Heartseeker 12783, Scarlet
# Kris 5267, Flightblade Throwing Axe 28972. The gear's itemization shapes also add the five custom secondaries,
# unevenly by armor type; the flat ratings below top them up (or trim them, when negative) so every DPS profile's
# sheet reads the plate set's 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance (user
# 2026-10-31). Crit is whatever the gear gives. A Devilsaur pair's 2-piece bonus is hit rating, which does nothing on
# this server. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
Gear = 18325,15411,12927,13340,14637,12966,15063,13252,15062,12553,13098,17713,12783,5267,28972

SpellPower = 0
AttackPower = 0
CritRating = 0
HasteRating = 7
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = -2
VersatilityRating = 18
CooldownHasteRating = -7
ProcChanceRating = 6
Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Master switch - see ArcaneMageSim.conf's own comment on this key. Off: stat weights for this profile are not set up.
StatWeightsEnabled = false

# CLASS_MAGE (SharedDefines.h). Both FrostMageSim and ArcaneMageSim are this same class - they
# only differ in talents (mage specs are talent trees, not separate classes).
Class = 8

# No verified Arcane build yet for this deployment's custom Arcane tree (confirmed live
# 2026-09-11: the Arcane tab alone carries 20 entries against a stock WotLK Arcane tree's ~16, so
# an old/stock-authored string would misallocate the same way the Frost one did). Left empty
# (untalented) rather than guessing a build - spec the intended Arcane spec on a live bot (whisper
# it "talents apply <link>" iteratively, or use PlayerbotFactory::InitTalentsTree()'s auto-pick),
# then whisper it "talents link" (Ai/Base/Actions/ChangeTalentsAction.cpp's SpecLink()) and paste
# the result here.
PlayerbotTalents =

# No real gear set to point at yet (see PlayerbotTalents' own note above - same situation), so
# this is a synthetic stat baseline instead of real item ids: a round-number level-60 caster
# budget, picked for "a reasonable, testable starting point," not sourced from any specific gear
# list or claimed to be optimal/balanced. Adjust freely once there's a real target to test
# against. Strength/Agility left at 0 (a caster gets nothing from either) - included anyway so all
# five core stats are visible as available knobs. Gear (real item ids) left unset - this profile
# is synthetic-only for now; see FrostMageSim.conf's own comments if you want to switch to real
# items instead of/alongside these.


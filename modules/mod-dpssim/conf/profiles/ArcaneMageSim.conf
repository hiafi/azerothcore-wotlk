# CLASS_MAGE (SharedDefines.h). Both FrostMageSim and ArcaneMageSim are this same class - they
# only differ in talents (mage specs are talent trees, not separate classes).
Class = 8

# The Arcane guide build (docs/reworks/bot-strategy/mage-arcane-strat.md, Mage plan MG8): the
# build-note swap that takes Spell Impact over Focus Magic and Magic Attunement.
# Built against this deployment's reworked trees. The decode against the live talent_dbc was
# checked in the Mage bot plan's Stage C review (2026-10-06): 51 points, every rank and row gate
# legal. This is the same string as AiPlayerbot.PremadeSpecLink.8.0.60 (the bots' premade build).
# Run at level 60, run-sim.sh's default.
PlayerbotTalents = 3330303303000303103312310230131

# The class's premade glyphs (AiPlayerbot.PremadeSpecGlyph for the spec tab), applied as a live random bot
# gets them. true is the default; set false for an unglyphed actor (every run before 2026-10-06).
PlayerbotGlyphs = true

# Gear/stats: the shared level-60 caster baseline every caster profile uses (user, 2026-10-07; taken from real
# gear, like RetPaladinSim.conf's ratings). Character-sheet totals before talents and buffs: 255 Intellect, 144
# Spirit, 398 spell power. Intellect and Spirit below are the gear part only: the target minus the level-60 base
# of a Human mage (player_class_stats + player_race_stats: 125 Intellect, 120 Spirit). Spell power from stats
# is floor(Int / 2) + floor(Spirit / 2) (Unit::SpellBaseDamageBonusDone) = 127 + 72, so the flat SpellPower is 199.
# Run as race 1 (Human); another race changes the base stats.

SpellPower = 199
AttackPower = 0

CritRating = 35
HasteRating = 12
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 17
VersatilityRating = 0
CooldownHasteRating = 13
ProcChanceRating = 13

Strength = 0
Agility = 0
Stamina = 200
Intellect = 130
Spirit = 24

# Master switch (modules/mod-dpssim/tools/stat_weights.py) - false makes that tool refuse to run
# any stat-weight batch at all for this profile, regardless of the individual TestX flags below.
# See SimProfile.h's Profile::StatWeightsEnabled doc comment.
StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py) - true = include this
# stat in that tool's per-point DPS weight pass. Defaulted 2026-09-13 to the stats a caster's DPS
# actually cares about (Intellect/Spirit/SpellPower/CritRating/HasteRating and this deployment's
# four custom rating slots); Strength/Agility/AttackPower are off by default since a caster gets
# nothing from them, Stamina is off since it's a survivability stat, not a DPS one - flip any of
# these if you want that stat weighed anyway. See SimProfile.h's Profile::StatWeightTests doc
# comment for why this C++ module parses these at all despite never reading them itself.
TestStrength = false
TestAgility = false
TestStamina = false
TestIntellect = true
TestSpirit = true
TestSpellPower = true
TestAttackPower = false
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = true

#
# DpsSim profile: ArcaneMageSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when
# DpsSim.Profile points at this file. Format: "Key = Value" lines, "#" comments, blank lines
# ignored. See SimProfile.h's Profile struct for the full field list and what each means.
#

# CLASS_MAGE (SharedDefines.h). Both FrostMageSim and ArcaneMageSim are this same class - they
# only differ in talents (mage specs are talent trees, not separate classes).
Class = 8

# No verified Arcane build yet for this deployment's custom Arcane tree (confirmed live
# 2026-09-11: the Arcane tab alone carries 20 entries against a stock WotLK Arcane tree's ~16, so
# an old/stock-authored string would misallocate the same way the Frost one did). Left empty
# (untalented) rather than guessing a build - spec the intended Arcane spec on a live bot (whisper
# it "talents apply <link>" iteratively, or use PlayerbotFactory::InitTalentsTree()'s auto-pick),
# then whisper it "talents link" (Ai/Base/Actions/ChangeTalentsAction.cpp's SpecLink()) and paste
# the result here.
PlayerbotTalents = 3130303303000303103332310230131

# No real gear set to point at yet (see PlayerbotTalents' own note above - same situation), so
# this is a synthetic stat baseline instead of real item ids: a round-number level-60 caster
# budget, picked for "a reasonable, testable starting point," not sourced from any specific gear
# list or claimed to be optimal/balanced. Adjust freely once there's a real target to test
# against. Strength/Agility left at 0 (a caster gets nothing from either) - included anyway so all
# five core stats are visible as available knobs. Gear (real item ids) left unset - this profile
# is synthetic-only for now; see FrostMageSim.conf's own comments if you want to switch to real
# items instead of/alongside these.

SpellPower = 500
AttackPower = 0

CritRating = 91
HasteRating = 60
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 0
VersatilityRating = 0
CooldownHasteRating = 0
ProcChanceRating = 0

Strength = 0
Agility = 0
Stamina = 200
Intellect = 350
Spirit = 150

# Master switch (modules/mod-dpssim/tools/stat_weights.py) - false makes that tool refuse to run
# any stat-weight batch at all for this profile, regardless of the individual TestX flags below.
# See SimProfile.h's Profile::StatWeightsEnabled doc comment.
StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py) - true = include this
# stat in that tool's per-point DPS weight pass. Defaulted 2026-09-13 to the stats a caster's DPS
# actually cares about (Intellect/Spirit/SpellPower/CritRating/HasteRating and this deployment's
# four custom rating slots); Strength/Agility/AttackPower are off by default since a caster gets
# nothing from them, Stamina is off since it's a survivability stat, not a DPS one - flip any of
# these if you want that stat weighed anyway. See SimProfile.h's Profile::StatWeightTests doc
# comment for why this C++ module parses these at all despite never reading them itself.
TestStrength = false
TestAgility = false
TestStamina = false
TestIntellect = true
TestSpirit = true
TestSpellPower = true
TestAttackPower = false
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = true

#
# DpsSim profile: FuryWarriorSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this file.
# Format: "Key = Value" lines, "#" comments, blank lines ignored. Shape of ArmsWarriorSim.conf and
# WarriorRage2HStartSim.conf. Warrior rework stage S3 (Fury), D43 / D46 in .agents/plans/warrior-rework/warrior-
# rework.S3-HANDOFF.md.
#
# PURPOSE: the reworked Fury rotation on the RAID build with Titan's Grip (bot slot 1.3 "fury raid"), single target:
# mod-playerbots data/strategies/warrior/fury.yaml with the Fury Rework/ C++ shells; guide bot-strategy/warrior-fury-
# bot-guide.md. A ROTATION-SANITY sim: no DPS target here (balance belongs to stage M), the numbers are a baseline.
# Run it at 1 target; at 2 targets the Cleave swaps open (Heroic Strike -> Cleave, Bloodsurge -> Cleave); 3+ targets
# turn the dummies into an elite pack (see FuryWarriorPackSim.conf for the pack build).
#
# RUN (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets]; the user default is
# 60 s x 5 iterations at a 100 ms step, level 60, race 2 = Orc: a Human start has an attackable Wild Turkey 17.5 yd
# away that changes "enemies within 8 yd" counts, so every Fury run uses Orc and the baselines compare):
#
#  DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh FuryWarriorSim 60 60 2 5 100 1
#  DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh FuryWarriorSim 60 60 2 5 100 2
# Check the realm flag after the sims (sims set realmlist.flag=1; builds older than the Main.cpp gate need `flag &
# ~1`). The sim reads the live world DB and runs the live image: generate + db-import and the image rebuild must be
# live before any Fury sim. The first smoke run keeps ONE iteration only (read the log before the numbers):
#
#  DPSSIM_KEEP_LOG=1 DPSSIM_BOT_LOG=1 modules/mod-dpssim/tools/run-sim.sh FuryWarriorSim 60 60 2 1 100 1
# Like-for-like single ELITE dummy: prefix DPSSIM_TARGET_RANK=elite.
#
# WHAT TO READ: GCD presses per minute and gaps (casts[]); Bloodthirst (10 a minute, delayed past one GCD on <= 10% of
# casts), Rampage (4-5.5, no gap > 15 s), Whirlwind, Slam (free + paid), Heroic Strike counts; Enrage aura uptime
# (204636) and meter fills (204635 stacks resetting; paid rage / 190 per minute); Death Wish and Recklessness windows
# (12292, 1719 charges, one per Rampage); Blood Rush (204637) and Bloodsurge (204652) applications against the 40% /
# 30% roll chance and their consumption (free Rampages and free Slams are casts with powerCost 0); Flurry (12966-8)
# after crits; the Titan's Grip marker (204651) up the whole fight. Rage: gained and spent per minute (powerSamples +
# casts[].powerCost), seconds at the rage cap, starvation seconds (Rampage ready, not free, rage < 60). Compare with
# rage_sweep.py's FURY BUDGET (D46: income 512 / 557, spend 550 / 650 per minute; print it with `python3 -I
# modules/mod-dpssim/tools/rage_sweep.py` once any sweep report exists, or read FURY_SPEND_13). OFF-HAND white swings
# are the pseudo spell id 0xFFFF0001 (4294901761) in hits[] and spells[] (modules/mod-dpssim/README.md); main-hand
# white swings stay spell id 0. With Titan's Grip the second two-hander is an off-hand swing too.
# With DPSSIM_BOT_LOG=1 count the `A:fury <action> - FAILED` lines (real) against `IMPOSSIBLE` (rage or cooldown,
# normal); the IMPOSSIBLE rows of free-cast actions while their aura is up should be 0.
#
# Aura samples (AuraSampleIds, sampled every step for the actor, plus this actor's aura on target 0; they fill the
# report's auraSamples[] {ts, spellId, onTarget, stacks, remainingMs}: stack counts and refreshes over time, which
# auraEvents (first apply / removal only) cannot give):
#  204635 Enrage meter (19 stacks, one per 10 rage paid; the stack count resetting is a meter fill)
#  204636 Enrage (the buff; a refresh while up shows as remainingMs jumping up)
#  12292 Death Wish, 1719 Recklessness (stacks = charges, one per Rampage), 2458 Berserker Stance
#  204637 Blood Rush free Rampage, 204652 Bloodsurge (free Slam / Cleave), 204638 Deathmaker (Execute usable)
#  12966 / 12967 / 12968 Flurry buff ranks 1 / 2 / 3, 204651 Titan's Grip penalty (D31; 49152 is forced to 0)
#  204642 Cadence (Quick Execution), 204643 Will of the Berserker crit, 204644 / 204645 / 204646 Shredding Blows buff
#  ranks 1 / 2 / 3, 204641 Improved Execute crit stack, 23885 Bloodthirst heal buff.
# A buff the build does not own (its talent is not bought) simply never shows.
#
# TALENTS: the 1.3 .60 link (warrior-fury-bot-guide.md "Talent strings"; Playerbots.PremadeSpecLink.1.3.60), 51 points
# on the 31-talent Fury grid (docs/reworks/warrior-fury-rework.md section 4). Digits run in (row, column) order, empty
# cells skipped. Proved legal (rank <= max, 5 points in the rows above per row).
# Decoded:
#  Armored to the Teeth 2, Cruelty 3, Merciless 3, Frenzied Blows 2, Unbridled Wrath 2, Bloodthirst 1, Commanding
#    Presence 2, Dual Wield Specialization 5, Improved Execute 2, Enrage 5, Death Wish 1, Improved Bloodthirst 2,
#    Flurry 3, Unshackled Fury 3, Improved Berserker Stance 5, Rampage 1, Bloodsurge 3, Blood Rush 2, Unending Fury 3,
#    Titan's Grip 1.
# Not bought:
#  Dance of Death, Improved Cleave, Blood Craze, Quick Execution, Fresh Meat, Piercing Howl, Intensify Rage, Improved
#    Whirlwind, Deathmaker, Shredding Blows, Will of the Berserker.
#
# Gear (D43): TWO copies of 19200 "3600 Test 2h Axe 63 blue" (2H axe 155-233, 3.6 speed, required level 58, item level
# 63, no proc; a test item in item_template, maxcount 0 so it equips in both hands). Titan's Grip lets the off hand
# hold a two-hander at -10% damage on both hands (penalty aura 204651; stock 49152 is forced to 0). The same axe as
# the Arms profiles; keep the weapon identical across FuryWarriorSim and FuryWarriorPackSim.
#
# BLIND SPOTS (the sim cannot show these; report "not observed", do not file them as bugs):
#  - the dummy never attacks: no rage from damage taken, no Enraged Regeneration, no Berserker Rage trigger, no
#    Victory Rush (it needs a kill);
#  - the dummy never casts: Pummel and interrupt rows stay dead (Intensify Rage's capstone is blind);
#  - the dummy stands within 3 yd of the pull: Charge and Heroic Leap have an 8 yd minimum range, so those rows are
#    dead (no in-combat Charge rage);
#  - one passive dummy: no tank-engaged timing, "few rallied" is true so Skull Banner always fires on a boss;
#    boss(target) is true only on 1-target runs, elite(target) on 2+;
#  - Dance of Death needs a kill and the sim has no kill (the drain run never kills the dummy: it stays at 1 health);
#  - Execute and the Execute phase rows need the dummy under 35% / 20% health: use the health-drain variant
#    (FuryWarriorCoverDrainSim.conf);
#  - the damage numbers are an estimate gear set (below), not a captured sheet; this is a ROTATION-SANITY sim, no DPS
#    target (balance belongs to stage M).
#
# SCRATCH COPIES made by the harness by path (copy this file, change the lines named, run the copy; nothing else
# differs):
#  1.3 .60 + drain (the guide's execute list on the raid build): add `DummyHealthDrain = true` and `DummyMaxHealth =
#    30000` at the end.
#  level 45 (no Rampage yet; run with level argument 45): PlayerbotTalents = -203302210252501020303 (36 points, the
#    1.3 .45 link), Gear = 15227,15227 (Diamond-Tip Bludgeon, 1H mace 49-91, 2.4, required level 44, no proc, either
#    hand).
#  level 30 (no Whirlwind / Execute extras; level argument 30): PlayerbotTalents = -203302210200501 (21 points, the
#    1.3 .30 link), Gear = 7687,3850 (Ironspine's Fist mace 2.4 + Jade Serpentblade sword 2.6, required level 30).
#  The level 45 / 30 stat block is NOT scaled: lower HasteRating / CritRating / Strength by hand if the numbers
#    matter; they are rotation-priority runs.
#
# The one-hander dual-wield twin without Titan's Grip is FuryWarriorDwSim.conf (different link and weapons).


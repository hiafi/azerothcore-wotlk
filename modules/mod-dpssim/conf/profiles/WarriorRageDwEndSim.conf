#
# DpsSim profile: WarriorRageDwEndSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for
# the full field list.
#
# RAGE SWEEP profile (warrior rework W0a, D15/D17: .agents/plans/warrior-rework/warrior-rework.W0a-HANDOFF.md).
# One of four: WarriorRage2HStartSim / WarriorRage2HEndSim / WarriorRageDwStartSim / WarriorRageDwEndSim. They exist
# to measure white-swing damage per hit and per second at the START and END of the level-60 gear bracket, for a
# two-hander and for a dual wielder; modules/mod-dpssim/tools/rage_sweep.py turns those reports into rage per
# second under the stock and the dampened rage formulas and solves the level-60 constants k and m. White damage per
# swing does not depend on k and m, so the four profiles are run ONCE, on the deployed build (any k and m in it):
# this is a ROTATION-AGNOSTIC measurement, not a DPS target and not a balance reference. Only the white
# swings (spell id 0 in the report's hits) are read; the bot's rotation, rage spending and talents do not matter for
# the result, so none of the Arms/Fury balance work is implied by these numbers. (Warrior rage now scales 1:1 with
# SPELL haste, W0b D21; the profile's HasteRating counts as spell haste in rage_sweep.py. WarriorRage2HStartHasteSim is
# the fifth profile, the Start two-hander plus a haste top-up, for the hasted / unhasted check.)
#
# Run (60 s x 5 iterations, 100 ms step, level 60, Human = race 1; RACE comes from the run-sim.sh arguments):
#   modules/mod-dpssim/tools/run-sim.sh WarriorRageDwEndSim 60 60 1 5
#   (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets])
# Then, once all four have run (the sweep finds the newest report of each profile in reports/ by itself):
#   python3 -I modules/mod-dpssim/tools/rage_sweep.py
# Check the realm flag after the sims (memory "DPS sims hide the live realm": older builds need `flag & ~1`).
#
# BRACKET: END of the level-60 gear band, DUAL WIELD (Fury-style, one Fury point). Berserker Stance (see
# WarriorRageDwStartSim.conf Talents).
#
# Gear (D17): two real AQ-tier epic one-handers, 2.6 s main hand reference.
#   Main hand  Sand Polished Hammer (21715): one-hand mace, 97.3-180.7 (avg 139), 2.6 speed, +14 Critical Strike rating,
#              +13 Stamina, required level 60, item level 72, drops from Ossirian the Unscarred (Ruins of Ahn'Qiraj).
#   Off hand   Ancient Qiraji Ripper (21650): one-hand sword, 114.4-212.5 (avg 163.5), 2.8 speed, +15 Critical Strike
#              rating, +14 Stamina, required level 60, item level 77, drops from Fankriss the Unyielding (Temple of
#              Ahn'Qiraj). The AQ40 one-hand pool has no second 2.6 s weapon that is not a Naxxramas item, so the off
#              hand is 2.8 s (the sweep measures each hand's real swing time anyway).
#   Both weapons' own Critical Strike rating comes on top of the rating block below.
#
# ESTIMATES (nothing here is a captured character sheet; the "SimActor created" log line gives the real melee attack
# power - compare it with the AP total below and rerun rage_sweep.py with it in mind). Base Strength about 120, base
# attack power = 3 * 60 + 2 * 120 - 20 = 400 (see the START profiles).
#   Strength 190      : an AQ40-tier epic set (ilvl 77-84; Naxxramas is level 80 only on this server, memory raid
#                       progression rulings): the same ten Strength slots at about +19 each, about 1.7x the blues.
#   AttackPower 140   : flat top-up for equip attack power, enchants and the set bonus of that tier.
#   Total attack power 400 + 2 * 190 + 140 = 920 before talents and buffs.
#   Ratings (crit 210, haste 44, mastery 30, versatility 62, cooldown haste 10, proc chance 26): twice the START block
#   (rating budgets roughly double between ilvl 60 and ilvl 80 gear); hit and expertise stay 0.
#
# Expected white hits: main hand avg 139 + 920 / 14 * 2.6 = 139 + 170.9 = 309.9 pre-armor, x 0.575 = about 178;
# off hand 163.5 + 920 / 14 * 2.8 = 347.5, x 0.5 (off-hand penalty) x 0.575 = about 100.

# Pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs) - absent here, so the default of 15000 sim ms applies
# (the bot settles into its stance and buffs unrecorded, then pulls).

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08. Level-60 attacker vs
# 4,350 armor: reduction = 4350 / (4350 + 467.5 * 60 - 22167.5) = 4350 / 10232.5 = 42.5%, so every pre-armor figure
# below is multiplied by 0.575.
TargetArmor = 4350

# CLASS_WARRIOR (SharedDefines.h)
Class = 1

# Talents: ONE point in Booming Voice (the second Fury talent in row/column order, Fury is the second tab), nothing
# else. Why not untalented: an untalented warrior resolves to tab 0 = Arms = the "arms" strategy = Battle Stance
# (see WarriorRage2HStartSim.conf). The dual wielder must hold BERSERKER STANCE (no +10% rage), which only the "fury"
# strategy asks for (FuryWarriorStrategy: trigger "berserker stance" at ACTION_HIGH + 9), and AiFactory::
# GetPlayerSpecTab() picks Fury as soon as it holds more points than Arms (`PlayerbotAIConfig::ParseTempTalentsOrder`
# sorts a tab's talents by row then column: Armored to the Teeth (row 0, col 0) is index 0, Booming Voice (row 0, col 1)
# is index 1, so "-01" puts 1 point on Booming Voice). Booming Voice only widens Battle Shout/Commanding Shout
# radius: it changes no swing, crit, haste or damage, so the white swings stay talent-free. (The live stock "fury pve"
# link -305053000500310053120501351 would also work but adds Dual Wield Specialization, Flurry, Cruelty, ... to the
# white-swing data. The fury strategy is only chosen while the bot knows Whirlwind, a trainer spell that
# SimBot::Create()'s InitAvailableSpells() teaches; confirm "strategies resolved: combat [fury ...]" in the run log.)
# rage_sweep.py treats this profile as Berserker Stance (no stance bonus).
PlayerbotTalents = -01

# Unglyphed actor: all warrior glyphs are retired server-wide.
PlayerbotGlyphs = false

# Gear: the two weapons only.
Gear = 21715,21650

SpellPower = 0
AttackPower = 140

CritRating = 210
HasteRating = 44
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 30
VersatilityRating = 62
CooldownHasteRating = 10
ProcChanceRating = 26

Strength = 190
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Rage sweep profiles are not stat-weight targets.
StatWeightsEnabled = false

#
# DpsSim profile: NoHealerHealSim  --  heal-mode harness test (stage HS1)
#
# A healer that cannot heal: an untalented Warrior bot as "the healer". It heals nobody, so every target takes the
# damage
# drivers' hits with no healing at all. For the heal-mode known-value checks (plan HS1 checks 1 and 2, HS3 tests):
#   - a drain target takes exactly DrainPulseMs-spaced hits of X and dies at max health / X;
#   - a pinned target that is never healed never takes a Pin Hit and stays exactly at its pin.
# Not a balance profile. The Warrior bot may attack the boss; that does not touch the checks.
#
# Mode = Heal: see HolyPriestHealSim.conf for the heal keys.

# CLASS_WARRIOR (SharedDefines.h)
Class = 1

Mode = Heal
HealGroup = party
HealTargets = tank:drain:300, 3*dps:pin:50, self:pin:50

AllyMaxHealth.Tank = 9000
AllyMaxHealth.Dps = 5000
# Every PINNED target (the healer's slot included) gets this max health instead: a huge pool cannot be filled by the heals
# that land between two pin hits, so a pinned target has no overheal. The AllyMaxHealth values above then apply to drain
# targets only. Heals and shields that scale with max health scale with it.
PinMaxHealth = 1000000
AllySpreadYards = 10
DrainPulseMs = 1000

# Nothing to buff, so no pre-pull phase: also exercises the no-buff-phase pull
PrePullBuffMs = 0

PlayerbotGlyphs = false
StatWeightsEnabled = false

#
# DpsSim profile: WarriorRage2HStartSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for
# the full field list.
#
# RAGE SWEEP profile (warrior rework W0a, D15/D17: .agents/plans/warrior-rework/warrior-rework.W0a-HANDOFF.md).
# One of four: WarriorRage2HStartSim / WarriorRage2HEndSim / WarriorRageDwStartSim / WarriorRageDwEndSim. They exist
# to measure white-swing damage per hit and per second at the START and END of the level-60 gear bracket, for a
# two-hander and for a dual wielder; modules/mod-dpssim/tools/rage_sweep.py turns those reports into rage per
# second under the stock and the dampened rage formulas and solves the level-60 constants k and m. White damage per
# swing does not depend on k and m, so the four profiles are run ONCE, on the deployed build (any k and m in it):
# this is a ROTATION-AGNOSTIC measurement, not a DPS target and not a balance reference. Only the white
# swings (spell id 0 in the report's hits) are read; the bot's rotation, rage spending and talents do not matter for
# the result, so none of the Arms/Fury balance work is implied by these numbers. (Warrior rage now scales 1:1 with
# SPELL haste, W0b D21; the profile's HasteRating counts as spell haste in rage_sweep.py. WarriorRage2HStartHasteSim is
# the fifth profile, the Start two-hander plus a haste top-up, for the hasted / unhasted check.)
#
# Run (60 s x 5 iterations, 100 ms step, level 60, Human = race 1; RACE comes from the run-sim.sh arguments):
#   modules/mod-dpssim/tools/run-sim.sh WarriorRage2HStartSim 60 60 1 5
#   (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets])
# Then, once all four have run (the sweep finds the newest report of each profile in reports/ by itself):
#   python3 -I modules/mod-dpssim/tools/rage_sweep.py
# Check the realm flag after the sims (memory "DPS sims hide the live realm": older builds need `flag & ~1`).
#
# BRACKET: START of the level-60 gear band, TWO-HANDER (Arms-style, untalented). Battle Stance (see Talents).
#
# Gear (D17): one real level-60 pre-raid dungeon blue two-hander, ~3.6 s reference speed.
#   Seeping Willow (12969): two-handed mace, 155-233 (avg 194), 3.6 speed, required level 58, item level 63, no stats,
#   drops from The Beast (Upper Blackrock Spire). Two-Handed Maces: SimActor::Create() grants the weapon skill at the
#   level cap before equipping, so no trainer or race restriction matters.
#
# ESTIMATES (nothing here is a captured character sheet; the "SimActor created" log line gives the real melee attack
# power - compare it with the AP total below and rerun rage_sweep.py with it in mind). Level-60 Human warrior base
# Strength is about 120 (player_class_stats + player_race_stats; the same figure ProtWarriorSim.conf uses), so base
# attack power = 3 * 60 + 2 * 120 - 20 = 400.
#   Strength 110      : a pre-raid dungeon blue set (ilvl 58-63, Stratholme / UBRS / Scholomance / DM level): about ten
#                       armor and jewelry slots carrying roughly +11 Strength each (head, shoulders, chest, legs, hands,
#                       waist, wrists, feet, back, one ring); neck, other ring and trinket carry no Strength.
#   AttackPower 40    : flat top-up for the few +attack power equip effects and enchants of that set.
#   Total attack power 400 + 2 * 110 + 40 = 660 before talents and buffs.
#   Ratings (crit 105, haste 22, mastery 15, versatility 31, cooldown haste 5, proc chance 13): the user's captured
#   level-60 dungeon-gear block (FeralCatSim.conf, 2026-10-22), re-used as is for the same item-level band; hit and
#   expertise stay 0 (100% PvE hit and expertise on this server).
#
# Expected white hit (sanity check against the sim's "SimActor created" line): weapon avg 194 + 660 / 14 * 3.6 s =
# 194 + 169.7 = 363.7 pre-armor, x 0.575 = about 209 per non-crit hit, one hit per 3.6 s (hasted 22 rating ~ a few
# percent faster).

# Pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs) - absent here, so the default of 15000 sim ms applies
# (the bot settles into its stance and buffs unrecorded, then pulls).

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08. Level-60 attacker vs
# 4,350 armor: reduction = 4350 / (4350 + 467.5 * 60 - 22167.5) = 4350 / 10232.5 = 42.5%, so every pre-armor figure
# below is multiplied by 0.575.
TargetArmor = 4350

# CLASS_WARRIOR (SharedDefines.h)
Class = 1

# Talents: NONE. SimProfile::Load() leaves PlayerbotTalents empty ("Empty = no talents spent", SimProfile.h) and
# SimBot::Create() then spends nothing (`if (!playerbotTalents.empty())`, SimBot.cpp). With zero points
# AiFactory::GetPlayerSpecTab() returns tab 0 (Arms) for a warrior, so the bot runs the "arms" strategy
# (AiFactory.cpp: `tab == WARRIOR_TAB_ARMS || !HasSpell(SPELL_WHIRLWIND)`), whose ArmsWarriorStrategy has the trigger
# "battle stance" at ACTION_HIGH + 10: the bot HOLDS BATTLE STANCE (the +10% auto-attack rage stance). SimActor does not
# pick a stance itself; the strategy does. rage_sweep.py therefore applies the Battle Stance x1.10 to this profile.
PlayerbotTalents =

# Unglyphed actor: all warrior glyphs are retired server-wide.
PlayerbotGlyphs = false

# Gear: the weapon only (rating and Strength top-up below stand in for the rest of the set, as ProtWarriorSim does).
Gear = 12969

SpellPower = 0
AttackPower = 40

CritRating = 105
HasteRating = 22
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 15
VersatilityRating = 31
CooldownHasteRating = 5
ProcChanceRating = 13

Strength = 110
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Rage sweep profiles are not stat-weight targets.
StatWeightsEnabled = false

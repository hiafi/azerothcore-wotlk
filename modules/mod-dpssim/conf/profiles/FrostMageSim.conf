#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. Exercises Frozen Orb from 2 targets; Blizzard, Cone of Cold and Frost Nova
#   from 3.
#   modules/mod-dpssim/tools/run-sim.sh FrostMageSim 180 60 8 5 100 3
# The Human start's Wild Turkey keeps the AoE safety gates closed, so run multi-target at race 8 (Troll); the sim's
#   one-time "stray unit" warning flags this.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_MAGE (SharedDefines.h). Both FrostMageSim and ArcaneMageSim are this same class - they
# only differ in talents (mage specs are talent trees, not separate classes).
Class = 8

# The Frost guide build (docs/reworks/bot-strategy/mage-frost-strat.md, Mage plan MG8).
# Built against this deployment's reworked trees. The decode against the live talent_dbc was
# checked in the Mage bot plan's Stage C review (2026-10-06): 51 points, every rank and row gate
# legal. This is the same string as Playerbots.PremadeSpecLink.8.2.60 (the bots' premade build).
# Run at level 60, run-sim.sh's default.
PlayerbotTalents = --3203013301202330310030131231331

# The class's premade glyphs (Playerbots.PremadeSpecGlyph for the spec tab), applied as a live random bot
# gets them. true is the default; set false for an unglyphed actor (every run before 2026-10-06).
PlayerbotGlyphs = true


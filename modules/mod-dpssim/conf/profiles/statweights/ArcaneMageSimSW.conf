# Stat-weight variant of ArcaneMageSim.conf (bot-stat-weights, 2026-11-10): identical except the synthetic secondary
# ratings, set so gear + synthetic is about equal across the spec's throughput secondaries (CritRating, HasteRating,
# MasteryRating, VersatilityRating, CooldownHasteRating, ProcChanceRating) with the same total (126). Generated; do
# not hand-edit.
# Before -> after totals:
#   CritRating 22 -> 21, HasteRating 43 -> 21, MasteryRating 10 -> 21, VersatilityRating 38 -> 21, CooldownHasteRating
#   -5 -> 21, ProcChanceRating 18 -> 21
#
#
# DpsSim profile: ArcaneMageSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when
# DpsSim.Profile points at this file. Format: "Key = Value" lines, "#" comments, blank lines
# ignored. See SimProfile.h's Profile struct for the full field list and what each means.
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. Exercises Arcane Overload and Arcane Barrage from 2 targets; Arcane
#   Explosion from 5.
#   modules/mod-dpssim/tools/run-sim.sh ArcaneMageSim 180 60 8 5 100 3
# The Human start's Wild Turkey keeps the AoE safety gates closed, so run multi-target at race 8 (Troll); the sim's
#   one-time "stray unit" warning flags this.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_MAGE (SharedDefines.h). Both FrostMageSim and ArcaneMageSim are this same class - they
# only differ in talents (mage specs are talent trees, not separate classes).
Class = 8

# The Arcane guide build (docs/reworks/bot-strategy/mage-arcane-strat.md, Mage plan MG8): the
# build-note swap that takes Spell Impact over Focus Magic and Magic Attunement.
# Built against this deployment's reworked trees. The decode against the live talent_dbc was
# checked in the Mage bot plan's Stage C review (2026-10-06): 51 points, every rank and row gate
# legal. This is the same string as Playerbots.PremadeSpecLink.8.0.60 (the bots' premade build).
# Run at level 60, run-sim.sh's default.
PlayerbotTalents = 3330303303000303103312310230131

# The class's premade glyphs (Playerbots.PremadeSpecGlyph for the spec tab), applied as a live random bot
# gets them. true is the default; set false for an unglyphed actor (every run before 2026-10-06).
PlayerbotGlyphs = true

# Gear/stats (user 2026-10-31, normalized across every DPS profile): real item level 55-65 blue dungeon gear and no
# flat primary stats. Gear: the "Mage/Warlock Dungeon Gear" list of docs/.items.md (weapons, wand and off-hand
# included; no trinkets). The gear's itemization shapes also add the five custom secondaries, unevenly by armor type;
# the flat ratings below top them up (or trim them, when negative) so every DPS profile's sheet reads the plate set's
# 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance (user 2026-10-31). Crit is whatever the
# gear gives. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
Gear = 22267,18691,11624,13386,14136,18497,13253,13956,13170,18507,12545,13001,13964,10796,13396

SpellPower = 0
AttackPower = 0

CritRating = -1
HasteRating = -2
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 9
VersatilityRating = 8
CooldownHasteRating = 21
ProcChanceRating = 9

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Master switch (modules/mod-dpssim/tools/stat_weights.py) - false makes that tool refuse to run
# any stat-weight batch at all for this profile, regardless of the individual TestX flags below.
# See SimProfile.h's Profile::StatWeightsEnabled doc comment.
StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py) - true = include this
# stat in that tool's per-point DPS weight pass. Defaulted 2026-09-13 to the stats a caster's DPS
# actually cares about (Intellect/Spirit/SpellPower/CritRating/HasteRating and this deployment's
# four custom rating slots); Strength/Agility/AttackPower are off by default since a caster gets
# nothing from them, Stamina is off since it's a survivability stat, not a DPS one - flip any of
# these if you want that stat weighed anyway. See SimProfile.h's Profile::StatWeightTests doc
# comment for why this C++ module parses these at all despite never reading them itself.
TestStrength = false
TestAgility = false
TestStamina = false
TestIntellect = true
TestSpirit = true
TestSpellPower = true
TestAttackPower = false
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = true

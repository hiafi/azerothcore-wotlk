# Stat-weight variant of BloodDkTankSim.conf (bot-stat-weights, 2026-11-10): identical except the synthetic secondary
# ratings, set so gear + synthetic is about equal across the spec's throughput secondaries (CritRating, HasteRating,
# MasteryRating, VersatilityRating, CooldownHasteRating, ProcChanceRating, ArmorPenetrationRating) with the same total
# (157). Generated; do not hand-edit.
# Before -> after totals:
#   CritRating 21 -> 25, HasteRating 41 -> 22, MasteryRating 41 -> 22, VersatilityRating 16 -> 22, CooldownHasteRating
#   2 -> 22, ProcChanceRating 36 -> 22, ArmorPenetrationRating 0 -> 22
#
#
# DpsSim profile: BloodDkTankSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the Death Knight rework S1b-1
# (.agents/plans/death-knight-rework/death-knight-rework.S1b-HANDOFF.md, part C; shape of EnhShamanTankSim.conf): the
# tank-sim profile of the Blood Death Knight tank, the 6.0 "blood tank" build (flat mitigation and Crimson Communion).
#
# Tank-sim profile (plan .agents/plans/tank-sim/tank-sim.PLAN.md): "Mode = Tank" sends the batch down the tank path
# (SimDaemon::RunTankBatch): the DPS sim with every dummy auto-attacking the actor. See ProtWarriorTankSim.conf for the
# scenarios (TankScenario dps / survive, TANKSIM_SCENARIO per run), the boss (1 target) and pack (2-10) numbers, and the
# run commands. Bot strategy exercised: the reworked Blood tank rotation (DeathKnightReworkBloodStrategy,
# data/strategies/dk/blood.yaml and blood-pack.yaml, the creator names "blood" / "tank"; the nc rows of dk/nc-blood
# put Blood Presence, the Rune of Exsanguination and Horn of Winter up in the pre-pull buff phase). The log's
# "strategies resolved" line shows the Blood strategy and "tank assist" / "tank face"; ai::dk_rework::IsTankBuild holds
# for a Blood bot of level 10 and up.
#
# RACE: pass 1 (Human) on the command line, level 60:
#   modules/mod-dpssim/tools/run-sim.sh BloodDkTankSim 60 60 1 5                             # dps, boss
#   TANKSIM_SCENARIO=survive modules/mod-dpssim/tools/run-sim.sh BloodDkTankSim 60 60 1 5    # survive, boss
#   modules/mod-dpssim/tools/run-sim.sh BloodDkTankSim 60 60 1 5 100 3                       # dps, 3-pack (also 5)
# Smoke run with the log kept: DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh BloodDkTankSim 60 60 1 1
# Expected log lines: "SimActor created" (the gear below, one per slot), "actor after the first second" (Blood Presence
# 48266 and the Rune of Exsanguination 203040 up; the sheet's armor, Strength, Stamina), then the "tank iteration"
# summaries.
#
Mode = Tank

# dps: health refilled after every step, never dies. survive: no refill, the run ends at the death (TTD).
TankScenario = dps
# The boss (1 target), before armor and the victim's damage-taken modifiers; each pack dummy (2+ targets).
TankHitDamage = 2250-2750
TankPackHitDamage = 500-600
TankSwingMs = 2000
TankDummyCrit = true

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_DEATH_KNIGHT (SharedDefines.h)
Class = 6

# Talents: the guide's 6.0 "blood tank" 60 link (docs/reworks/bot-strategy/death-knight-blood-bot-guide.md, and
# Playerbots.PremadeSpecLink.6.0.60 of modules/mod-playerbots/conf/playerbots.conf.dist), decoded against the S1 Blood
# grid (tab 398; apps/dbc-tools/lib/test_deathknight_s1.py GRID): 51 points, legal, nested in the .30 and .45 links.
# Butchery 2, Subversion 3, Blade Barrier 3, Scent of Blood 3, Two-Handed Weapon Specialization 2, Marrowrend, Dark
# Conviction 2, Thick Blood 3, Vendetta 3, Bloody Strikes 3, Gorefiend's Grasp, Veteran of the Third War 3, Bloody
# Vengeance 3, Crimson Scourge 3, Dancing Rune Weapon, Voracious 2, Crimson Communion, Improved Death Strike 2, Blood
# Nova, Will of the Necropolis 3, Vampiric Blood, Blood Gorged 3, Purgatory, Bonestorm.
PlayerbotTalents = 233003212303313003030121201310311

# Unglyphed actor: all glyphs are retired server-wide.
PlayerbotGlyphs = false

# The pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs; default 15000): Blood Presence, the rune and Horn of
# Winter are three global cooldowns out of combat, with room to spare
PrePullBuffMs = 20000

# Gear/stats (user 2026-11-01, normalized like the DPS profiles): real item level 55-65 blue dungeon gear and no flat
# primary stats. Gear: the "Protection Paladin/Warrior Tank Dungeon Gear" list of docs/.items.md (the 11 armor and
# jewelry pieces; no trinkets). Weapon: Arcanite Reaper 12784 (two-hander; the Death Knight tank rotation is built on
# it) instead of the list's one-hand mace and shield. The gear's itemization shapes also add the five custom
# secondaries, unevenly by armor type; the flat ratings below top them up (or trim them, when negative) so the sheet
# reads the plate set's 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance, as in every
# normalized DPS profile (user 2026-10-31). Gear-only values the top-ups correct: haste 21, mastery 6, versatility 9,
# cooldown haste 6, proc chance 0. Crit is whatever the gear gives. Set bonus: seven Battlegear of Valor pieces (itemset
# 189; the helm 16731 is not in the list) are worn, so the server grants the 2-piece (+200 armor, spell 29092), the
# 4-piece (+40 attack power, spell 30770) and the 6-piece (Warrior's Resolve, a chance on melee hit to heal, spell
# 27419) bonuses; the 8-piece (+8 all resistances) is out of reach. The sheet's armor shows the +200. The list is kept
# as the user wrote it. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
# Items, in order: 12640 Lionheart Helm, 21792 Necklace of the Diamond Tower, 16733 Spaulders of Valor, 18495 Redoubt
# Cloak, 16730 Breastplate of Valor, 16735 Bracers of Valor, 16737 Gauntlets of Valor, 16736 Belt of Valor, 16732
# Legplates of Valor, 16734 Boots of Valor, 22680 Band of Resolution, 12784 Arcanite Reaper.
# Sheet at creation (level 60, race 1, before talents, stance and buffs): Strength 261, Agility 80, Stamina 251,
# Intellect 46, armor 4147, crit 37, max health 4019.
Gear = 12640,21792,16733,18495,16730,16735,16737,16736,16732,16734,22680,12784

SpellPower = 0
AttackPower = 0

CritRating = 4
HasteRating = -8
ExpertiseRating = 0
ArmorPenetrationRating = 22
MasteryRating = -10
VersatilityRating = 22
CooldownHasteRating = 22
ProcChanceRating = 5

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Tank stat weights are stage TS4 (against TTD and net DTPS), not this DPS tool
StatWeightsEnabled = false

# Stat-weight variant of ShadowPriestSim.conf (bot-stat-weights, 2026-11-10): identical except the synthetic secondary
# ratings, set so gear + synthetic is about equal across the spec's throughput secondaries (CritRating, HasteRating,
# MasteryRating, VersatilityRating, CooldownHasteRating, ProcChanceRating) with the same total (74). Generated; do not
# hand-edit.
# Before -> after totals:
#   CritRating 23 -> 14, HasteRating 33 -> 12, MasteryRating 9 -> 12, VersatilityRating 1 -> 12, CooldownHasteRating
#   -11 -> 12, ProcChanceRating 19 -> 12
#
#
# DpsSim profile: ShadowPriestSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for the
# full field list and what each means.
#
# Runs the reworked Shadow rotation (mod-playerbots branch rework-bot-strategies, PriestReworkShadowStrategy
# behind the "dps" strategy) - see .agents/plans/rework-bot-strategies/rework-bot-strategies.PRIEST.PLAN.md,
# Stage S. Run at level 60 (run-sim.sh's default). Disc and Holy heal, so they cannot be simulated.
#
# What a run checks (the PLAN's Stage S list, from the cast log and aura events on actor and target):
#   - opener SW:P -> VT -> DP -> MB -> VE; SW:P applied once per pull (Pain and Suffering keeps it);
#   - VT/DP re-applied only under 3 s and never lapsing more than one cast; VE only with all three DoTs up;
#   - MB roughly every 5 s plus Darkness resets, MF channels clipped when MB comes up;
#   - Madness stacks climb and Call of the Void fires at >=75 stacks with a tentacle up or MB close;
#   - SW:D never cast with the bot <=60% (its backlash lowers the bot's health on the no-heal dummy);
#   - Dispersion at <20% mana; no Mind Sear (at 1 target); Surrender to Madness never fires.
# Tentacle damage and the DoT tick share need the recorder's owned-unit counting (PLAN S0).
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. Exercises Shadow Word: Pain spread and Void Eruption from 2 targets; Mind
#   Sear from 5.
#   modules/mod-dpssim/tools/run-sim.sh ShadowPriestSim 180 60 8 5 100 3
# The Human start's Wild Turkey keeps the AoE safety gates closed, so run multi-target at race 8 (Troll); the sim's
#   one-time "stray unit" warning flags this.

# Dummy health drain (SimProfile.h, Profile::DummyHealthDrain/DummyMaxHealth) - deliberately OFF/absent here
# (R13). The sim dummies 900004/5/6 are rank 3 (world boss), so the elite and boss triggers are true. With the
# drain on, the dummy's lifetime shrinks, Surrender to Madness becomes eligible near the end of the fight, and
# Sundered Mind then kills the healer-less bot. Leave it off, so Surrender stays unfired and the dummy never dies.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_PRIEST (SharedDefines.h)
Class = 5

# The Shadow guide build (docs/reworks/bot-strategy/ Shadow guide; Priest plan D7). Decoded against the live
# talent_dbc: 51 points, every rank and row gate legal. The same string as Playerbots.PremadeSpecLink.5.2.60
# (the bots' premade build).
PlayerbotTalents = --303320310102313132313110330131

# The class's premade glyphs (Playerbots.PremadeSpecGlyph for the spec tab), applied as a live random bot gets
# them. The live config's Playerbots.BotGlyphs = 0 wins anyway, so the actor runs unglyphed.
PlayerbotGlyphs = true

# Gear/stats (user 2026-10-31, normalized across every DPS profile): real item level 55-65 blue dungeon gear and no
# flat primary stats. Gear: the "Priest Dungeon Gear" list of docs/.items.md (staff included; no trinkets). The gear's
# itemization shapes also add the five custom secondaries, unevenly by armor type; the flat ratings below top them up
# (or trim them, when negative) so every DPS profile's sheet reads the plate set's 32 haste, 15 mastery, 25
# versatility, 8 cooldown haste and 19 proc chance (user 2026-10-31). Crit is whatever the gear gives. The "SimActor
# sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
Gear = 18727,22405,13386,13346,18497,12554,18327,11841,22247,18395,18723,13178,22406

SpellPower = 0
AttackPower = 0

CritRating = -9
HasteRating = -2
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 12
VersatilityRating = 12
CooldownHasteRating = 12
ProcChanceRating = 12

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Master switch - see ArcaneMageSim.conf's own comment on this key.
StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py) - see
# ArcaneMageSim.conf's own comment on this block for the reasoning behind these defaults.
TestStrength = false
TestAgility = false
TestStamina = false
TestIntellect = true
TestSpirit = true
TestSpellPower = true
TestAttackPower = false
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = true

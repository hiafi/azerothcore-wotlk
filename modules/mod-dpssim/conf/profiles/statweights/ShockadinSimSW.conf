# Intellect is the main stat (Shock and Awe attack power, Illuminated Steel melee crit, Holy Guidance spell power),
# then spell power (Holy Shock, Exorcism, Glimmer and the hybrid Holy spells), then the melee side.
TestStrength = true
TestAgility = false

# Stat-weight variant of ShockadinSim.conf (bot-stat-weights, 2026-11-10): identical except the synthetic secondary
# ratings, set so gear + synthetic is about equal across the spec's throughput secondaries (CritRating, HasteRating,
# MasteryRating, VersatilityRating, CooldownHasteRating, ProcChanceRating, ArmorPenetrationRating) with the same total
# (76). Generated; do not hand-edit.
# Before -> after totals:
#   CritRating 31 -> 10, HasteRating 10 -> 11, MasteryRating 13 -> 11, VersatilityRating 1 -> 11, CooldownHasteRating
#   2 -> 11, ProcChanceRating 19 -> 11, ArmorPenetrationRating 0 -> 11
#
#
# DpsSim profile: ShockadinSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for
# the full field list.
#
# Runs the Shockadin (Holy DPS) rotation (mod-playerbots branch shockadin-bot: PaladinReworkShockadinStrategy behind
# the "shockadin" strategy, rows in data/strategies/paladin/shockadin.yaml). The Holy column-3 talents below make
# ai::paladin_rework::IsShockadinBuild true, so AiFactory routes the Holy tab to it instead of the healer strategy.
# Guide: docs/reworks/bot-strategy/paladin-shockadin-strat.md. Run at level 60, Dwarf (race 3, a clean start):
#
#   modules/mod-dpssim/tools/run-sim.sh ShockadinSim 120 60 3 5 100
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. 3 targets exercise the pack rows: Divine Toll first, Light's Hammer on the
#   cluster, Holy Shock spread to an enemy without Glimmer, Holy Wrath, Consecration and Deliverance; Radiant
#   Exorcism cleaves by itself.
#   modules/mod-dpssim/tools/run-sim.sh ShockadinSim 120 60 3 5 100 3

# Pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs) - absent here, so the default of 15000 sim ms applies:
# before every iteration the paladin spends 15 s out of combat on its buff strategies (its aura, Blessing of Wisdom),
# unrecorded, then pulls. Seals come from the combat strategies, after the pull.

# Optional dummy health drain (SimProfile.h, Profile::DummyHealthDrain/DummyMaxHealth) - both off/absent here, so
# Hammer of Wrath (target at 20% or less) never fires and the Divine Toll / Light's Hammer health gates always pass.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08. Same as RetPaladinSim.
TargetArmor = 4350

# CLASS_PALADIN (SharedDefines.h)
Class = 2

# The shockadin build, the same string as Playerbots.PremadeSpecLink.2.6.60, decoded against the rework's Holy grid
# (apps/dbc-tools/source/classes/paladin/paladin_talents.py, row-major, empty cells skipped): 51 points, all Holy,
# every row gate legal, 25 points in column 3.
#   Holy (51 points): Spiritual Focus 3/3, Illuminated Steel 3/3, Healing Light 3/3, Unyielding Faith 3/3, Merciful
#       Strikes 3/3, Light's Hammer 1/1, Zealous Exorcism 2/2, Sunlight 3/3, Holy Shock 1/1, Sanctified Light 3/3,
#       Blessed Crusade 3/3, Light's Fervor 2/2, Holy Power 3/3, Radiant Exorcism 3/3, Glimmer of Light 3/3, Holy
#       Guidance 3/3, Shock and Awe 3/3, Judgements of the Pure 3/3, Enlightened Judgements 2/2, Divine Toll 1/1
PlayerbotTalents = 0303303301020003013323000030333003021

# The class's premade glyphs (Playerbots.PremadeSpecGlyph.2.6 = 41103,43367,45746,43368,43369,41098: Exorcism, Lay on
# Hands, Holy Shock, Sense Undead, the Wise, Crusader Strike), applied as a live random bot gets them. The live
# config's Playerbots.BotGlyphs = 0 wins anyway, so the actor runs unglyphed.
PlayerbotGlyphs = true

# Gear/stats: the Holy healer's dungeon set (HolyPaladinHealSim.conf, the "Holy Paladin Dungeon Gear" list of
# docs/.items.md, no trinkets) with Arcanite Reaper 12784 in place of The Hammer of Grace 11923 and Thaurissan's Royal
# Scepter 11928, the two-hander RetPaladinSim swings. No flat primary stats.
# Items, in order: 12633 Whitesoul Helm, 18723 Animated Chain Necklace, 18720 Shroud of the Nathrezim, 11623
# Spritecaster Cape, 13346 Robes of the Exalted, 13969 Loomguard Armbraces, 12554 Hands of the Exalted Herald, 18702
# Belt of the Ordained, 11841 Senior Designer's Pantaloons, 13954 Verdant Footpads, 16058 Fordring's Seal, 13178
# Rosewine Circle, 12784 Arcanite Reaper.
# Sheet estimate from item_template (not run): the healer sheet (Intellect 148, Spirit 149, Stamina 248, flat spell
# power 196, crit 26) loses the two Holy weapons' 5 Intellect, 9 Spirit, 34 spell power and 16 Stamina and gains the
# Reaper's 13 Stamina: about Intellect 143, Spirit 140, Stamina 245, spell power 162 before talents and buffs. No
# item adds Strength or attack power, so attack power is the base value until Shock and Awe adds 100% of Intellect
# (about +143 at rank 3, more with Kings) on the first damaging Holy Shock; Holy Guidance adds 12% of Intellect as
# spell power.
# Secondaries: the flat ratings below are the healer profile's top-ups, which bring that gear (with its two weapons)
# to the normalized sheet of 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance (user
# 2026-10-31). The Reaper carries different custom secondaries than the Hammer and Scepter, so read the "SimActor
# sheet" log line (DPSSIM_KEEP_LOG=1) on the first run and correct the top-ups if the sheet is off.
Gear = 12633,18723,18720,11623,13346,13969,12554,18702,11841,13954,16058,13178,12784

SpellPower = 0
AttackPower = 0

CritRating = -21
HasteRating = 11
ExpertiseRating = 0
ArmorPenetrationRating = 11
MasteryRating = 2
VersatilityRating = 11
CooldownHasteRating = 11
ProcChanceRating = 11

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0

# Stat-weight variant of FrostDkObliterationSim.conf (bot-stat-weights round 4, 2026-11-22): identical except the
# synthetic secondary ratings, set so gear + synthetic is about equal across the spec's throughput secondaries
# (CritRating, HasteRating, MasteryRating, VersatilityRating, CooldownHasteRating, ProcChanceRating,
# ArmorPenetrationRating) with the same total (287). Gear ratings from ItemBudget's formula (the stat line the server
# materializes at boot). Generated by make_variants.py; do not hand-edit.
# Before -> after totals:
#   CritRating 82 -> 41, HasteRating 116 -> 41, MasteryRating 55 -> 41, VersatilityRating 34 -> 41,
#   CooldownHasteRating 0 -> 41, ProcChanceRating 0 -> 41, ArmorPenetrationRating 0 -> 41
#
#
# DpsSim profile: FrostDkObliterationSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the Death Knight rework S2b-1
# (.agents/plans/death-knight-rework/death-knight-rework.S2b-HANDOFF.md, part F, U35; shape of EnhShamanSim.conf with
# the Strength flat block of RetPaladinSim.conf).
#
# Runs the reworked Frost Death Knight's DPS rotation, the 6.3 "frost obliteration" build (mod-playerbots branch
# feat/dk-frost-bot-strategy: the "frost" and "frost aoe" strategies, data/strategies/dk/frost.yaml and frost-pack.yaml,
# DeathKnightReworkFrostStrategy; the nc rows of dk/nc-dps put the Rune of Razorice and Horn of Winter up in the
# pre-pull buff phase). Guide: docs/reworks/bot-strategy/death-knight-frost-bot-guide.md.
# Two one-handers (Dual Wield), no shield.
#
# Exercises the Obliteration build: the pre-Pillar hold, Pillar of Frost windows of Killing Machine Obliterate and Frost
# Strike, plain Breath of Sindragosa at 60; the build is told by Obliteration.
#
# RACE: pass 1 (Human) on the command line, level 60. The 6.3 build.
#   modules/mod-dpssim/tools/run-sim.sh FrostDkObliterationSim 60 60 1 5 # 60 s x 5, single target
#   modules/mod-dpssim/tools/run-sim.sh FrostDkObliterationSim 300 60 1 5 # the 300 s x 5 gate
#   modules/mod-dpssim/tools/run-sim.sh FrostDkObliterationSim 60 60 1 5 100 3 # 3 targets (the pack list; 5, 10)
# Smoke run with the log kept: DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh FrostDkObliterationSim 60 60 1 1
# Expected log lines: "SimActor created" (the weapons below), "strategies resolved" (combat [frost, frost aoe, ...],
# non-combat [... nc ...]), "actor after the first second" (the Rune of Razorice 53343 and Horn of Winter 57330 up; the
# Strength of the sheet), then the iteration summaries. The report's powerSamples[] (runic power and ready runes every
# 500 ms) is the check for runic power at the cap and for idle runes.
#
# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_DEATH_KNIGHT (SharedDefines.h)
Class = 6

# Talents: the guide's 6.3 "frost obliteration" 60 link (Playerbots.PremadeSpecLink.6.3.60 of
# modules/mod-playerbots/conf/playerbots.conf.dist), decoded against the S2a Frost grid (tab 399;
# apps/dbc-tools/lib/test_deathknight_s2.py GRID): 51 points, legal, nested in the .20 / .30 / .40 / .45 links.
# Frost is the second tab (dashes for the empty Blood and Unholy tabs).
PlayerbotTalents = -132032311332001032221023330010020101

# Unglyphed actor: all glyphs are retired server-wide.
PlayerbotGlyphs = false

# The pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs; default 15000): the Rune of Razorice and Horn of Winter
# are two global cooldowns out of combat, with room to spare
PrePullBuffMs = 20000

# Gear (user 2026-11-15): the "Frost Death Knight (dual wield)" kit of .agents/plans/blackrock-gear/blackrock-gear.SIM-KITS.md - the
# Normal tier of Scholomance, Stratholme, Blackrock Spire and Blackrock Depths picked by sim stat weights. No set
# pieces, no trinkets, an item with a proc or Use only when no stat-only item fits the slot, and no flat stat
# top-ups: every rating and primary below is 0, so the sheet is whatever the gear gives (pure stats, the set
# bonuses are measured later). The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting sheet.
Gear = 22411,13533,71294,13951,18722,13142,12935,18692,18734,22403,18684,13373,18683,73264

SpellPower = 0
AttackPower = 0

CritRating = -41
HasteRating = -75
ExpertiseRating = 0
ArmorPenetrationRating = 41
MasteryRating = -14
VersatilityRating = 7
CooldownHasteRating = 41
ProcChanceRating = 41

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# The Frost rotation is measured by the 300 s x 5 runs, not by stat weights
StatWeightsEnabled = false

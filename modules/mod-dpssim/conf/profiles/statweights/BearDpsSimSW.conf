# Stat-weight variant of BearDpsSim.conf (bot-stat-weights, 2026-11-10): identical except the synthetic secondary
# ratings, set so gear + synthetic is about equal across the spec's throughput secondaries (CritRating, HasteRating,
# MasteryRating, VersatilityRating, CooldownHasteRating, ProcChanceRating, ArmorPenetrationRating) with the same total
# (169). Generated; do not hand-edit.
# Before -> after totals:
#   CritRating 99 -> 25, HasteRating 20 -> 24, MasteryRating 18 -> 24, VersatilityRating 31 -> 24, CooldownHasteRating
#   -5 -> 24, ProcChanceRating 6 -> 24, ArmorPenetrationRating 0 -> 24
#
#
# DpsSim profile: BearDpsSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for
# the full field list.
#
# Runs the Bestial Fury bear DPS rotation (mod-playerbots branch bear-dps-strategy, DruidReworkBearDpsStrategy behind
# the "bear dps" strategy, data/strategies/druid/bear-dps.yaml; guide docs/reworks/bot-strategy/
# druid-feral-bear-dps-strat.md) - see .agents/plans/bear-dps-bot/bear-dps-bot.PLAN.md, Stage BS.
#
# RACE: pass 6 (Tauren), the same as the Cat and Balance profiles (the stat math below assumes it):
#   modules/mod-dpssim/tools/run-sim.sh BearDpsSim 300 60 6 10
#
# What a run checks (PLAN Stage BS, from the cast log and aura events):
#   - Bear Form then Bestial Fury on the pull (the bot shifts in combat only);
#   - Swell reaches 5; every Pulverize is at 5 Swell or inside Berserk;
#   - Savage Bite right before Pulverize (Bloodtalons on Pulverize); Berserk casts per fight;
#   - Lacerate kept at 3; Thrash uptime; Maul held at 5 Swell with Lacerate below 3; rage pooled for Pulverize.
#
# NOT COVERED: Barkskin and Frenzied Regeneration (the REACT_PASSIVE dummy never attacks),
# and Feral Charge (the dummy spawns 8 yd away, inside its minimum range). Rage only comes from damage dealt.
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. Exercises Thrash from 2 targets and Upheaval from 3. The tank pack / tanking
#   rows gate on my attacker count (units swinging at the bot); the passive dummies never attack, so those rows
#   still cannot be simmed.
#   modules/mod-dpssim/tools/run-sim.sh BearDpsSim 180 60 6 5 100 3

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_DRUID (SharedDefines.h)
Class = 11

# The bear DPS guide build (-150120300030322320003330100033232001). Decoded against the live talent_dbc: 51 points,
# every rank and row gate legal, Bestial Fury 1/1 (so the bot reads as BearDps), no Elder Hide. The same string as
# Playerbots.PremadeSpecLink.11.7.60 (the bots' premade build).
PlayerbotTalents = -150120300030322320003330100033232001

# The class's premade glyphs; the live config's Playerbots.BotGlyphs = 0 wins, so the actor runs unglyphed.
PlayerbotGlyphs = true

# Gear/stats (user 2026-10-31, normalized across every DPS profile): real item level 55-65 blue dungeon gear and no
# flat primary stats. Gear: the "Feral DPS Druid/Rogue Dungeon Gear" list of docs/.items.md (armor and jewelry; no
# trinkets). Weapons: Huntsman's Harpoon 22314. The gear's itemization shapes also add the five custom secondaries,
# unevenly by armor type; the flat ratings below top them up (or trim them, when negative) so every DPS profile's
# sheet reads the plate set's 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance (user
# 2026-10-31). Crit is whatever the gear gives. A Devilsaur pair's 2-piece bonus is hit rating, which does nothing on
# this server. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
Gear = 8345,15411,12927,13340,14637,12966,15063,13252,15062,12553,13098,17713,22314

SpellPower = 0
AttackPower = 0

CritRating = -74
HasteRating = 14
ExpertiseRating = 0
ArmorPenetrationRating = 24
MasteryRating = 6
VersatilityRating = 11
CooldownHasteRating = 24
ProcChanceRating = 24

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py): the stats a bear DPS druid's
# damage uses. Spell power and the caster stats are off.
TestStrength = true
TestAgility = true
TestStamina = false
TestIntellect = false
TestSpirit = false
TestSpellPower = false
TestAttackPower = true
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = true

# Stat-weight variant of SvHunterSim.conf (bot-stat-weights, 2026-11-10): identical except the synthetic secondary
# ratings, set so gear + synthetic is about equal across the spec's throughput secondaries (CritRating, HasteRating,
# MasteryRating, VersatilityRating, CooldownHasteRating, ProcChanceRating, ArmorPenetrationRating) with the same total
# (175). Generated; do not hand-edit.
# Before -> after totals:
#   CritRating 105 -> 25, HasteRating 20 -> 25, MasteryRating 18 -> 25, VersatilityRating 31 -> 25,
#   CooldownHasteRating -5 -> 25, ProcChanceRating 6 -> 25, ArmorPenetrationRating 0 -> 25
#
#
# DpsSim profile: SvHunterSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this file.
# Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for the full field
# list.
#
# Survival hunter with its Wolf: the Survival rotation (Appendix A of docs/reworks/hunter-survival-rework.md).
# Strategy: until stage B3 lands, "surv" is the STOCK Survival strategy (the rework re-points only "bm", "aoe" and
# "bdps" so far); the 15 yd stand-off and the ground casts are B3. The run log line "strategies resolved" names what
# ran.
# A SETUP profile for stage M0 of the hunter rework (.agents/plans/hunter-rework/hunter-rework.M0-HANDOFF.md): it
# proves the hunter, its pet and the bot strategy run in the sim and that the report shows hunter and pet damage per
# spell. There is no balance work in it yet: the gear and stat numbers below are PLACEHOLDERS (see "Gear/stats"), and
# the balance pass (M1 and after) sets the real ones. Target for that pass: 1000 DPS at 4350 armor.
#
# RACE: pass 6 (Tauren), the same as the Cat, Bear and Balance profiles; the stat math below assumes it. Hunters
# cannot be Human, so run-sim.sh's default race 1 fails:
#   modules/mod-dpssim/tools/run-sim.sh SvHunterSim 180 60 6 10
#   (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets])
# A first look, one iteration of a minute:
#   modules/mod-dpssim/tools/run-sim.sh SvHunterSim 60 60 6 1
#
# What a run checks (from the cast log, the aura events and the per-spell table, where the pet's rows read "(pet)"):
#   - Explosive Shot (Lock and Load procs), Tar Bomb into Cluster Bombs, Wildfire Bomb, the strikes (Raptor Strike,
#     Mongoose Bite, Mantis Strike) from 15 yd with Deadly Focus;
#   - Black Arrow and Serpent Sting uptime, traps thrown at the dummy's position;
#   - the pet's share (about 10% for Survival) against the hunter's.
#
# NOT COVERED: Kill Shot (the dummy's health never drops; it needs DummyHealthDrain = true and a DummyMaxHealth a
# fight can drain, left off like the other profiles), Misdirection (no tank), Silencing Shot, Intimidation and Viper
# Sting (the dummy never casts), Mend Pet and Revive Pet (nothing damages the pet), and the defensive rows. The
# REACT_PASSIVE dummy never fights back.
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
# targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite gives
# a like-for-like 1-target run.
#   modules/mod-dpssim/tools/run-sim.sh SvHunterSim 180 60 6 5 100 3

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_HUNTER (SharedDefines.h)
Class = 3

# Survival build: the 60 link of the SV guide (Appendix A of docs/reworks/hunter-survival-rework.md). Decoded against
# the built Talent.dbc with .agents/plans/hunter-rework/tools/decode_links.py: 51 points, every rank and row gate
# legal, and the 30 and 45 links are contained in it. The same string as Playerbots.PremadeSpecLink.3.2.60 (the bots'
# premade build). Tab order is Beast Mastery - Marksmanship - Survival.
PlayerbotTalents = --2333330100033111003233300030013201

# No glyphs: the hunter rework's bot builds are glyphless (the premade glyph lines for class 3 are stock), and the
# live config's Playerbots.BotGlyphs = 0 would skip them anyway.
PlayerbotGlyphs = false

# The pet: creature 26016, "Tamable Wolf" (family 1, Ferocity). The wolf is the default pet in every hunter guide
# (Furious Howl's party crit runs on its own; Raptor if the group has no armor debuff, Bear for dungeon trash). The
# pet takes the actor's level (60) and the pet-tree points a live bot's premade pet link gives it
# (Playerbots.PremadeHunterPetLink.0.*, the Ferocity type). Other entries: Cat 26021, Raptor 26029, Bear 34025, Boar
# 26020.
PetCreatureEntry = 26016

# Gear/stats (user 2026-10-31, normalized across every DPS profile): real item level 55-65 blue dungeon gear and no
# flat primary stats. Gear: the "Feral DPS Druid/Rogue Dungeon Gear" list of docs/.items.md (armor and jewelry; no
# trinkets), with Felhide Cap 18325 in place of the druid-only Wolfshead Helm. Weapons: Huntsman's Harpoon 22314,
# Ancient Bone Bow 18680. The gear's itemization shapes also add the five custom secondaries, unevenly by armor type;
# the flat ratings below top them up (or trim them, when negative) so every DPS profile's sheet reads the plate set's
# 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance (user 2026-10-31). Crit is whatever the
# gear gives. A Devilsaur pair's 2-piece bonus is hit rating, which does nothing on this server. The "SimActor sheet"
# log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
Gear = 18325,15411,12927,13340,14637,12966,15063,13252,15062,12553,13098,17713,22314,18680

SpellPower = 0
AttackPower = 0

CritRating = -80
HasteRating = 15
ExpertiseRating = 0
ArmorPenetrationRating = 25
MasteryRating = 7
VersatilityRating = 12
CooldownHasteRating = 25
ProcChanceRating = 25

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# Stat-weight runs off for now (the TestX flags are left out): no balance work until M1.
StatWeightsEnabled = false

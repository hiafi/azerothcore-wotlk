# Stat-weight variant of MmHunterSim.conf (bot-stat-weights round 4, 2026-11-22): identical except the synthetic
# secondary ratings, set so gear + synthetic is about equal across the spec's throughput secondaries (CritRating,
# HasteRating, MasteryRating, VersatilityRating, CooldownHasteRating, ProcChanceRating, ArmorPenetrationRating) with
# the same total (298). Gear ratings from ItemBudget's formula (the stat line the server materializes at boot).
# Generated by make_variants.py; do not hand-edit.
# Before -> after totals:
#   CritRating 121 -> 40, HasteRating 113 -> 43, MasteryRating 19 -> 43, VersatilityRating 45 -> 43,
#   CooldownHasteRating 0 -> 43, ProcChanceRating 0 -> 43, ArmorPenetrationRating 0 -> 43
#
#
# DpsSim profile: MmHunterSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this file.
# Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for the full field
# list.
#
# Marksmanship hunter with its Wolf: the Marksmanship rotation (guide docs/reworks/bot-strategy/hunter-mm-strat.md).
# Strategy: until stage B2 lands, "mm" is the STOCK Marksmanship strategy (the rework re-points only "bm", "aoe" and
# "bdps" so far). The run log line "strategies resolved" names what ran.
# A SETUP profile for stage M0 of the hunter rework (.agents/plans/hunter-rework/hunter-rework.M0-HANDOFF.md): it
# proves the hunter, its pet and the bot strategy run in the sim and that the report shows hunter and pet damage per
# spell. There is no balance work in it yet: the gear and stat numbers below are PLACEHOLDERS (see "Gear/stats"), and
# the balance pass (M1 and after) sets the real ones. Target for that pass: 1000 DPS at 4350 armor.
#
# RACE: pass 6 (Tauren), the same as the Cat, Bear and Balance profiles; the stat math below assumes it. Hunters
# cannot be Human, so run-sim.sh's default race 1 fails:
#   modules/mod-dpssim/tools/run-sim.sh MmHunterSim 180 60 6 10
#   (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets])
# A first look, one iteration of a minute:
#   modules/mod-dpssim/tools/run-sim.sh MmHunterSim 60 60 6 1
#
# What a run checks (from the cast log, the aura events and the per-spell table, where the pet's rows read "(pet)"):
#   - Aimed Shot and the marks (Fire!, Trick Shots), Chimera Shot, Steady Shot as the filler;
#   - Rapid Fire on bosses, Readiness after a triple-mark Aimed Shot, Hunter's Mark kept on the dummy;
#   - the pet's share (small for Marksmanship) against the hunter's.
#
# NOT COVERED: Kill Shot (the dummy's health never drops; it needs DummyHealthDrain = true and a DummyMaxHealth a
# fight can drain, left off like the other profiles), Misdirection (no tank), Silencing Shot, Intimidation and Viper
# Sting (the dummy never casts), Mend Pet and Revive Pet (nothing damages the pet), and the defensive rows. The
# REACT_PASSIVE dummy never fights back.
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
# targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite gives
# a like-for-like 1-target run.
#   modules/mod-dpssim/tools/run-sim.sh MmHunterSim 180 60 6 5 100 3

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_HUNTER (SharedDefines.h)
Class = 3

# Marksmanship build: the 60 link of the MM guide (docs/reworks/bot-strategy/hunter-mm-strat.md). Decoded against the
# built Talent.dbc with .agents/plans/hunter-rework/tools/decode_links.py: 51 points, every rank and row gate legal,
# and the 30 and 45 links are contained in it. The same string as Playerbots.PremadeSpecLink.3.1.60 (the bots'
# premade build). Tab order is Beast Mastery - Marksmanship - Survival.
# 2026-11-16 (AoE round 3 on the Normal-tier kits, user ruling: Marksmanship option B): Rain of Arrows 2 (Volley +10/20%,
# Fire! on its ticks, the bounce) for Lethal Shots 2 (Arcane Shot crit +4%); was -233030033130330013001310130031331-.
# 51 points, every row gate legal (Rain of Arrows sits in row 8 under 34 points, Trick Shots 1 in the build). About -7
# at 1 target (Arcane Shot loses 4% crit), accepted. The old 45 link keeps Lethal Shots 2, so it is no longer contained
# in this 60 link (a level-60 bot respecs).
PlayerbotTalents = -033030033130330013001310132031331-

# No glyphs: the hunter rework's bot builds are glyphless (the premade glyph lines for class 3 are stock), and the
# live config's Playerbots.BotGlyphs = 0 would skip them anyway.
PlayerbotGlyphs = false

# The pet: creature 26016, "Tamable Wolf" (family 1, Ferocity). The wolf is the default pet in every hunter guide
# (Furious Howl's party crit runs on its own; Raptor if the group has no armor debuff, Bear for dungeon trash). The
# pet takes the actor's level (60) and the pet-tree points a live bot's premade pet link gives it
# (Playerbots.PremadeHunterPetLink.0.*, the Ferocity type). Other entries: Cat 26021, Raptor 26029, Bear 34025, Boar
# 26020.
PetCreatureEntry = 26016

# Gear (user 2026-11-15): the "Marksmanship Hunter" kit of .agents/plans/blackrock-gear/blackrock-gear.SIM-KITS.md - the
# Normal tier of Scholomance, Stratholme, Blackrock Spire and Blackrock Depths picked by sim stat weights. No set
# pieces, no trinkets, an item with a proc or Use only when no stat-only item fits the slot, and no flat stat
# top-ups: every rating and primary below is 0, so the sheet is whatever the gear gives (pure stats, the set
# bonuses are measured later). The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting sheet.
Gear = 13359,18742,14611,71255,22410,22232,14612,18694,13340,18728,13373,18684,13372,18729

SpellPower = 0
AttackPower = 0

CritRating = -81
HasteRating = -70
ExpertiseRating = 0
ArmorPenetrationRating = 43
MasteryRating = 24
VersatilityRating = -2
CooldownHasteRating = 43
ProcChanceRating = 43

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0

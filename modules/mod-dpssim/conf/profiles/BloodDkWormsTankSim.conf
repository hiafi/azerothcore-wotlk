#
# DpsSim profile: BloodDkWormsTankSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the Death Knight rework S1b-1
# (.agents/plans/death-knight-rework/death-knight-rework.S1b-HANDOFF.md, part C; shape of EnhShamanTankSim.conf): the
# tank-sim profile of the Blood Death Knight tank, the 6.1 "blood tank worms" build (Bloodworms and Sanguine Ground).
#
# Tank-sim profile (plan .agents/plans/tank-sim/tank-sim.PLAN.md): "Mode = Tank" sends the batch down the tank path
# (SimDaemon::RunTankBatch): the DPS sim with every dummy auto-attacking the actor. See ProtWarriorTankSim.conf for the
# scenarios (TankScenario dps / survive, TANKSIM_SCENARIO per run), the boss (1 target) and pack (2-10) numbers, and the
# run commands. Bot strategy exercised: the reworked Blood tank rotation (DeathKnightReworkBloodStrategy,
# data/strategies/dk/blood.yaml and blood-pack.yaml, the creator names "blood" / "tank"; the nc rows of dk/nc-blood
# put Blood Presence, the Rune of Exsanguination and Horn of Winter up in the pre-pull buff phase). The log's
# "strategies resolved" line shows the Blood strategy and "tank assist" / "tank face"; ai::dk_rework::IsTankBuild holds
# for a Blood bot of level 10 and up.
#
# RACE: pass 1 (Human) on the command line, level 60:
#   modules/mod-dpssim/tools/run-sim.sh BloodDkWormsTankSim 60 60 1 5                             # dps, boss
#   TANKSIM_SCENARIO=survive modules/mod-dpssim/tools/run-sim.sh BloodDkWormsTankSim 60 60 1 5    # survive, boss
#   modules/mod-dpssim/tools/run-sim.sh BloodDkWormsTankSim 60 60 1 5 100 3                       # dps, 3-pack (also 5)
# Smoke run with the log kept: DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh BloodDkWormsTankSim 60 60 1 1
# Expected log lines: "SimActor created" (the gear below, one per slot), "actor after the first second" (Blood Presence
# 48266 and the Rune of Exsanguination 203040 up; the sheet's armor, Strength, Stamina), then the "tank iteration"
# summaries.
#
Mode = Tank

# dps: health refilled after every step, never dies. survive: no refill, the run ends at the death (TTD).
TankScenario = dps
# The boss (1 target), before armor and the victim's damage-taken modifiers; each pack dummy (2+ targets).
TankHitDamage = 2250-2750
TankPackHitDamage = 500-600
TankSwingMs = 2000
TankDummyCrit = true

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_DEATH_KNIGHT (SharedDefines.h)
Class = 6

# Talents: the guide's 6.1 "blood tank worms" 60 link (docs/reworks/bot-strategy/death-knight-blood-bot-guide.md, and
# Playerbots.PremadeSpecLink.6.1.60 of modules/mod-playerbots/conf/playerbots.conf.dist), decoded against the S1 Blood
# grid (tab 398; apps/dbc-tools/lib/test_deathknight_s1.py GRID): 51 points, legal, nested in the .30 and .45 links.
# Butchery 2, Subversion 3, Blade Barrier 3, Scent of Blood 3, Two-Handed Weapon Specialization 2, Marrowrend, Dark
# Conviction 1, Thick Blood 3, Vendetta 3, Bloody Strikes 3, Gorefiend's Grasp, Veteran of the Third War 3, Sanguine
# Ground 3, Crimson Scourge 3, Bloodworms 3, Dancing Rune Weapon, Voracious 2, Improved Death Strike 2, Blood Nova,
# Will of the Necropolis 2, Vampiric Blood, Blood Gorged 3, Purgatory, Bonestorm.
PlayerbotTalents = 233003211303313030033120201210311

# Unglyphed actor: all glyphs are retired server-wide.
PlayerbotGlyphs = false

# The pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs; default 15000): Blood Presence, the rune and Horn of
# Winter are three global cooldowns out of combat, with room to spare
PrePullBuffMs = 20000

# Gear: real level 55-65 plate, one piece per slot, plus a two-hander. No trinkets, no second ring. The armor set is the
# tank dungeon gear of docs/.items.md "Protection Paladin/Warrior Tank Dungeon Gear" (the same 11 pieces as
# ProtWarriorTankSim / ProtPaladinTankSim, Strength / Stamina plate whose stats the item_itemization shapes carry), with
# the one-hand weapon and the shield taken out for the two-handed weapon of docs/.items.md "Ret Paladin/DPS Warrior
# Dungeon Gear" (the one RetPaladinSim uses). The Death Knight tank rotation is built on the two-hander (Two-Handed
# Weapon Specialization is in both links). All 12 ids were checked against the live item_template (plate at item level
# 57-66, each armor piece with an item_itemization row). The Arcanite Reaper has no item_itemization row, so it runs on
# its stock item_template stats (+13 Stamina, 153-256 damage, 3.8 speed); the S1b-2 smoke run's "SimActor created" line
# shows the sheet.
#   Head       12640 Lionheart Helm
#   Neck       21792 Necklace of the Diamond Tower
#   Shoulders  16733 Spaulders of Valor           (Valor, itemset: 2-piece bonus)
#   Back       18495 Redoubt Cloak
#   Chest      16730 Breastplate of Valor
#   Wrists     16735 Bracers of Valor
#   Hands      16737 Gauntlets of Valor
#   Waist      16736 Belt of Valor
#   Legs       16732 Legplates of Valor
#   Feet       16734 Boots of Valor
#   Ring       22680 Band of Resolution
#   Two-hand   12784 Arcanite Reaper              (two-hand axe, 3.8 speed)
Gear = 12640,21792,16733,18495,16730,16735,16737,16736,16732,16734,22680,12784

SpellPower = 0
AttackPower = 0

# Tank stat weights are stage TS4 (against TTD and net DTPS), not this DPS tool
StatWeightsEnabled = false

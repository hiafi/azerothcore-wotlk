#
# DpsSim profile: ProtWarriorSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for
# the full field list.
#
# Runs the reworked Protection Warrior rotation (mod-playerbots branch rework-bot-strategies, the Prot warrior
# tank strategy). A ROTATION-SANITY sim only: there is no DPS target for this profile, the numbers are not a
# balance reference. Run at level 60 (run-sim.sh's default). RACE comes from the run-sim.sh arguments, not this
# file: pass 1 (Human, also the default) or 2 (Orc); the stat estimates below assume Human base stats.
#   modules/mod-dpssim/tools/run-sim.sh ProtWarriorSim 180 60 1 5
#   (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs] [targets])
#
# What a run checks (from the cast log and aura events):
#   - Shield Slam -> Thunder Clap sequencing on cooldown, Devastate as the filler between them;
#   - Sunder Armor debuff (aura 58567) uptime on the dummy, kept up by Devastate;
#   - Heroic Strike used as a rage dump (not starving Shield Slam), Concussion Blow on its cooldown;
#   - Defensive Stance applied on the pull.
#
# NOT COVERED: Revenge (needs a dodge/parry/block, and the REACT_PASSIVE dummy never attacks), rage from damage
# taken (rage only comes from damage dealt, so the bot runs on a lower rage budget than in game), and every
# defensive cooldown (Shield Block, Shield Wall, Last Stand, Spell Reflection, Enraged Regeneration - the dummy
# deals no damage, and Spell Reflection / Enraged Regeneration are not trainable for the sim bot anyway).
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. The passive dummies never attack, so the tanking/threat rows that gate on
#   attacker count still cannot be simmed.
#   modules/mod-dpssim/tools/run-sim.sh ProtWarriorSim 180 60 1 5 100 3

# Pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs) - absent here, so the default of 15000 sim ms applies.
# `PrePullBuffMs = 0` turns the phase off.

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_WARRIOR (SharedDefines.h)
Class = 1

# Prot build, 51 points on the rework's talent grid, Protection (third tab) deep: --2331302122032321020310330123201
# (Playerbots.PremadeSpecLink.1.2.60 of the Protection bot guide). The first two tabs are empty ("-" "-"). Digits in tab
# order (row, then column; empty cells skipped):
#   Improved Bloodrage 2/2, Shield Specialization 3/3, Improved Thunder Clap 3/3, Devastate 1/1, Incite 3/3,
#   Unwavering Sentinel 2/3, Last Stand 1/1, Improved Revenge 2/2, Shield Mastery 2/2, Shield Cover 3/3, Reprisal 2/2,
#   Puncture 3/3, The Wall 2/2, Concussion Blow 1/1, Iron Temper 2/2, Critical Block 3/3, Vigilance 1/1,
#   Storm's Bulwark 3/3, Resolve 3/3, Unrelenting 1/1, Shield Discipline 2/2, Thunderstruck 3/3, Sword and Board 2/3,
#   Shockwave 1/1 (Blood and Thunder, Firm Grip, Gag Order, One-Handed Weapon Specialization, Focused Rage, Safeguard
#   and Damage Shield unbought). Legal at 21/36/51 points through the .30/.45/.60 prefixes of the same build.
PlayerbotTalents = --2331302122032321020310330123201

# Unglyphed actor: keeps the rotation check free of glyph effects.
PlayerbotGlyphs = false

# Gear: one real one-hand weapon plus a shield (Devastate, Shield Slam and Shield Block all require a shield).
# Both are level-60 items from the live item_template, no class restriction, picked as Molten Core / ZG-tier
# (item level 65-67) rather than raid-tier BWL/Naxx gear, so the tank is not overgeared for a pre-raid test.
#   Dark Iron Reaver (17015): one-hand sword, 71-134, 2.4 speed, +10 Stamina, required level 60, item level 65.
#   Drillborer Disk (17066): shield, 2,918 armor, 60 block, +13 block rating, +11 Stamina, level 60, ilvl 67.
# SimActor::Create() clears the starter outfit, grants the weapon skill (Swords) at the level cap and the shield
# skill, then equips each item through CanEquipNewItem(NULL_SLOT): the one-hander takes the free main hand and the
# shield (InventoryType 14) can only go to the off-hand, so listing the sword first is enough. Check the
# "SimActor created" log line for the main-hand item and total melee attack power.
Gear = 17015,17066

# ESTIMATES: there is no in-game character sheet for this profile. The values below are a plausible level-60
# tank top-up over the two items (roughly a Human warrior in a partial dungeon set), not captured numbers.
# Level-60 Human warrior base Strength is about 120 (player_class_stats + player_race_stats), so Strength 60 on
# top is ~180, with Stamina for a tank-sized health pool. Re-derive from the "SimActor created" log line if a real
# sheet ever exists.
SpellPower = 0
AttackPower = 120


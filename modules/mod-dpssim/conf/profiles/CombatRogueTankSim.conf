#
# DpsSim profile: CombatRogueTankSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the Rogue rework stage S3b
# (.agents/plans/rogue-rework/rogue-rework.S3b-HANDOFF.md, part 1 Part E; part 2 runs it); the tank-sim profile of the
# Combat "combat tank" build (slot 4.4), shape of BearTankSim.conf / EnhShamanTankSim.conf.
#
# Tank-sim profile (plan .agents/plans/tank-sim/tank-sim.PLAN.md): "Mode = Tank" sends the batch down the tank path
# (SimDaemon::RunTankBatch): the DPS sim with every dummy auto-attacking the actor. See ProtWarriorTankSim.conf for the
# scenarios (TankScenario dps / survive, TANKSIM_SCENARIO per run), the boss (1 target) and pack (2-10) numbers, and the
# run commands. Bot strategy exercised: the reworked Combat tank rotation (mod-playerbots branch
# feat/rogue-combat-bot-strategy: RogueReworkCombatTankStrategy, data/strategies/rogue/combat-tank.yaml and
# combat-tank-pack.yaml, the "combat tank" strategy AiFactory adds when ai::rogue_rework::IsBotTankBuild). Guide:
# docs/reworks/bot-strategy/rogue-combat-bot-guide.md, "Tank (Enforcer Stance)".
#
# Enforcer Stance at the pull. The iteration reset strips the stance (a non-passive aura) and the pre-pull buff phase
# only runs the buff strategies, so every iteration starts without it. The combat row "cmbt enforcer stance"
# (known(203720) and not in the stance, relevance high + 9, above every other row but the defensives) puts it on the
# first combat AI tick after the pull (the bear-form precedent); the dummies' first swing lands one swing interval (2.0
# s) after the pull. The cast log shows 203720 at the start of every iteration, and the "actor after the first second"
# sheet is the stance's. PlayerbotAI::IsTank(player, bySpec) is true for this build through the 4.4 link: Riposte
# (14251) and En Garde (203969) are known (IsBotTankBuild's talent clause; a bot's stance is no clause).
#
# RACE: pass 2 (Orc), as the other rogue profiles. Run at level 60:
#   modules/mod-dpssim/tools/run-sim.sh CombatRogueTankSim 60 60 2 5                                  # dps, boss
#   TANKSIM_SCENARIO=survive modules/mod-dpssim/tools/run-sim.sh CombatRogueTankSim 60 60 2 5         # survive, boss
#   modules/mod-dpssim/tools/run-sim.sh CombatRogueTankSim 60 60 2 5 100 3                            # dps, 3-pack
#   TANKSIM_SCENARIO=survive modules/mod-dpssim/tools/run-sim.sh CombatRogueTankSim 60 60 2 5 100 3   # survive, 3-pack
# The first smoke run keeps the log (read it before the numbers):
#   DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh CombatRogueTankSim 60 60 2 1
#
# Levels below 58 (the weapons below need level 58): copy this profile to a scratch path (give run-sim.sh the path), set
# `Gear = 2092,2092` (two Worn Daggers) and use the guide's `.45` link for a level 45 run (`.30`, `.35`, `.40` and `.50`
# are in modules/mod-playerbots/conf/playerbots.conf.dist):
#   modules/mod-dpssim/tools/run-sim.sh <scratch path> 60 45 2 5 100 1
#
# Expected in the run log: "SimActor created" naming all fourteen items (the leather set, the two rings and the two
# daggers), "actor after the first second" with the stance's sheet, "strategies resolved" listing "combat tank" and
# "tank assist" among the combat strategies, 51 talent points spent, and Instant + Crippling Poison up at the pull. The
# tank samples' power type is the mode over the fight, so it reads energy.
#
# Cannot be simmed (the tank dummies swing but never cast, there is no party): Feint's "boss casting" clause, Cloak of
# Shadows' boss-cast trigger, Kick's capstone, Insult (no loose enemy: nobody else is in the fight) and the pull
# (Pistol Shot / Insult: the sim starts the fight itself). Testable: Riposte (the boss swings every 2.0 s), Unfair
# Advantage, Deflection, Ghostly Veil, En Garde's reduction, Reinforced Leather x Enforcer Stance's armor (the sheet:
# ruling U57, the 3/3 product is x2.61 on the items' armor), Feint on the pack (3 attackers).

Mode = Tank

# dps: health refilled after every step, never dies. survive: no refill, the run ends at the death (TTD).
TankScenario = dps
# The boss (1 target), before armor and the victim's damage-taken modifiers; each pack dummy (2+ targets).
TankHitDamage = 2250-2750
TankPackHitDamage = 500-600
TankSwingMs = 2000
TankDummyCrit = true

# Pre-pull buff phase: 20 s, so the two poison casts (Lethal, Crippling) land before the pull (the buff phase keeps the
# nc strategy; the stance is a combat row).
PrePullBuffMs = 20000

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_ROGUE (SharedDefines.h)
Class = 4

# Talents: the guide's slot 4.4 .60 link (docs/reworks/bot-strategy/rogue-combat-bot-guide.md, and
# Playerbots.PremadeSpecLink.4.4.60 of modules/mod-playerbots/conf/playerbots.conf.dist), 51 points on the rework's
# Combat grid (tab 181): the tank build (Deflection, Endurance, Reinforced Leather, Riposte, Improved Riposte, En Garde,
# Improved Feint, Unfair Advantage). Combat is the second tab, so the link starts with one dash.
PlayerbotTalents = -303323002131103331011321310001212001

# Unglyphed, as every tank profile (all rogue glyphs are retired server-wide).
PlayerbotGlyphs = false

# Gear/stats (user 2026-11-01, normalized like the DPS profiles): real item level 55-65 blue dungeon gear and no flat
# primary stats. Gear: the "Feral Tank Druid Dungeon Gear" list of docs/.items.md (armor and jewelry; no trinkets).
# Weapons kept from the old profile: Heartseeker 12783 (main hand) and Scarlet Kris 5267 (off hand); the list's
# Brutality Blade 18832 is not used. No druid-only item is in this list. The gear's itemization shapes also add the five
# custom secondaries, unevenly by armor type; the flat ratings below top them up (or trim them, when negative) so the
# sheet reads the plate set's 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance, as in every
# normalized DPS profile (user 2026-10-31). Gear-only values the top-ups correct: haste 12, mastery 17, versatility 7,
# cooldown haste 31, proc chance 23. Crit is whatever the gear gives. Devilsaur Leggings and Gauntlets (15062 / 15063,
# itemset 143, Devilsaur Armor) are a 2-piece pair: the bonus is hit rating (spell 39516), which does nothing on this
# server. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
# Items, in order: 13404 Mask of the Unforgiven, 22150 Beads of Ogre Might, 12927 Truestrike Shoulders, 18689 Phantasmal
# Cloak, 12757 Breastplate of Bloodthirst, 12966 Blackmist Armguards, 15063 Devilsaur Gauntlets, 13252 Cloudrunner

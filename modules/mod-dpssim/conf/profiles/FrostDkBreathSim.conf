#
# DpsSim profile: FrostDkBreathSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the Death Knight rework S2b-1
# (.agents/plans/death-knight-rework/death-knight-rework.S2b-HANDOFF.md, part F, U35; shape of EnhShamanSim.conf with
# the Strength flat block of RetPaladinSim.conf).
#
# Runs the reworked Frost Death Knight's DPS rotation, the 6.2 "frost breath" build (mod-playerbots branch
# feat/dk-frost-bot-strategy: the "frost" and "frost aoe" strategies, data/strategies/dk/frost.yaml and frost-pack.yaml,
# DeathKnightReworkFrostStrategy; the nc rows of dk/nc-dps put the Rune of Razorice and Horn of Winter up in the
# pre-pull buff phase). Guide: docs/reworks/bot-strategy/death-knight-frost-bot-guide.md.
# Two one-handers (Dual Wield), no shield.
#
# Exercises Breath of Sindragosa: the chain of Empower Rune Weapon, Pillar of Frost and Breath at near-cap Runic Power
# every 2 min, the pooling list, Obliterate and Howling Blast inside Breath; the build is told by Frostwyrm's Wrath /
# Rage of the Frozen Champion.
#
# RACE: pass 1 (Human) on the command line, level 60. The 6.2 build.
#   modules/mod-dpssim/tools/run-sim.sh FrostDkBreathSim 60 60 1 5 # 60 s x 5, single target
#   modules/mod-dpssim/tools/run-sim.sh FrostDkBreathSim 300 60 1 5 # the 300 s x 5 gate (Breath: 2 min)
#   modules/mod-dpssim/tools/run-sim.sh FrostDkBreathSim 60 60 1 5 100 3 # 3 targets (the pack list; 5, 10)
# Smoke run with the log kept: DPSSIM_KEEP_LOG=1 modules/mod-dpssim/tools/run-sim.sh FrostDkBreathSim 60 60 1 1
# Expected log lines: "SimActor created" (the weapons below), "strategies resolved" (combat [frost, frost aoe, ...],
# non-combat [... nc ...]), "actor after the first second" (the Rune of Razorice 53343 and Horn of Winter 57330 up; the
# Strength of the sheet), then the iteration summaries. The report's powerSamples[] (runic power and ready runes every
# 500 ms) is the check for runic power at the cap and for idle runes.
#
# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_DEATH_KNIGHT (SharedDefines.h)
Class = 6

# Talents: the guide's 6.2 "frost breath" 60 link (Playerbots.PremadeSpecLink.6.2.60 of
# modules/mod-playerbots/conf/playerbots.conf.dist), decoded against the S2a Frost grid (tab 399;
# apps/dbc-tools/lib/test_deathknight_s2.py GRID): 51 points, legal, nested in the .20 / .30 / .40 / .45 links.
# Frost is the second tab (dashes for the empty Blood and Unholy tabs).
PlayerbotTalents = -132032311332001330211000332000203021

# Unglyphed actor: all glyphs are retired server-wide.
PlayerbotGlyphs = false

# The pre-pull buff phase (SimProfile.h, Profile::PrePullBuffMs; default 15000): the Rune of Razorice and Horn of Winter
# are two global cooldowns out of combat, with room to spare
PrePullBuffMs = 20000

# Gear/stats (user 2026-10-31, normalized across every DPS profile): real item level 55-65 blue dungeon gear and no
# flat primary stats. Gear: the "Ret Paladin/DPS Warrior Dungeon Gear" list of docs/.items.md (armor and jewelry; no
# trinkets). Weapons: Mass of McGowan 13006 (main hand), Dark Iron Destroyer 17016 (off hand). The gear's itemization
# shapes also add the five custom secondaries, unevenly by armor type; the flat ratings below top them up (or trim
# them, when negative) so every DPS profile's sheet reads the plate set's 32 haste, 15 mastery, 25 versatility, 8
# cooldown haste and 19 proc chance (user 2026-10-31). Crit is whatever the gear gives. A Devilsaur pair's 2-piece
# bonus is hit rating, which does nothing on this server. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the
# resulting character sheet.
Gear = 12587,15411,12927,13340,11726,13400,15063,13959,15062,12555,13098,17713,13006,17016

SpellPower = 0
AttackPower = 0

CritRating = 0
HasteRating = 0
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 0
VersatilityRating = 0
CooldownHasteRating = 0
ProcChanceRating = 0

Strength = 0
Agility = 0
Stamina = 0
Intellect = 0
Spirit = 0

# The Frost rotation is measured by the 300 s x 5 runs, not by stat weights
StatWeightsEnabled = false

#
# DpsSim profile: ShamanEleSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for the
# full field list and what each means. Copied from the shape of DestructionWarlockSim.conf.
#
# Runs the reworked Elemental shaman (mod-playerbots branch feat/shaman-ele-bot-strategy: the "ele" strategy,
# data/strategies/shaman/ele.yaml and totems.yaml) - see .agents/plans/shaman-rework/shaman-rework.S1b-HANDOFF.md,
# part S1b-1 (Part C) and S1b-2 (the runs). Guide: docs/reworks/bot-strategy/shaman-elemental-bot-guide.md.
#
# RACE: pass 2 (Orc). run-sim.sh defaults to race 1 (Human), and the sim runs at the race's start position: Human and
# Undead starts have an attackable Wild Turkey 17.5 yd away, which closes the AoE safety gates ("unsafe aoe units"),
# and a Blood Elf start has a Mana Wyrm at 44 yd. Orc's Valley of Trials has only friendly NPCs nearby. Run at level 60:
#   modules/mod-dpssim/tools/run-sim.sh ShamanEleSim 300 60 2 10
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); the argument after 5 100 is the target count. 2+
#   targets use the elite pack dummies (900007-9, not boss-flagged) stacked within 3 yd; DPSSIM_TARGET_RANK=elite
#   gives a like-for-like 1-target run. Exercises Earthquake, Chain Lightning, Magma Totem and Fire Nova from 3 targets.
#   modules/mod-dpssim/tools/run-sim.sh ShamanEleSim 180 60 2 5 100 3
#
# Cannot be simmed (one passive dummy that never dies and never threatens the actor): moving rows, interrupts (Wind
# Shear), fear (Tremor Totem), group totems (Healing Stream, Cleansing, Earthen Wall), the Earth Elemental's taunt with
# a tank. Elemental and totem damage is attributed to the shaman (EventRecorder isPet rows).

# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_SHAMAN (SharedDefines.h)
Class = 7

# The Elemental 7.0 "ele pve" build, 51 points on the rework's talent grid: the .60 link of the guide
# (docs/reworks/bot-strategy/shaman-elemental-bot-guide.md), the same string as Playerbots.PremadeSpecLink.7.0.60 (the
# bots' premade build). Elemental is the first tab, so there are no dashes. The 7.3 "ele aoe" build is
# 1330300113222013303133130013131 (the guide's string with Raze 1 and Reverberation 1, see playerbots.conf.dist).
PlayerbotTalents = 3330300313200013333103130013131

# Pre-pull buff phase: 30 s instead of the default 15 s, so the imbue (Flametongue), Water Shield and the Attunement
# land before the pull (the buff phase keeps the nc strategy).
PrePullBuffMs = 30000

# Unglyphed actor: all shaman glyphs are retired server-wide.
PlayerbotGlyphs = false

# Gear: one one-hand weapon plus a shield, so the actor has a weapon and the off-hand slot is not empty. Both are level-60
# items from the live item_template, no class restriction, picked for plain stats (Stamina only) so the caster baseline
# below stays the actor's spell power, Intellect and Spirit:
#   Dark Iron Destroyer (17016): one-hand axe, 71-134, 2.4 speed, +10 Stamina, required level 60, item level 65.
#   Drillborer Disk (17066): shield, 2,918 armor, 60 block, +13 block rating, +11 Stamina, level 60, item level 67.
# The imbue is an aura and needs no particular weapon. Check the "SimActor created" log line for the main-hand item.
Gear = 17016,17066

# Gear/stats: the shared level-60 caster baseline every caster profile uses (user, 2026-10-07; taken from real gear).
# Character-sheet totals before talents and buffs: 255 Intellect, 144 Spirit, 398 spell power. Intellect and Spirit
# below are the gear part only: the target minus the level-60 base of an Orc shaman (player_class_stats 90 Intellect /
# 100 Spirit + player_race_stats Orc -3 / +2 = 87 Intellect, 102 Spirit). Spell power from stats is floor(Int / 2) +
# floor(Spirit / 2) (Unit::SpellBaseDamageBonusDone) = 127 + 72, so the flat SpellPower is 398 - 199 = 199. Run as
# race 2 (Orc); another race changes the base stats.

SpellPower = 199
AttackPower = 0

CritRating = 35
HasteRating = 12
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 17
VersatilityRating = 0
CooldownHasteRating = 13
ProcChanceRating = 13

Strength = 0
Agility = 0
Stamina = 200
Intellect = 168
Spirit = 42

# Master switch - see ArcaneMageSim.conf's own comment on this key.
StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py) - see
# ArcaneMageSim.conf's own comment on this block for the reasoning behind these defaults.
TestStrength = false
TestAgility = false
TestStamina = false

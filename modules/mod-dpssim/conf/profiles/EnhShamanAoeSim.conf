#
# AoE build: the guide's 7.4 "enh aoe" 60 link (copy of EnhShamanSim.conf with this one talent line changed; S3b-2 smoke test).
# DpsSim profile: EnhShamanAoeSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. Created for the SIMALL stage
# (.agents/plans/tank-sim/tank-sim.STAGE-SIMALL-HANDOFF.md); the first Enhancement profile.
#
# Runs the reworked Enhancement shaman's DPS rotation (mod-playerbots branch feat/shaman-enh-bot-strategy: the "enh"
# strategy, data/strategies/shaman/enh.yaml, ShamanReworkEnhStrategy). Guide:
# docs/reworks/bot-strategy/shaman-enhancement-bot-guide.md. Two one-handers (Dual Wield), no shield.
#
# RACE: pass 2 (Orc), as ShamanEleSim (Orc's Valley of Trials has only friendly NPCs nearby; Human cannot be a shaman).
# Run at level 60:
#   modules/mod-dpssim/tools/run-sim.sh EnhShamanAoeSim 60 60 2 5
#
# Multi-target: the 7th run-sim.sh argument is [targets] (1-10); 2+ targets use the elite pack dummies. The pack rows
# (Chain Lightning, Magma Totem, Fire Nova) need 3+ enemies near the target.
#   modules/mod-dpssim/tools/run-sim.sh EnhShamanAoeSim 60 60 2 5 100 3
#
# Dummy armor: level-62 dungeon boss (creature_classlevelstats 4,344), user ruling 2026-10-08.
TargetArmor = 4350

# CLASS_SHAMAN (SharedDefines.h)
Class = 7

# Talents: the guide's 7.1 "enh pve" 60 link (docs/reworks/bot-strategy/shaman-enhancement-bot-guide.md, and
# Playerbots.PremadeSpecLink.7.1.60 of modules/mod-playerbots/conf/playerbots.conf.dist). The live env/dist/etc/modules/
# playerbots.conf still carries the pre-rework string for 7.1.60 (-3030500310502133303131131051, the stock tree's digits;
# it also lacks 7.6 altogether), written before the shaman rework's talent grid; the bots will pick up the .dist string
# when the module's conf is redeployed, so the .dist string (the guide's) is the one used. Enhancement is the second tab
# (51 points, dashes for the empty tabs).
PlayerbotTalents = -3021103333033021300320011300231031

# Unglyphed actor: all shaman glyphs are retired server-wide.
PlayerbotGlyphs = false

# Gear/stats (user 2026-10-31, normalized across every DPS profile): real item level 55-65 blue dungeon gear and no
# flat primary stats. Gear: the "Feral DPS Druid/Rogue Dungeon Gear" list of docs/.items.md (armor and jewelry; no
# trinkets), with Felhide Cap 18325 in place of the druid-only Wolfshead Helm. Weapons: Mass of McGowan 13006 (main
# hand), Dark Iron Destroyer 17016 (off hand). The gear's itemization shapes also add the five custom secondaries,
# unevenly by armor type; the flat ratings below top them up (or trim them, when negative) so every DPS profile's
# sheet reads the plate set's 32 haste, 15 mastery, 25 versatility, 8 cooldown haste and 19 proc chance (user
# 2026-10-31). Crit is whatever the gear gives. A Devilsaur pair's 2-piece bonus is hit rating, which does nothing on
# this server. The "SimActor sheet" log line (DPSSIM_KEEP_LOG=1) prints the resulting character sheet.
Gear = 18325,15411,12927,13340,14637,12966,15063,13252,15062,12553,13098,17713,13006,17016


#
# DpsSim profile: BearDpsSim
#
# Loaded by SimProfile::Load() (modules/mod-dpssim/src/SimProfile.h/.cpp) when DpsSim.Profile points at this
# file. Format: "Key = Value" lines, "#" comments, blank lines ignored. See SimProfile.h's Profile struct for
# the full field list.
#
# Runs the Bestial Fury bear DPS rotation (mod-playerbots branch bear-dps-strategy, DruidReworkBearDpsStrategy behind
# the "bear dps" strategy, data/strategies/druid/bear-dps.yaml; guide docs/reworks/bot-strategy/
# druid-feral-bear-dps-strat.md) - see .agents/plans/bear-dps-bot/bear-dps-bot.PLAN.md, Stage BS.
#
# RACE: pass 6 (Tauren), the same as the Cat and Balance profiles (the stat math below assumes it):
#   modules/mod-dpssim/tools/run-sim.sh BearDpsSim 300 60 6 10
#
# What a run checks (PLAN Stage BS, from the cast log and aura events):
#   - Bear Form then Bestial Fury on the pull (the bot shifts in combat only);
#   - Swell reaches 5; every Pulverize is at 5 Swell or inside Berserk;
#   - Savage Bite right before Pulverize (Bloodtalons on Pulverize); Berserk casts per fight;
#   - Lacerate kept at 3; Thrash uptime; Maul held at 5 Swell with Lacerate below 3; rage pooled for Pulverize.
#
# NOT COVERED: the AoE rows (one dummy), Barkskin and Frenzied Regeneration (the REACT_PASSIVE dummy never attacks),
# and Feral Charge (the dummy spawns 8 yd away, inside its minimum range). Rage only comes from damage dealt.

# CLASS_DRUID (SharedDefines.h)
Class = 11

# The bear DPS guide build (-150120300030322320003330100033232001). Decoded against the live talent_dbc: 51 points,
# every rank and row gate legal, Bestial Fury 1/1 (so the bot reads as BearDps), no Elder Hide. The same string as
# AiPlayerbot.PremadeSpecLink.11.7.60 (the bots' premade build).
PlayerbotTalents = -150120300030322320003330100033232001

# The class's premade glyphs; the live config's AiPlayerbot.BotGlyphs = 0 wins, so the actor runs unglyphed.
PlayerbotGlyphs = true

# Gear/stats: the user's level-60 dungeon-gear feral set (2026-10-08), the same as FeralCatSim. Character-sheet
# totals before talents and buffs: 191 Agility, 440 attack power, 105 crit rating, 22 haste, 15 mastery, 5 cooldown
# haste, 31 versatility and 13 proc chance rating. Hit/expertise are left at 0: this server's stat system gives 100% PvE hit and expertise.
#
# The 440 is the caster-form sheet (StatSystem.cpp: Strength x 2 - 20 + gear attack power); a bear-form sheet would
# already hold Agility, level x 2 and the weapon's feral attack power. Bear Form adds those on top in the sim.
#
# Ursol's Claw (24155): two-handed staff, 144-268, 3.0 speed, +14 Agility, +30 attack power; no class
# restriction (AllowableClass -1), required level 60. Druids train Staves; SimActor grants a gear weapon's skill
# at the level cap before equipping. Bear Form does use the weapon: StatSystem.cpp adds feral attack power from
# weapon DPS, about (68.8 DPS x 14) - 767 = 196 AP for this staff, on top of its +30 attack power and +14 Agility.
# It stands in for the set's weapon.
#
# Agility: 191 total minus the level-60 Tauren druid base (player_class_stats + player_race_stats: 65 + 5 = 70
# Strength, 60 - 4 = 56 Agility) and the staff's 14 = 121. Attack power: 440 minus caster-form Strength
# (70 x 2 - 20 = 120) and the staff's 30 = 290. Check the "SimActor created" log line: its total melee attack power
# (caster form, before talents) should read 440. Run as race 6 (Tauren); another race changes the base stats.
Gear = 24155

SpellPower = 0
AttackPower = 290

CritRating = 105
HasteRating = 22
ExpertiseRating = 0
ArmorPenetrationRating = 0
MasteryRating = 15
VersatilityRating = 31
CooldownHasteRating = 5
ProcChanceRating = 13

Strength = 0
Agility = 121
Stamina = 0
Intellect = 0
Spirit = 0

StatWeightsEnabled = true

# Stat-weight testing toggles (modules/mod-dpssim/tools/stat_weights.py): the stats a bear DPS druid's
# damage uses. Spell power and the caster stats are off.
TestStrength = true
TestAgility = true
TestStamina = false
TestIntellect = false
TestSpirit = false
TestSpellPower = false
TestAttackPower = true
TestCritRating = true
TestHasteRating = true
TestMasteryRating = true
TestVersatilityRating = true
TestCooldownHasteRating = true
TestProcChanceRating = true

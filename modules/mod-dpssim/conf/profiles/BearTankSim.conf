#
# DpsSim profile: BearTankSim
#
# Tank-sim profile (plan .agents/plans/tank-sim/tank-sim.PLAN.md, T6): a level-60 Tauren Feral druid with the bear TANK
# build and strategy (not Bestial Fury: BearDpsSim.conf is the bear DPS profile). "Mode = Tank" sends the batch down the
# tank path (SimDaemon::RunTankBatch): the DPS sim with every dummy auto-attacking the actor. Format: "Key = Value"
# lines, "#" comments, blank lines ignored. The scenarios, the dummies and the report are the ones
# ProtWarriorTankSim.conf's header describes (dps: health refilled, tank DPS / TPS / DTPS; survive: no refill, time to
# death).
#
# Bot strategy exercised: the reworked bear tank rotation, DruidReworkBearStrategy + data/strategies/druid/bear.yaml in
# mod-playerbots: Ironfur kept at 3+ stacks while tanking, Mangle / Demoralizing Roar / Thrash / Pulverize at 3
# Lacerate / Maul at 45 rage, the pack rows from 3 attackers, Enrage and Berserk, and the defensives (Survival Instincts
# < 30%, Barkskin < 60% while tanking, Frenzied Regeneration < 50%). The tank sim is the first place the "tanking" and
# defensive rows can fire.
#
# Bear Form at the pull. The iteration reset strips Bear Form (a non-passive aura) and the pre-pull buff phase only runs
# the buff strategies (Mark of the Wild, Thorns, in caster form), so every iteration starts in caster form. The combat
# row F ("bear bear form", known(5487) and not in Bear Form, relevance high + 9, above every other row but the
# defensives and Bash) shifts the bot on its first combat AI tick after the pull; the dummies' first swing lands one
# swing interval (2.0 s) after the pull, so it meets the bear. The cast log shows 5487 at the start of every iteration,
# and the "actor after the first second" sheet is the bear's. The tank samples' power type is the mode over the
# fight, so it reads rage.
#
# PlayerbotAI::IsTank(player, bySpec) is true for this build: Feral tab, Elder Hide taken and no Bestial Fury
# (ai::druid_rework::IsBearBuild / IsBearDpsBuild).
#
# Race: Tauren (run-sim.sh's [race] argument 6), the same as BearDpsSim, FeralCatSim and the other druid profiles.
#
# Run it from the repo root (argument order: <profile> [durationSeconds] [level] [race] [iterations] [stepMs]
# [targets]):
#   modules/mod-dpssim/tools/run-sim.sh BearTankSim 120 60 6 10                                     # dps, boss
#   TANKSIM_SCENARIO=survive modules/mod-dpssim/tools/run-sim.sh BearTankSim 120 60 6 10            # survive, boss
#   modules/mod-dpssim/tools/run-sim.sh BearTankSim 120 60 6 10 100 5                               # dps, 5-pack
#

Mode = Tank

TankScenario = dps
TankHitDamage = 2250-2750
TankPackHitDamage = 500-600
TankSwingMs = 2000
TankDummyCrit = true

# Pre-pull buff phase: the default 15000 sim ms.

# Dummy armor: the same 4,350 as every tank profile.
TargetArmor = 4350

# CLASS_DRUID (SharedDefines.h)
Class = 11

# Talents: AiPlayerbot.PremadeSpecLink.11.1.60 ("bear pve", the bear tank premade; slot 7 is the Bestial Fury bear DPS
# build) of the live env/dist/etc/modules/playerbots.conf. Decoded against the live talent_dbc (tabs in tab-page order:
# Balance 283, Feral Combat 281, Restoration 282; talents in (row, column) order): 51 points, all in Feral Combat,
# every rank and row gate legal:
#   Primal Attunement 3/3, Ferocity 5/5, Elder Hide 3/3, Savage Fury 2/2, Flesh Render 3/3, Feral Swiftness 2/2,
#   Survival Instincts 1/1, Sharpened Claws 3/3, Primal Fury 2/2, Natural Reaction 3/3, Heart of the Wild 3/3, Survival
#   of the Fittest 3/3, Leader of the Pack 1/1, Savage Defense 2/2, Infected Wounds 3/3, Protector of the Pack 3/3, King
#   of the Jungle 3/3, Improved Mangle 2/2, Iron Hide 3/3, Berserk 1/1
# Elder Hide (200440-200442) marks the bear build; Bestial Fury (200425) is not taken.
PlayerbotTalents = -353020032130002003003300120333200031

# Unglyphed, as every tank profile (the live AiPlayerbot.BotGlyphs = 0 would win anyway).
PlayerbotGlyphs = false

# Gear: docs/.items.md "Feral Tank Druid Dungeon Gear", with one change: the set's weapon, Brutality Blade (18832, a
# one-hand sword) is a weapon a druid cannot train, so Ursol's Claw (24155: two-hand staff, 144-268, 3.0 speed, +14
# Agility, +30 attack power; the weapon of BearDpsSim / FeralCatSim) takes its place. Bear Form's feral attack power
# comes from the weapon's DPS (68.7 for the staff, 51.6 for the sword), so the swap adds about 240 bear attack power.
# Real items, no synthetic top-up (armor and dodge rating only come from items), in this order:
#   13404 Mask of the Unforgiven, 22150 Beads of Ogre Might, 12927 Truestrike Shoulders, 18689 Phantasmal Cloak,
#   12757 Breastplate of Bloodthirst, 12966 Blackmist Armguards, 15063 Devilsaur Gauntlets, 13252 Cloudrunner Girdle,
#   15062 Devilsaur Leggings, 22472 Boots of Ferocity, 2246 Myrmidon's Signet, 17713 Blackstone Ring, 24155 Ursol's
#   Claw.
# Gear totals from the live item_template: armor 1,064, Strength 85, Agility 67, Stamina 156, dodge rating 11, crit
# rating 100, hit rating 104 (no effect: 100% PvE hit), attack power 30; plus the equip spells of 22150 / 12927 (14027),
# 15062 (15811), 15063 (9335) and 17713 (9331) from the client DBC (attack power and crit; not in spell_dbc) and the
# Devilsaur 2-piece (itemset 143).
# Expected sheet (level-60 Tauren druid: player_class_stats + player_race_stats 1,483 health, 70 Strength, 56 Agility,
# 71 Stamina; caster form here, the bear's numbers come from the "actor after the first second" log line):
#   caster form: Strength 155, Agility 123, Stamina 227 -> health 1,483 + (227 - 20) x 10 + 20 = 3,573 (about 3,750
#   with the Tauren +5%), armor 1,064 + 2 x 123 = 1,310, defense 300 (no defense rating), no parry, no block;
#   Bear Form then adds its armor multiplier on the items' armor, Elder Hide / Iron Hide / Heart of the Wild (stamina in
#   bear) and Feral Swiftness dodge; dodge rating 11 is about 0.9%. Expect bear armor of several thousand, dodge in the
#   teens, health about 4,500-5,000; TS3b records the real values.
# Crit chance: 5.6% from a +3 boss minus Survival of the Fittest 3/3 (stock: 2% each rank) = 0: crit immune in Bear
# Form if the rework kept the stock talent; TS3b reads it from the expected crit chance after the first second (a crit
# taken at chance 0 is flagged as a bug).
Gear = 13404,22150,12927,18689,12757,12966,15063,13252,15062,22472,2246,17713,24155

SpellPower = 0
AttackPower = 0

StatWeightsEnabled = false
